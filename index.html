<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SONGDIH</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html { cursor: pointer; }
  body { -webkit-user-select: none; user-select: none; cursor: pointer; }
  button, .btn, .char-card { cursor: pointer; -webkit-appearance: none; }
  body {
    background: #f5f5f5;
    color: #111;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .screen { display: none; width: 100%; height: 100vh; align-items: center; justify-content: center; flex-direction: column; }
  .screen.active { display: flex; }

  /* MAIN MENU */
  #mainMenu { background: #fff; }
  .game-title { font-size: clamp(36px, 8vw, 72px); font-weight: 900; letter-spacing: 10px; color: #111; margin-bottom: 6px; }
  .game-subtitle { color: #999; font-size: 13px; letter-spacing: 4px; margin-bottom: 60px; }
  .btn {
    background: #111; border: none; padding: 14px 44px;
    font-size: 18px; font-weight: 700; color: #fff; border-radius: 6px;
    cursor: pointer; letter-spacing: 1px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:hover { background: #333; transform: translateY(-1px); }
  .btn:active { background: #333; transform: translateY(0); }
  .btn-secondary {
    background: #ddd; color: #333; margin-top: 10px;
    font-size: 14px; padding: 10px 32px;
  }
  .btn-secondary:hover { background: #ccc; }
  .btn-secondary:active { background: #bbb; }

  /* CHAR SELECT */
  #charSelect { background: #fff; gap: 16px; overflow-y: auto; padding: 20px; justify-content: flex-start; align-items: center; }
  .select-title { font-size: 24px; font-weight: 800; color: #111; letter-spacing: 2px; margin-bottom: 4px; }
  .select-hint { font-size: 12px; color: #999; margin-bottom: 20px; }
  .chars-row { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .char-card {
    width: 148px; background: #f9f9f9; border: 2px solid #ddd;
    border-radius: 12px; padding: 18px 12px; cursor: pointer;
    transition: all 0.15s; text-align: center; position: relative;
  }
  .char-card:hover { border-color: #aaa; transform: translateY(-2px); }
  .char-card:active { border-color: #111; transform: translateY(0); }
  .char-card.selected { border-color: #111; background: #f0f0f0; }
  .char-card.selected::after {
    content: '✓'; position: absolute; top: 8px; right: 10px;
    color: #111; font-size: 16px; font-weight: 900;
  }
  .char-circle {
    width: 68px; height: 68px; border-radius: 50%;
    margin: 0 auto 10px; display: flex; align-items: center;
    justify-content: center; font-size: 11px; font-weight: 700;
    color: #fff; text-align: center; line-height: 1.3;
  }
  .char-name { font-size: 14px; font-weight: 700; color: #111; margin-bottom: 5px; }
  .char-stats { font-size: 11px; color: #888; line-height: 1.7; }
  .select-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .selected-info { font-size: 13px; color: #555; min-height: 18px; }

  /* BATTLE */
  #battle { background: #fff; flex-direction: column; gap: 0; padding: 0; align-items: center; justify-content: flex-start; position: relative; overflow: hidden; }
  @media (orientation: landscape) and (min-width: 600px) {
    #battle { flex-direction: row; justify-content: center; align-items: stretch; }
  }
  .side-ui { width: clamp(120px, 18vw, 176px); flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; padding: 12px 10px; gap: 8px; }
  @media (orientation: portrait) or (max-width: 599px) {
    .side-ui { width: auto; flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 6px 8px; gap: 4px; max-height: 80px; overflow: hidden; }
    #ui-p1, #ui-p2, #ui-p3, #ui-p4 { width: auto; }
  }
  .side-ui.left { align-items: flex-start; }
  .side-ui.right { align-items: flex-end; }
  .fighter-label { font-size: 14px; font-weight: 800; margin-bottom: 3px; }
  .player-tag { font-size: 11px; color: #999; margin-bottom: 6px; }
  .hp-bar-bg { width: 140px; height: 12px; background: #e0e0e0; border-radius: 6px; overflow: hidden; margin-bottom: 2px; }
  .hp-bar-fill { height: 100%; border-radius: 6px; transition: width 0.12s; }
  .hp-text { font-size: 11px; color: #888; margin-bottom: 8px; }
  .skill-bar-bg { width: 140px; height: 5px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
  .skill-bar-fill { height: 100%; border-radius: 3px; transition: width 0.18s; }
  .skill-label { font-size: 10px; color: #999; margin-top: 3px; }

  #arena-wrap { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; overflow: hidden; }
  #arena { background: #fff; border: 2px solid #222; position: relative; overflow: hidden; }
  canvas { display: block; }

  /* RESULT */
  #result { background: #fff; }
  .winner-text { font-size: 56px; font-weight: 900; color: #111; margin-bottom: 4px; }
  .victory-text { font-size: 20px; color: #888; letter-spacing: 6px; margin-bottom: 50px; }
  /* 인트로 애니메이션 */
  #introOverlay {
    position: fixed; inset: 0; background: #000; z-index: 9999;
    pointer-events: none;
    transform: translateX(0);
  }
  #introOverlay.slide-out {
    animation: introSlide 0.7s cubic-bezier(0.7,0,0.3,1) forwards;
  }
  @keyframes cardSlideIn {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes cardThud {
    0%   { opacity: 0; transform: scale(0.3) translateY(-20px); }
    60%  { opacity: 1; transform: scale(1.15) translateY(0); }
    80%  { transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes cardSuperThud {
    0%   { opacity: 0; transform: scale(0.1) translateY(-30px); }
    55%  { opacity: 1; transform: scale(1.25) translateY(0); box-shadow: 0 0 40px rgba(200,168,0,0.9); }
    75%  { transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }
  .card-slide {
    opacity: 0;
    animation: cardSlideIn 0.35s cubic-bezier(0.34,1.4,0.64,1) forwards;
  }
  .card-thud {
    opacity: 0;
    animation: cardThud 0.5s cubic-bezier(0.2,0.8,0.4,1) forwards;
  }
  .card-super-thud {
    opacity: 0;
    animation: cardSuperThud 0.7s cubic-bezier(0.2,0.8,0.4,1) forwards;
  }

  @keyframes introSlide {
    0%   { transform: translateX(0); opacity: 1; }
    100% { transform: translateX(-105%); opacity: 1; }
  }

  /* 메인 메뉴 UI 드롭인 */
  .drop-item {
    opacity: 0;
    transform: translateY(-40px);
    animation: dropIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes dropIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes starFloat {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-80px) scale(0.3); opacity: 0; }
  }
  #unlockOkBtn:active { transform: scale(0.95); }
  #unlockOkBtn:hover { background: #ffd700; }
</style>
</head>
<body onclick="void(0)">
<div id="introOverlay"></div>

<!-- MAIN MENU -->
<div id="mainMenu" class="screen active" onclick="void(0)">
  <div class="game-title drop-item" style="animation-delay:0.7s">SONGDIH</div>
  <div class="game-subtitle drop-item" style="animation-delay:0.9s">THE BATTLE OF LEGENDS</div>
  <button class="btn drop-item" id="btn-start" style="animation-delay:1.1s">게임 시작</button>
  <button class="btn btn-secondary drop-item" id="btn-predict" style="margin-top:8px;animation-delay:1.3s">🔮 예측 모드</button>
</div>

<!-- 금일철 컷씬 -->

  <div id="geumFlash" style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity 0.1s"></div>
</div>

<!-- HIDDEN UNLOCK OVERLAY -->
<div id="unlockOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:1000;flex-direction:column;align-items:center;justify-content:center;transition:background 0.5s">

    <div id="unlockName" style="font-size:28px;font-weight:900;color:#fff;margin-bottom:24px"></div>
    <div id="unlockIcon" style="width:80px;height:80px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;border:3px solid rgba(255,255,255,0.3)"></div>
    <button id="unlockOkBtn" style="padding:12px 36px;background:#f5c518;color:#111;border:none;border-radius:12px;font-size:16px;font-weight:900;cursor:pointer;letter-spacing:1px" onclick="closeUnlockOverlay()">OK</button>
  </div>
</div>

<!-- PREDICT MODE -->
<div id="predictMode" class="screen" onclick="void(0)">
  <div class="select-title">🔮 예측 모드</div>

  <div style="display:flex;gap:32px;justify-content:center;align-items:center;margin-bottom:24px">
    <div id="predictCardA" class="char-card" style="cursor:pointer" id="predictCardA-inner"></div>
    <div style="font-size:28px;font-weight:900;color:#888">VS</div>
    <div id="predictCardB" class="char-card" style="cursor:pointer" id="predictCardB-inner"></div>
  </div>
  <div id="predictHint" style="font-size:13px;color:#555;margin-bottom:12px">승자로 예측하는 캐릭터를 선택하세요</div>
  <button class="btn btn-secondary" onclick="showScreen('mainMenu')" ontouchend="event.preventDefault();showScreen('mainMenu')">← 메인 메뉴</button>

<!-- PREDICT RESULT -->
<div id="predictResult" class="screen" onclick="void(0)">

<!-- RESULT -->
<div id="result" class="screen" onclick="void(0)">

  <button class="btn btn-secondary" id="btn-result-main" style="margin-top:8px">메인 메뉴</button>
</div>

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  // 메인 메뉴 복귀 시 drop-item 애니메이션 제거 (최초 1회만)
  if (id === 'mainMenu' && window._introPlayed) {
    document.querySelectorAll('#mainMenu .drop-item').forEach(el => {
      el.style.animation = 'none';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  }
}

// ─── iOS 터치 이벤트 통합 등록 ───
function _bindBtn(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchstart', function(e) {
    e.preventDefault();
    fn();
  }, { passive: false });
  el.addEventListener('click', fn);
}

function _initTouchBindings() {
  _bindBtn('btn-start', showCharSelect);
  _bindBtn('btn-predict', startPredictMode);
  _bindBtn('btn-back-main', () => showScreen('mainMenu'));
  _bindBtn('btn-back-charselect', () => showScreen('mainMenu'));
  _bindBtn('startBattleBtn', () => { const btn = document.getElementById('startBattleBtn'); if (!btn.disabled) startBattle(); });
  _bindBtn('btn-cam-prev', () => camShift(-1));
  _bindBtn('btn-cam-next', () => camShift(1));
  _bindBtn('btn-retry-predict', startPredictMode);
  _bindBtn('btn-result-retry', () => {
    if (window._fromPredict) { startPredictMode(); }
    else { showCharSelect(); }
  });
  _bindBtn('btn-result-main', () => showScreen('mainMenu'));
  _bindBtn('unlockOkBtn', closeUnlockOverlay);
  ['05','1','2','3'].forEach((s,i) => {
    const speeds = [0.5,1,2,3];
    _bindBtn('spd'+s, () => setSpeed(speeds[i]));
  });
  // 예측 카드
  const pa = document.getElementById('predictCardA');
  const pb = document.getElementById('predictCardB');
  if (pa) {
    pa.addEventListener('touchstart', (e) => { e.preventDefault(); choosePrediction('A'); }, {passive:false});
    pa.addEventListener('click', () => choosePrediction('A'));
  }
  if (pb) {
    pb.addEventListener('touchstart', (e) => { e.preventDefault(); choosePrediction('B'); }, {passive:false});
    pb.addEventListener('click', () => choosePrediction('B'));
  }
  // 히든 코드 입력 - 더미 추가 버튼은 buildCharSelect에서 처리
}

let predictState = { defA: null, defB: null, userPick: null };

function startPredictMode() {
  // 더미 제외 캐릭터 목록
  const pool = CHARACTER_DEFS.filter(d => !d.isDummy && d.group !== 'HIDDEN' && d.group !== 'SUPER_HIDDEN');
  // 랜덤 두 캐릭터
  const shuffled = pool.sort(() => Math.random() - 0.5);
  const defA = shuffled[0], defB = shuffled[1];
  predictState = { defA, defB, userPick: null };

  // 카드 렌더
  function renderPredictCard(el, def) {
    el.innerHTML = `
      <div class="char-circle" style="background:${def.color}">${def.name}</div>
      <div class="char-name">${def.name}</div>
      <div class="char-stats">HP: ${def.hp}<br>접촉: ${def.touchDmg}</div>
    `;
    el.style.border = '2px solid #ccc';
    el.ontouchstart = (e) => { e.preventDefault(); choosePrediction(el.id === 'predictCardA' ? 'A' : 'B'); };
  }
  renderPredictCard(document.getElementById('predictCardA'), defA);
  renderPredictCard(document.getElementById('predictCardB'), defB);
  document.getElementById('predictHint').textContent = '승자로 예측하는 캐릭터를 선택하세요';
  showScreen('predictMode');
}

function choosePrediction(side) {
  predictState.userPick = side;
  // 카드 후광 표시
  ['A','B'].forEach(s => {
    const card = document.getElementById('predictCard' + s);
    if (!card) return;
    if (s === side) {
      card.style.border = '3px solid #f5c518';
      card.style.boxShadow = '0 0 18px 6px rgba(245,197,24,0.7), 0 0 40px 12px rgba(245,197,24,0.3)';
      card.style.transform = 'scale(1.06)';
      card.style.transition = 'all 0.2s';
    } else {
      card.style.border = '2px solid #ccc';
      card.style.boxShadow = 'none';
      card.style.transform = 'scale(1)';
    }
  });
  document.getElementById('predictHint').textContent = `${side === 'A' ? predictState.defA.name : predictState.defB.name} 을(를) 예측했습니다! 전투를 관전하세요...`;

  // 잠시 후 실제 전투 실행
  setTimeout(() => {
    // 두 캐릭터로 배틀 시작
    selectedChars = [predictState.defA.id, predictState.defB.id];
    window._predictMode = true;
    startBattle();
  }, 1200);
}

function checkPredictResult() {
  if (!window._predictMode) return;
  window._predictMode = false;
  window._fromPredict = true;
  const winner = gameState.winner;
  const isDraw = gameState.draw;

  let correct = false, resultIcon, resultText, detail;

  if (isDraw || !winner) {
    resultIcon = '🤝';
    resultText = '무승부!';
    detail = '예측 불가 — 무승부가 발생했습니다';
  } else {
    const winnerSide = winner.def.id === predictState.defA.id ? 'A' : 'B';
    correct = winnerSide === predictState.userPick;
    resultIcon = correct ? '✅' : '❌';
    resultText = correct ? '정답!' : '오답!';
    detail = `${winner.def.name} 이(가) 승리했습니다. 당신의 예측: ${predictState.userPick === 'A' ? predictState.defA.name : predictState.defB.name}`;
  }

  document.getElementById('predictResultIcon').textContent = resultIcon;
  document.getElementById('predictResultText').textContent = resultText;
  document.getElementById('predictResultText').style.color = correct ? '#1a7a1a' : '#cc2020';
  document.getElementById('predictResultDetail').textContent = detail;
  showScreen('predictResult');
}

function camShift(dir) {
  if (!gameState) return;
  const realFighters = gameState.fighters.filter(f => !f.isByungheonClone);
  const total = realFighters.length;
  if (total === 0) return;
  // -1 → 0 → 1 → ... → total-1 → -1
  if (cameraTarget === -1) {
    cameraTarget = dir > 0 ? 0 : total - 1;
  } else {
    cameraTarget += dir;
    if (cameraTarget >= total) cameraTarget = -1;
    if (cameraTarget < -1) cameraTarget = total - 1;
  }
  updateCamDot();
}

function updateCamDot() {
  const dot = document.getElementById('cam-dot');
  if (!dot || !gameState) return;
  const realFighters = gameState.fighters.filter(f => !f.isByungheonClone);
  if (cameraTarget === -1) {
    dot.textContent = 'FREE';
    dot.style.background = '#eee';
    dot.style.borderColor = '#ccc';
    dot.style.color = '#555';
  } else {
    const f = realFighters[cameraTarget];
    if (f) {
      dot.textContent = f.def.name;
      dot.style.background = f.def.color;
      dot.style.borderColor = f.def.color;
      dot.style.color = '#fff';
    }
  }
}

function setSpeed(s) {
  timeScale = s;
  [0.5,1,2,3].forEach(v => {
    const el = document.getElementById('spd' + String(v).replace('.',''));
    if (!el) return;
    el.style.background = v === s ? '#111' : '#fff';
    el.style.color = v === s ? '#fff' : '#111';
    el.style.border = v === s ? '2px solid #111' : '1.5px solid #ccc';
  });
}

    charIcon.style.opacity = '1';
  }, 3000);

  // 3단계: 캐릭터 완전히 나오면 대사 출력
  setTimeout(() => {
    line2.textContent = '교장이 빠지면 안되지요.';
    line2.style.opacity = '1';
  }, 5200);

  // 4단계: 화면 금빛으로 서서히 변하며 흔들림
  setTimeout(() => {
    let goldAmount = 0;
    let shakeIntensity = 0;
    let shakeInterval = setInterval(() => {
      goldAmount = Math.min(goldAmount + 2, 100);
      shakeIntensity = Math.min(shakeIntensity + 0.8, 24);
      // 배경 서서히 금빛으로
      const r = Math.round(0 + goldAmount * 2);
      const g = Math.round(0 + goldAmount * 1.68);
      const b = 0;
      cs.style.background = `rgb(${r},${g},${b})`;
      // 흔들림
      const ox = (Math.random()-0.5)*shakeIntensity;
      const oy = (Math.random()-0.5)*shakeIntensity;
      cs.style.transform = `translate(${ox}px,${oy}px)`;
    }, 50);

    // 5단계: 점멸 후 흰색 플래시
    setTimeout(() => {
      clearInterval(shakeInterval);
      cs.style.transform = '';
      // 빠른 점멸
      let blinks = 0;
      const blinkInterval = setInterval(() => {
        flash.style.opacity = blinks % 2 === 0 ? '1' : '0';
        blinks++;
        if (blinks >= 6) {
          clearInterval(blinkInterval);
          flash.style.opacity = '1';
          // 흰 화면에서 해금 연출로
          setTimeout(() => {
            cs.style.display = 'none';
            cs.style.transform = '';
            cs.style.background = '#000';
            flash.style.opacity = '0';
            line1.style.opacity = '0';
            charIcon.style.opacity = '0';
            line2.style.opacity = '0';
            showUnlockOverlay(def);
          }, 600);
        }
      }, 80);
    }, 2000);
  }, 6500);
}

function showUnlockOverlay(def) {
  const overlay = document.getElementById('unlockOverlay');
  const box = document.getElementById('unlockBox');
  const name = document.getElementById('unlockName');
  const icon = document.getElementById('unlockIcon');
  if (!overlay || !box) return;

  name.textContent = def.name + '!!';
  icon.style.background = def.color;
  icon.textContent = def.name;

  overlay.style.display = 'flex';
  // 페이드인
  requestAnimationFrame(() => {
    overlay.style.background = 'rgba(0,0,0,0.85)';
    requestAnimationFrame(() => {
      box.style.transform = 'scale(1)';
      box.style.opacity = '1';
    });
  });

  // 별 파티클 효과
  const stars = ['✨','⭐','💫','🌟'];
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      const star = document.createElement('div');
      star.textContent = stars[i % stars.length];
      star.style.cssText = `position:fixed;font-size:${20+Math.random()*20}px;
        left:${10+Math.random()*80}%;top:${10+Math.random()*80}%;
        z-index:1001;animation:starFloat 1.5s ease-out forwards;pointer-events:none`;
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 1500);
    }, i * 100);
  }
}

function closeUnlockOverlay() {
  const overlay = document.getElementById('unlockOverlay');
  const box = document.getElementById('unlockBox');
  if (!overlay || !box) return;
  box.style.transform = 'scale(0.8)';
  box.style.opacity = '0';
  overlay.style.background = 'rgba(0,0,0,0)';
  setTimeout(() => {
    overlay.style.display = 'none';
    box.style.transform = 'scale(0.5)';
  }, 500);
  buildCharSelect();
}

function checkHiddenCode(val) {
  const code = val.trim().toLowerCase();
  // gold 이후 1iron 한글자씩 칠때 화면 흔들림
  if (code.length > 4 && code.startsWith('gold')) {
    const shakeAmt = (code.length - 4) * 3;
    const ox = (Math.random()-0.5)*shakeAmt, oy = (Math.random()-0.5)*shakeAmt;
    document.body.style.transform = `translate(${ox}px,${oy}px)`;
    setTimeout(() => { document.body.style.transform = ''; }, 80);
  }
  const msg = document.getElementById('hiddenCodeMsg');
  // 히든 코드 목록 (추후 추가)
  const hiddenCodes = {
    'd0gyung': 'dogyungyun',
    'ye0nhuu': 'yeonhoo',
    'hansehwan': 'sehwan',
    'gold1iron': 'geumilcheol',
  };
  if (hiddenCodes[code]) {
    const charId = hiddenCodes[code];
    if (!unlockedHidden.has(charId)) {
      unlockedHidden.add(charId);
      const unlockedDef = CHARACTER_DEFS.find(d => d.id === charId);
      if (unlockedDef) {
        if (unlockedDef.id === 'geumilcheol') {
          showGeumCutscene(unlockedDef);
        } else {
          showUnlockOverlay(unlockedDef);
        }
      }
      if (msg) { msg.textContent = '✅ 해금!'; msg.style.color = '#1a7a1a'; }
    } else {
      if (msg) { msg.textContent = '이미 해금됨'; msg.style.color = '#aaa'; }
    }
  } else if (code.length >= 3) {
    if (msg) { msg.textContent = '❌ 틀린 코드'; msg.style.color = '#cc2020'; }
  } else {
    if (msg) { msg.textContent = ''; }
  }
}

function addDummy() {
  if (selectedChars.length >= 4) selectedChars.shift();
  selectedChars.push('dummy');
  updateSelectUI();
}

function toggleChar(id) {
  if (selectedChars.includes(id)) {
    selectedChars = selectedChars.filter(c => c !== id);
  } else {
    if (selectedChars.length >= 4) selectedChars.shift();
    selectedChars.push(id);
  }
  updateSelectUI();
}

function updateSelectUI() {
  CHARACTER_DEFS.forEach(def => {
    const card = document.getElementById('card-' + def.id);
    if (card && !def.isDummy) card.classList.toggle('selected', selectedChars.includes(def.id));
  });
  const info = document.getElementById('selectedInfo');
  const btn = document.getElementById('startBattleBtn');
  const names = selectedChars.map(id => CHARACTER_DEFS.find(d => d.id === id).name);
  if (selectedChars.length === 0) info.textContent = '선택: 없음';
  else if (selectedChars.length === 1) info.textContent = `P1: ${names[0]}`;
  else if (selectedChars.length === 2) info.textContent = `P1: ${names[0]}  /  P2: ${names[1]}`;
  else if (selectedChars.length === 3) info.textContent = `P1: ${names[0]}  /  P2: ${names[1]}  /  P3: ${names[2]}`;
  else info.textContent = `P1: ${names[0]}  /  P2: ${names[1]}  /  P3: ${names[2]}  /  P4: ${names[3]}`;
  const ready = selectedChars.length >= 2;
  btn.disabled = !ready;
  btn.style.opacity = ready ? '1' : '0.35';
}

      {x: W-70 + Math.random()*40, y: H-70 + Math.random()*40},
    ].sort(()=>Math.random()-0.5).slice(0,2);
    partNames.forEach((name, i) => {
      let x, y;
      if (name === '검') {
        // 검은 맵 중앙 근처
        x = W/2 + (Math.random()-0.5)*100;
        y = H/2 + (Math.random()-0.5)*100;
      } else if (i < 2) {
        x = corners[i].x; y = corners[i].y;
      } else {
        x = 60 + Math.random() * (W - 120);
        y = 60 + Math.random() * (H - 120);
      }
      gundamParts.push({ x, y, name, r: name === '검' ? 20 : 14, collected: false });
    });
  }
  const notes = [];
  const particles = [];
  const walls = [];   // 김기원 벽 목록
  const gears = [];   // 김기원 톱니바퀴 목록
  const soundwaves = []; // 한수민 쳐웃기 음파
  const saywords = [];   // 한수민 say/wallahi 투사체
  const gases = [];      // 김태양 트름 가스
  const turrets = [];    // 정승빈 터렛
  const mopWaters = [];  // 정영훈 물자국
  const syringes = [];   // 김혜경T 주사기
  const bombs = [];      // 황승오T 든든든 폭발물
  const sunflowers = []; // 정승빈 해바라기
  const hairs = [];      // 유채완 머리카락
  const greenHairs = []; // 유채완 회복용 초록 머리카락

  const dmgDealt = new Array(fighters.length).fill(0);
  gameState = { fighters, notes, particles, walls, gears, soundwaves, saywords, gases, hairs, greenHairs, totalHairCollected: 0, dmgTexts: [], dmgDealt, turrets, sunflowers, bombs, mopWaters, syringes, gundamParts, sehwanRoom: false, geumBullets: [], geumFireZones: [], shake: 0, over: false, winner: null };
  document.getElementById('ui-p3').style.display = isTriple ? 'flex' : 'none';
  document.getElementById('ui-p4').style.display = isQuad ? 'flex' : 'none';
  buildBattleUI(fighters);

  let lastTime = performance.now();
  function tick(now) {
    const dt = Math.min(now - lastTime, 50) * timeScale;
    lastTime = now;
    try {
      update(dt);
      render(canvas.getContext('2d'));
      renderRoom();
    } catch(e) {
      cancelAnimationFrame(gameLoop);
      // 에러를 화면에 표시
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#c00';
      ctx.font = 'bold 13px monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      const msg = ('ERROR: ' + e.message + '\n\n' + (e.stack||'').slice(0,400)).match(/.{1,55}/g) || [];
      msg.forEach((line, i) => ctx.fillText(line, 8, 10 + i * 16));
      return;
    }
    if (!gameState.over) gameLoop = requestAnimationFrame(tick);
    else endGame();
  }
  gameLoop = requestAnimationFrame(tick);
}

// ─────────────────────────────────────────
// WALL HELPERS
// ─────────────────────────────────────────
// Wall: { x, y, half, spikeLen, ownerId, spikeCooldowns:[top,right,bottom,left] }
// Spike directions: 0=top, 1=right, 2=bottom, 3=left
const SPIKE_DX = [0, 1, 0, -1];
const SPIKE_DY = [-1, 0, 1, 0];

function wallSpikeHit(fighter, wall) {
  // Returns spike index that fighter hits, or -1
  const half = wall.half;
  const sk = wall.spikeLen;
  // Spike tip positions
  for (let d = 0; d < 4; d++) {
    const tipX = wall.x + SPIKE_DX[d] * (half + sk);
    const tipY = wall.y + SPIKE_DY[d] * (half + sk);
    // Spike is a line from wall edge to tip; approximate collision as circle vs point
    const baseX = wall.x + SPIKE_DX[d] * half;
    const baseY = wall.y + SPIKE_DY[d] * half;
    // Check fighter circle against spike segment
    const dist = pointSegDist(fighter.x, fighter.y, baseX, baseY, tipX, tipY);
    if (dist < fighter.r + 4) return d;
  }
  return -1;
}

function pointSegDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lenSq = dx*dx + dy*dy;
  if (lenSq === 0) return Math.hypot(px-ax, py-ay);
  const t = Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / lenSq));
  return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

function wallBodyHit(fighter, wall) {
  // AABB vs circle
  const half = wall.half;
  const nearX = Math.max(wall.x - half, Math.min(fighter.x, wall.x + half));
  const nearY = Math.max(wall.y - half, Math.min(fighter.y, wall.y + half));
  return Math.hypot(fighter.x - nearX, fighter.y - nearY) < fighter.r;
}

// ─────────────────────────────────────────
// UPDATE
// ─────────────────────────────────────────
function update(dt) {
  const { fighters, notes, particles, walls } = gameState;

  // 올라가! 플래그 초기화 후 세팅 (루프 전)
  fighters.forEach(f => { f.isHyunLifted = false; });
  fighters.forEach(f => {
    if (f.def.id !== 'hyuncheol' || !f.hyunFrozenTargets) return;
    f.hyunFrozenTargets.forEach(entry => {
      const tgt = fighters[entry.fIdx];
      if (tgt && tgt.hp > 0) tgt.isHyunLifted = true;
    });
  });

  fighters.forEach((f, idx) => {
    if (f.hp <= 0) return; // 사망한 캐릭터 스킵
    const enemies = fighters.filter((ft, i) => i !== idx && ft.hp > 0 && !!ft.sehwanInRoom === !!f.sehwanInRoom);
    if (enemies.length === 0) { // 적 없으면 기존 속도 유지하고 스킵
      f.x += f.vx * timeScale; f.y += f.vy * timeScale;
      return;
    }
    const enemy = enemies[0]; // 주 적 (첫 번째)

    // 속도가 기준과 다르면 서서히 정상으로 복귀 (넉백·감속·가속 모두 포함)
    if (f.def.isDummy) { f.vx = 0; f.vy = 0; }
    if (!f.awakeningActive && !(f.def.id === 'giwon' && f.tidalActive) && !f.def.isDummy && !(f.def.id === 'yeonhoo' && f.yeonhooItem === '광속질주')) {
      const hairMult = f.hairSlow || 1.0;
      const tidalMult = (f.def && f.def.id === 'giwon' && f.tidalActive) ? 3.0 : 1.0;
      const targetSpd = BASE_SPEED * (f.speedMult || 1) * (f.inGear ? 0.8 : 1.0) * hairMult * tidalMult;
      const curSpd = Math.hypot(f.vx, f.vy);
      if (curSpd > 0.05) {
        const diff = curSpd - targetSpd;
        if (Math.abs(diff) > 0.05) {
          // 넉백처럼 빠를 땐 빠르게 감속, 기어 감속처럼 느릴 땐 서서히 복귀
          const rate = diff > 0 ? 0.96 : 0.97;
          const newSpd = curSpd * rate + targetSpd * (1 - rate);
          f.vx = f.vx / curSpd * newSpd;
          f.vy = f.vy / curSpd * newSpd;
        } else {
          // 정상 속도에 도달하면 딱 맞춤
          f.vx = f.vx / curSpd * targetSpd;
          f.vy = f.vy / curSpd * targetSpd;
        }
      }
      if (f.knockback && Math.hypot(f.vx, f.vy) <= BASE_SPEED * (f.speedMult || 1) * 1.1) {
        f.knockback = false;
      }
    }

    // 김태연 각성 처리
    if (f.def.id === 'taeyeon' && f.awakeningActive) {
      f.awakeningTimer -= dt;
      f.vx = 0; f.vy = 0; // 멈춤 유지
      // 날개 펼침: 0.8초 동안 0→1
      f.wingProgress = Math.min(1, f.wingProgress + dt / 800);
      // 날개 이펙트 파티클 생성
      if (Math.random() < 0.35) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const ang = Math.random() * Math.PI * 0.8 + Math.PI * 0.1;
        const spd = Math.random() * 1.5 + 0.5;
        const px = f.x + side * f.r * (1 + Math.random() * 1.5);
        const py = f.y + (Math.random() - 0.5) * f.r * 1.2;
        (f.wingParticles = f.wingParticles || []).push({
          x: px, y: py,
          vx: side * Math.cos(ang) * spd * 0.5,
          vy: -Math.abs(Math.sin(ang)) * spd,
          life: 500 + Math.random() * 300,
          maxLife: 800,
          r: Math.random() * 3 + 1,
          color: Math.random() < 0.5 ? '#87ceeb' : '#b0e8ff'
        });
      }
      if (f.awakeningTimer <= 0) {
        f.awakeningActive = false;
        f.speedMult = 1.4;
        f.skillCooldown = 4000; // 각성 후 스킬 쿨타임 4초로 단축
        // 각성 후 무작위 방향으로 재출발
        const ang = Math.random() * Math.PI * 2;
        const spd = BASE_SPEED * f.speedMult;
        f.vx = Math.cos(ang) * spd;
        f.vy = Math.sin(ang) * spd;
      }
    }

    // 김태연 각성 후 회피 무빙: 위험 요소가 가까우면 살짝 빗겨가는 힘
    if (f.def.id === 'taeyeon' && f.awakened && !f.awakeningActive && !f.knockback) {
      const AVOID_RANGE = 160;
      const AVOID_STR = 0.42;
      let avoidX = 0, avoidY = 0;

      // 적 캐릭터 회피 (밀려나는 힘 + 수직으로 빗겨가는 힘)
      const closestEnemy = enemies.reduce((a, b) => Math.hypot(a.x-f.x,a.y-f.y) < Math.hypot(b.x-f.x,b.y-f.y) ? a : b);
      const edx = f.x - closestEnemy.x, edy = f.y - closestEnemy.y;
      const edist = Math.hypot(edx, edy) || 1;
      // 다른 적들도 회피
      enemies.forEach(en => {
        const dx2 = f.x - en.x, dy2 = f.y - en.y, d2 = Math.hypot(dx2,dy2)||1;
        if (d2 < AVOID_RANGE && en !== closestEnemy) { avoidX += (dx2/d2)*AVOID_STR*0.4*(1-d2/AVOID_RANGE); avoidY += (dy2/d2)*AVOID_STR*0.4*(1-d2/AVOID_RANGE); }
      });
      if (edist < AVOID_RANGE) {
        const t = 1 - edist / AVOID_RANGE;
        // 직접 밀려나는 힘
        avoidX += (edx / edist) * AVOID_STR * t;
        avoidY += (edy / edist) * AVOID_STR * t;
        // 수직 빗겨가는 힘: 현재 이동방향과 적 방향의 외적으로 방향 결정
        const cross = f.vx * (-edy / edist) - f.vy * (-edx / edist);
        const perpSign = cross >= 0 ? 1 : -1;
        const perpX = -edy / edist * perpSign;
        const perpY =  edx / edist * perpSign;
        avoidX += perpX * AVOID_STR * 0.9 * t;
        avoidY += perpY * AVOID_STR * 0.9 * t;
      }

      // 가시 벽 회피
      if (gameState.walls) {
        gameState.walls.forEach(wall => {
          const half = wall.half + wall.spikeLen;
          for (let sd = 0; sd < 4; sd++) {
            const tipX = wall.x + SPIKE_DX[sd] * (wall.half + wall.spikeLen);
            const tipY = wall.y + SPIKE_DY[sd] * (wall.half + wall.spikeLen);
            const sdx = f.x - tipX, sdy = f.y - tipY;
            const sdist = Math.hypot(sdx, sdy) || 1;
            if (sdist < AVOID_RANGE * 0.95) {
              const str = AVOID_STR * 0.95 * (1 - sdist / (AVOID_RANGE * 0.95));
              avoidX += (sdx / sdist) * str;
              avoidY += (sdy / sdist) * str;
            }
          }
        });
      }

      // 음표(자기 것 제외)도 살짝 회피
      if (gameState.notes) {
        gameState.notes.forEach(n => {
          if (n.owner === idx) return;
          const ndx = f.x - n.x, ndy = f.y - n.y;
          const ndist = Math.hypot(ndx, ndy) || 1;
          if (ndist < 120) {
            const str = AVOID_STR * 0.85 * (1 - ndist / 120);
            avoidX += (ndx / ndist) * str;
            avoidY += (ndy / ndist) * str;
          }
        });
      }

      // 한수민 say/wallahi/bro 회피
      if (gameState.saywords) {
        gameState.saywords.forEach(s => {
          if (s.owner === idx) return;
          const sdx = f.x - s.x, sdy = f.y - s.y;
          const sdist = Math.hypot(sdx, sdy) || 1;
          const range = s.isBro ? 130 : 100;
          const strMult = s.isBro ? 1.1 : 0.85;
          if (sdist < range) {
            const str = AVOID_STR * strMult * (1 - sdist / range);
            avoidX += (sdx / sdist) * str;
            avoidY += (sdy / sdist) * str;
          }
        });
      }

      f.vx += avoidX;
      f.vy += avoidY;

      // 각성 후 속도 클램프
      const curSpd = Math.hypot(f.vx, f.vy);
      const maxSpd = BASE_SPEED * f.speedMult * 1.6;
      if (curSpd > maxSpd) { f.vx = f.vx / curSpd * maxSpd; f.vy = f.vy / curSpd * maxSpd; }
      // 너무 느려지지 않게
      const minSpd = BASE_SPEED * f.speedMult * 0.8;
      if (curSpd > 0.1 && curSpd < minSpd) { f.vx = f.vx / curSpd * minSpd; f.vy = f.vy / curSpd * minSpd; }
    }

    // Homing (김태양 aura)
    if (f.def.id === 'taeyoung' && f.skillActive && !f.knockback) {
      const str = f.def.skill.homingStrength;
      const dx = enemy.x - f.x, dy = enemy.y - f.y;
      const len = Math.hypot(dx, dy) || 1;
      f.vx += (dx / len) * str;
      f.vy += (dy / len) * str;
      const spd = Math.hypot(f.vx, f.vy);
      // 속도 클램프: 통합 복귀 로직이 처리
    }

    f.x += f.vx * timeScale;
    f.y += f.vy * timeScale;

    // Wall bounce
    const ROFF_W = 10000;
    const _xMin = f.sehwanInRoom ? ROFF_W + f.r : f.r;
    const _xMax = f.sehwanInRoom ? ROFF_W + Math.round(W*0.5) - f.r : W - f.r;
    const _yMax = f.sehwanInRoom ? Math.round(H*0.5) - f.r : H - f.r;
    const _wallHit = f.x < _xMin || f.x > _xMax || f.y - f.r < 0 || f.y > _yMax;
    if (f.x < _xMin) { f.x = _xMin; f.vx = Math.abs(f.vx); }
    if (f.x > _xMax) { f.x = _xMax; f.vx = -Math.abs(f.vx); }
    if (f.y - f.r < 0) { f.y = f.r; f.vy = Math.abs(f.vy); }
    if (f.y > _yMax) { f.y = _yMax; f.vy = -Math.abs(f.vy); }
    // 정영훈: 벽 튕길 때 물자국 방향 순환 (가장 가까운→가장 먼→랜덤)
    if (f.def.id === 'younghoon' && _wallHit && gameState.mopWaters && gameState.mopWaters.length > 0) {
      if (!f.mopBouncePhase) f.mopBouncePhase = 0;
      const phase = f.mopBouncePhase % 3;
      let targetMop = null;
      if (phase === 0) {
        // 가장 가까운
        targetMop = gameState.mopWaters.reduce((a,b) =>
          Math.hypot(a.x-f.x,a.y-f.y) < Math.hypot(b.x-f.x,b.y-f.y) ? a : b);
      } else if (phase === 1) {
        // 가장 먼
        targetMop = gameState.mopWaters.reduce((a,b) =>
          Math.hypot(a.x-f.x,a.y-f.y) > Math.hypot(b.x-f.x,b.y-f.y) ? a : b);
      }
      // phase 2: 랜덤 방향 (targetMop null → 기존 vx/vy 유지)
      if (targetMop) {
        const mopAng = Math.atan2(targetMop.y - f.y, targetMop.x - f.x);
        const spd = Math.hypot(f.vx, f.vy);
        f.vx = Math.cos(mopAng) * spd;
        f.vy = Math.sin(mopAng) * spd;
      } else {
        // 랜덤 방향
        const randAng = Math.random() * Math.PI * 2;
        const spd = Math.hypot(f.vx, f.vy);
        f.vx = Math.cos(randAng) * spd;
        f.vy = Math.sin(randAng) * spd;
      }
      f.mopBouncePhase++;
    }
    // TIDAL WAVE: 벽 튕김 후 인덱스 기반 반사
    if (f.def.id === 'giwon' && f.tidalActive && f.tidalDirIdx !== undefined) {
      const DIAG_ANGS = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
      // 현재 vx,vy 부호로 인덱스 재결정
      const nx = f.vx >= 0 ? 1 : -1;
      const ny = f.vy >= 0 ? 1 : -1;
      // 네 대각선 방향 중 vx,vy 부호 매칭
      if (nx > 0 && ny > 0) f.tidalDirIdx = 0; // 우하
      else if (nx < 0 && ny > 0) f.tidalDirIdx = 1; // 좌하
      else if (nx < 0 && ny < 0) f.tidalDirIdx = 2; // 좌상
      else f.tidalDirIdx = 3; // 우상
      const TIDAL_SPD = BASE_SPEED * (f.tidalSpdMult || 3);
      f.vy = Math.sin(DIAG_ANGS[f.tidalDirIdx]) * TIDAL_SPD;
    }

    // 김태연 천안문 쿨타임
    if (f.def.id === 'taeyeon') {
      if (!f.isHyunLifted) f.tiananmenCooldown = Math.max(0, (f.tiananmenCooldown || 20000) - dt);
      if (f.tiananmenCooldown <= 0 && !f.tiananmenReady) {
        f.tiananmenReady = true;
      }
      if (f.tiananmenText) f.tiananmenText.timer -= dt;
    }

    // 천안문에 갇힌 상태 처리
    if (f.tiananmenCaged && f.tiananmenCageTimer > 0) {
      f.tiananmenCageTimer -= dt;
      f.vx = 0; f.vy = 0; // 못 움직임
      // 박스도 같이 이동
      if (f.tiananmenBox) {
        const box = f.tiananmenBox;
        box.x += box.vx * timeScale;
        box.y += box.vy * timeScale;
        // 벽 튕김 (sehwanInRoom이면 ROOM 좌표계)
        const _boxXMin = f.sehwanInRoom ? 10000 + box.w/2 : box.w/2;
        const _boxXMax = f.sehwanInRoom ? 10000 + Math.round(W*0.5) - box.w/2 : W - box.w/2;
        const _boxYMax = f.sehwanInRoom ? Math.round(H*0.5) - box.h/2 : H - box.h/2;
        let bounced = false;
        if (box.x < _boxXMin) { box.x = _boxXMin; box.vx = Math.abs(box.vx); bounced = true; }
        if (box.x > _boxXMax) { box.x = _boxXMax; box.vx = -Math.abs(box.vx); bounced = true; }
        if (box.y - box.h/2 < 0) { box.y = box.h/2; box.vy = Math.abs(box.vy); bounced = true; }
        if (box.y > _boxYMax) { box.y = _boxYMax; box.vy = -Math.abs(box.vy); bounced = true; }
        if (bounced) {
          box.bounces = (box.bounces || 0) + 1;
          if (gameState) gameState.shake = Math.max(gameState.shake || 0, 10);
          applyDmg(f, 3);
          spawnParticle(particles, f.x, f.y, '#8b0000', 6);
        }
        // 캐릭터 위치 = 박스 중심
        f.x = box.x;
        f.y = box.y;
        // 감속
        box.vx *= 0.97;
        box.vy *= 0.97;
      }
      if (f.tiananmenCageTimer <= 0) {
        f.tiananmenCaged = false;
        f.tiananmenBox = null;
        // 속도 정상화
        const releaseAng = Math.atan2(f.vy, f.vx) || 0;
        const releaseSpd = BASE_SPEED * (f.speedMult || 1);
        f.vx = Math.cos(releaseAng) * releaseSpd;
        f.vy = Math.sin(releaseAng) * releaseSpd;
        f.knockback = false;
      }
    }

    // 김기원 TIDAL WAVE
    if (f.def.id === 'giwon') {
      // 발동 체크 (체력 50 미만, 1회)
      if (!f.tidalTriggered && f.hp > 0 && f.hp < 40) {
        f.tidalTriggered = true;
        f.tidalTransforming = true;
        f.tidalTransformTimer = 1500;
        f.vx = 0; f.vy = 0;
        f.tidalTextAnim = { timer: 1200 };
        spawnParticle(gameState.particles, f.x, f.y, '#00aacc', 20);
      }
      // 변신 연출 중 (무적, 정지)
      if (f.tidalTransforming) {
        f.tidalTransformTimer -= dt;
        f.vx = 0; f.vy = 0;
        if (f.tidalTransformTimer <= 0) {
          f.tidalTransforming = false;
          f.tidalActive = true;
          // 45도 방향 중 랜덤으로 출발
          const DIAG_ANGS = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
          f.tidalDirIdx = Math.floor(Math.random() * 4);
          f.tidalSpdMult = 2; // 초기 속도 (서서히 상승)
          const spd = BASE_SPEED * f.tidalSpdMult;
          f.vx = Math.cos(DIAG_ANGS[f.tidalDirIdx]) * spd;
          f.vy = Math.sin(DIAG_ANGS[f.tidalDirIdx]) * spd;
          f.tidalChargeTimer = 2000 + Math.random() * 2000;
        }
      }
      // TIDAL WAVE 잔상 기록
      if (f.tidalActive && !f.tidalTransforming) {
        if (!f.tidalTrail) f.tidalTrail = [];
        f.tidalTrail.unshift({ x: f.x, y: f.y, alpha: 0.55 });
        if (f.tidalTrail.length > 10) f.tidalTrail.pop();
        // 잔상 알파 감소
        f.tidalTrail.forEach(t => { t.alpha *= 0.82; });
      } else if (f.tidalTrail) {
        f.tidalTrail.forEach(t => { t.alpha *= 0.7; });
        f.tidalTrail = f.tidalTrail.filter(t => t.alpha > 0.02);
      }

      // TIDAL WAVE 모드: 인덱스 기반 대각선 이동
      if (f.tidalActive && !f.tidalTransforming) {
        const DIAG_ANGS = [Math.PI/4, 3*Math.PI/4, 5*Math.PI/4, 7*Math.PI/4];
        // 이속 서서히 상승: 시작 BASE_SPEED*2, 최대 BASE_SPEED*6, 0.1초마다 조금씩 증가
        f.tidalSpdMult = Math.min(6, (f.tidalSpdMult || 2) + dt * 0.0008);
        const TIDAL_SPD = BASE_SPEED * f.tidalSpdMult;
        if (f.tidalDirIdx === undefined) f.tidalDirIdx = 0;

        // 돌진 타이머: 2~4초마다 적 방향으로 인덱스 전환
        f.tidalChargeTimer = (f.tidalChargeTimer || 0) - dt;
        if (f.tidalChargeTimer <= 0) {
          const aliveEn = fighters.filter((_,i) => i !== idx && fighters[i].hp > 0);
          if (aliveEn.length > 0) {
            const tgt = aliveEn.reduce((a,b) => Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
            const toEnemyAng = Math.atan2(tgt.y - f.y, tgt.x - f.x);
            let best = 0, bestDiff = Infinity;
            for (let di = 0; di < 4; di++) {
              let diff = Math.abs(toEnemyAng - DIAG_ANGS[di]);
              if (diff > Math.PI) diff = 2*Math.PI - diff;
              if (diff < bestDiff) { bestDiff = diff; best = di; }
            }
            f.tidalDirIdx = best;
          }
          f.tidalChargeTimer = 2000 + Math.random() * 2000;
        }

        // 인덱스로 속도 완전 고정
        f.vx = Math.cos(DIAG_ANGS[f.tidalDirIdx]) * TIDAL_SPD;
        f.vy = Math.sin(DIAG_ANGS[f.tidalDirIdx]) * TIDAL_SPD;
        f.knockback = false;
      }
      if (f.tidalTextAnim) f.tidalTextAnim.timer -= dt;
    }

    // 황승오T 스킬 처리
    if (f.def.id === 'seungoh') {
      // 스킬1 쿨타임
      if (!f.sehwanInRoom && !f.isHyunLifted) f.skillCooldown = Math.max(0, (f.skillCooldown || 4000) - dt);
      // 스킬2 쿨타임
      if (!f.isHyunLifted) f.seungohSkill2Cooldown = Math.max(0, (f.seungohSkill2Cooldown || 13000) - dt);

      const aliveReal = fighters.filter((ft, fi) => fi !== idx && ft.hp > 0 && !ft.isByungheonClone);
      const tgt = aliveReal.length > 0 ? aliveReal.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b) : null;

      // 현재 행동 처리
      if (f.seungohAction) {
        const act = f.seungohAction;
        act.timer -= dt;

        if (act.type === 'skill1') {
          // 바이 두잉 썸띵~: 박고 후퇴 3회
          const target = act.targetRef;
          if (!target || target.hp <= 0) {
            f.seungohAction = null;
            // 정상 이동 재개
            const ra = Math.random() * Math.PI * 2;
            f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
          }
          else if (act.phase === 'charge') {
            // 돌진
            const dx = target.x - f.x, dy = target.y - f.y;
            const dist = Math.hypot(dx, dy) || 1;
            f.vx = (dx/dist) * BASE_SPEED * 12;
            f.vy = (dy/dist) * BASE_SPEED * 12;
            if (dist < f.r + target.r + 5) {
              // 박음 + 텍스트
              target.lastDmgFrom = idx;
              applyDmg(target, 6.5);
              spawnParticle(particles, target.x, target.y, f.def.color, 6);
              act.count = (act.count || 0) + 1;
              // 박음 순서에 맞춰 텍스트
              const hitWords = ['바이', '두잉', '썸띵'];
              const word = hitWords[(act.count - 1) % 3] || '바이';
              if (gameState.dmgTexts) gameState.dmgTexts.push({
                x: f.x, y: f.y - f.r - 10, text: word + '!', life: 700, maxLife: 700, vy: -0.6, color: '#1a3a8f', fontSize: 16
              });
              act.phase = 'retreat';
              act.timer = 200;
            }
            // 타임아웃 방지
            if (act.timer <= 0) {
              if (act.count >= 3) {
                f.seungohAction = null;
                const ra = Math.random() * Math.PI * 2;
                f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
              } else { act.phase = 'charge'; act.timer = 50; }
            }
          } else if (act.phase === 'retreat') {
            // 후퇴
            const dx = target.x - f.x, dy = target.y - f.y;
            const dist = Math.hypot(dx, dy) || 1;
            f.vx = -(dx/dist) * BASE_SPEED * 8;
            f.vy = -(dy/dist) * BASE_SPEED * 8;
            if (act.timer <= 0) {
              if (act.count >= 3) {
                f.seungohAction = null;
                // 정상 이동 재개
                const ra = Math.random() * Math.PI * 2;
                f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
              } else { act.phase = 'charge'; act.timer = 50; }
            }
          }
        }

        else if (act.type === 'skill2') {
          // 병렬병렬 김병렬!
          const target = act.targetRef;
          if (!target || target.hp <= 0) { f.seungohAction = null; }
          else if (act.phase === 'approach') {
            // 접근
            const dx = target.x - f.x, dy = target.y - f.y;
            const dist = Math.hypot(dx, dy) || 1;
            f.vx = (dx/dist) * BASE_SPEED * 4;
            f.vy = (dy/dist) * BASE_SPEED * 4;
            if (dist < f.r + target.r + 20) {
              act.phase = 'align';
              act.timer = 600;
              target.tiananmenCaged = true; // 경직 재활용
              target.tiananmenCageTimer = 800;
              target.tiananmenBox = null; // 박스 없이 경직만
            }
          } else if (act.phase === 'align') {
            // 상대와 y축 정렬 (같은 y)
            f.vx = 0;
            const dy = target.y - f.y;
            f.vy = dy * 0.1;
            if (Math.abs(dy) < 5 || act.timer <= 0) {
              f.y = target.y;
              f.vx = 0; f.vy = 0;
              act.phase = 'headbutt';
              act.timer = 200;
            }
          } else if (act.phase === 'headbutt') {
            // 큰 박치기
            const dx = target.x - f.x, dy2 = target.y - f.y;
            const dist2 = Math.hypot(dx, dy2) || 1;
            f.vx = (dx/dist2) * BASE_SPEED * 8;
            f.vy = (dy2/dist2) * BASE_SPEED * 8;
            if (Math.hypot(target.x - f.x, target.y - f.y) < f.r + target.r + 5) {
              target.lastDmgFrom = idx;
              applyDmg(target, 20);
              // 넉백
              const kang = Math.atan2(target.y - f.y, target.x - f.x);
              target.vx = Math.cos(kang) * BASE_SPEED * 20;
              target.vy = Math.sin(kang) * BASE_SPEED * 20;
              target.knockback = true;
              target.tiananmenCaged = false;
              spawnParticle(particles, target.x, target.y, f.def.color, 14);
              gameState.shake = Math.max(gameState.shake || 0, 10);
              if (gameState.dmgTexts) gameState.dmgTexts.push({
                x: f.x, y: f.y - f.r - 8, text: '병렬!!', life: 900, maxLife: 900, vy: -0.5, color: '#4a6abf', fontSize: 15
              });
              f.seungohAction = null;
              const ra2 = Math.random() * Math.PI * 2;
              f.vx = Math.cos(ra2) * BASE_SPEED; f.vy = Math.sin(ra2) * BASE_SPEED;
            }
            if (act.timer <= 0) f.seungohAction = null;
          }
        }
      } else {
        // 행동 없을 때: 스킬 발동 체크
        if (f.skillCooldown <= 0 && tgt) {
          f.skillCooldown = f.def.skill.cooldown;
          f.seungohSkill1Count = (f.seungohSkill1Count || 0) + 1;
          f.seungohAction = { type: 'skill1', phase: 'charge', timer: 1500, count: 0, targetRef: tgt };
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 10, text: '바이 두잉 썸띵~', life: 1200, maxLife: 1200, vy: -0.4, color: '#1a3a8f', fontSize: 12
          });
          // 스킬1 2회 후 든든든 발동
          if (f.seungohSkill1Count >= 2) {
            f.seungohSkill1Count = 0;
            // 잠시 후 든든든
            setTimeout(() => {
              if (!gameState) return;
              const angles = [0, Math.PI*2/3, Math.PI*4/3];
              angles.forEach(ang => {
                const spd = BASE_SPEED * 2;
                gameState.bombs.push({
                  x: f.x + Math.cos(ang)*f.r*1.5,
                  y: f.y + Math.sin(ang)*f.r*1.5,
                  vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                  slowTimer: 1200, // 1.2초 후 정지
                  lifeTimer: 5200, // 총 잔류 시간 (이동1.2 + 대기4초)
                  armed: false, r: 14,
                  ownerId: idx,
                });
              });
              if (gameState.dmgTexts) gameState.dmgTexts.push({
                x: f.x, y: f.y - f.r - 10, text: '든- 든- 든~', life: 1500, maxLife: 1500, vy: -0.4, color: '#00aaff', fontSize: 14
              });
            }, 800);
          }
        }
        if (f.seungohSkill2Cooldown <= 0 && tgt && !f.seungohAction) {
          f.seungohSkill2Cooldown = f.def.skill2.cooldown;
          f.seungohAction = { type: 'skill2', phase: 'approach', timer: 3000, targetRef: tgt };
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 10, text: '병렬병렬 김병렬!', life: 1200, maxLife: 1200, vy: -0.4, color: '#4a6abf', fontSize: 12
          });
        }
        // 행동 없으면 자연스럽게 이동 (통합 속도 복귀)
      }
    }

    // 김태연 가사 축적 + 발사 시스템
    if (f.def.id === 'taeyeon' && f.hp > 0) {
      const LYRICS = '비상탈출구가있어마치윙맨~타고있어입양하세요날타펫';
      const TRIGGER_RANGE = 110; // 근접 발사 거리

      // 1초마다 가사 글자 하나씩 축적
      const lyricInterval = f.awakened ? 500 : 1000; // 윙맨이면 0.5초
      if (!f.isHyunLifted) f.lyricAccumTimer = (f.lyricAccumTimer || 0) + dt;
      if (f.lyricAccumTimer >= lyricInterval) {
        f.lyricAccumTimer -= lyricInterval;
        if (!f.lyricOrbit) f.lyricOrbit = [];
        f.lyricIdx = (f.lyricIdx || 0);
        const ch = LYRICS[f.lyricIdx % LYRICS.length];
        f.lyricIdx++;
        f.lyricOrbit.push({ char: ch, angle: Math.random() * Math.PI * 2, orbitR: f.r * 1.8 });
        // 가사 완성(전체 길이)되면 자동 발사
        if (f.lyricOrbit.length >= LYRICS.length) f.lyricFired = true;
      }

      // 궤도 글자 회전 애니메이션
      if (f.lyricOrbit) {
        const n = f.lyricOrbit.length;
        f.lyricOrbit.forEach((orb, oi) => {
          orb.angle += 0.03; // 회전
        });
      }

      // 근접 감지 발사
      if (!f.lyricFired && f.lyricOrbit && f.lyricOrbit.length > 0) {
        const nearEnemy = enemies.some(en => en.hp > 0 && Math.hypot(en.x - f.x, en.y - f.y) < TRIGGER_RANGE);
        if (nearEnemy) f.lyricFired = true;
      }

      // 발사 실행
      if (f.lyricFired && f.lyricOrbit && f.lyricOrbit.length > 0) {
        f.lyricFired = false;
        const speed = 11.0;
        const count = f.lyricOrbit.length;
        const aliveEn = enemies.filter(en => en.hp > 0);
        const tgtOrb = aliveEn.length > 0 ? aliveEn.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b) : null;
        f.lyricOrbit.forEach((orb, k) => {
          const baseAngle = tgtOrb ? Math.atan2(tgtOrb.y - f.y, tgtOrb.x - f.x) : Math.random() * Math.PI * 2;
          const spread = count > 1 ? (k / (count - 1) - 0.5) * 0.7 : 0;
          const angle = baseAngle + spread;
          gameState.notes.push({
            x: f.x + Math.cos(orb.angle) * orb.orbitR,
            y: f.y + Math.sin(orb.angle) * orb.orbitR,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            owner: idx, r: 10,
            lyricChar: orb.char,
          });
        });
        f.lyricOrbit = [];
        f.noteCount = (f.noteCount || 0) + 1;
      }
    }

    // 정준우 타이머 + 자동 분노
    if (f.def.id === 'junjoo' || f.nojunwoo) {
      if (f.dodgeFlicker > 0) f.dodgeFlicker -= dt;
      if (f.nojunwooAnim > 0) f.nojunwooAnim -= dt;
      // 매초 분노 2 자동 생성
      if (!f.nojunwoo) {
        if (!f.isHyunLifted) f.rageAutoTimer = (f.rageAutoTimer || 0) + dt;
        if (f.rageAutoTimer >= 1000) {
          f.rageAutoTimer -= 1000;
          f.rage = Math.min(100, (f.rage || 0) + 1);
          if (f.rage >= 100 && !f.nojunwoo) {
            f.nojunwoo = true;
            f.ragePhase = 2;
            f.def = { ...f.def, name: '노준우', color: '#cc3300', touchDmg: 15 };
            f.nojunwooAnim = 1500;
            f.speedMult = (f.speedMult || 1) * 1.3;
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 14, text: '노준우!!!', life: 2000, maxLife: 2000,
              vy: -0.4, color: '#cc3300', fontSize: 18,
            });
          }
        }
      }
      // 노준우 유도 이동 (가장 가까운 적 방향으로 약한 유도)
      if (f.nojunwoo) {
        const aliveEn2 = enemies.filter(en => en.hp > 0);
        if (aliveEn2.length > 0) {
          const tgtN = aliveEn2.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
          const ndx = tgtN.x - f.x, ndy = tgtN.y - f.y;
          const ndist = Math.hypot(ndx, ndy) || 1;
          f.vx += (ndx/ndist) * 0.25;
          f.vy += (ndy/ndist) * 0.25;
        }
      }
    }

    // 김혜경T 스킬 처리
    if (f.def.id === 'hyekyung') {
      f.skillCooldown = Math.max(0, (f.skillCooldown || 4000) - dt);
      f.hyekyungSkill2Cooldown = Math.max(0, (f.hyekyungSkill2Cooldown || 10000) - dt);
      f.hyekyungSkill3Cooldown = Math.max(0, (f.hyekyungSkill3Cooldown || 60000) - dt);

      // 인천맛집 자동 발동
      if (f.skillCooldown <= 0 && f.hp > 0) {
        f.skillCooldown = f.def.skill.cooldown;
        f.hp = Math.min(f.maxHp, f.hp + 1);
        f.speedMult = (f.speedMult || 1) * 1.4;
        f.incheonSpeedTimer = 2000; // 2초 이속 증가
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 10, text: '🍜 +1 💨', life: 1000, maxLife: 1000, vy: -0.4, color: '#e87020', fontSize: 13,
        });
      }

      // 염탐 발동
      if (f.hyekyungSkill2Cooldown <= 0 && !f.hyekyungStaring && f.hp > 0) {
        f.hyekyungSkill2Cooldown = f.def.skill2.cooldown;
        f.hyekyungStaring = true;
        f.hyekyungStareTimer = 3000;
        f.hyekyungStareDmgTimer = 0;
        f.hyekyungDark = true;
        f.hyekyungDarkTimer = 3200;
        // 가장 가까운 캐릭터 선택
        const aliveEn = enemies.filter(en => en.hp > 0 && !en.sehwanInRoom);
        f.hyekyungStareTarget = aliveEn.length > 0
          ? aliveEn.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b)
          : null;
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 10, text: '눈!', life: 1000, maxLife: 1000, vy: -0.4, color: '#222', fontSize: 14,
        });
      }

      // 염탐 처리
      if (f.hyekyungStaring) {
        f.vx = 0; f.vy = 0; // 경직
        f.awakeningActive = true; // 무적
        if (!f.isHyunLifted) f.hyekyungStareTimer -= dt;
        f.hyekyungDarkTimer = Math.max(0, (f.hyekyungDarkTimer || 0) - dt);
        f.hyekyungDark = f.hyekyungDarkTimer > 0;
        if (!f.isHyunLifted) f.hyekyungStareDmgTimer -= dt;
        if (f.hyekyungStareDmgTimer <= 0 && f.hyekyungStareTarget && f.hyekyungStareTarget.hp > 0) {
          f.hyekyungStareTarget.lastDmgFrom = idx;
          applyDmg(f.hyekyungStareTarget, 1);
          f.hyekyungStareDmgTimer = 100;
        }
        if (f.hyekyungStareTimer <= 0) {
          f.hyekyungStaring = false;
          f.awakeningActive = false;
          f.hyekyungStareTarget = null;
          const ra = Math.random() * Math.PI * 2;
          f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
        }
      }

      // 안락사 주사기 발동
      if (f.hyekyungSkill3Cooldown <= 0 && f.hp > 0) {
        f.hyekyungSkill3Cooldown = f.def.skill3.cooldown;
        const aliveEnHye = enemies.filter(en => en.hp > 0 && !en.sehwanInRoom);
        if (aliveEnHye.length > 0) {
          const tgt = aliveEnHye.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
          const ang = Math.atan2(tgt.y - f.y, tgt.x - f.x);
          gameState.syringes.push({
            x: f.x, y: f.y,
            vx: Math.cos(ang) * 0.9, vy: Math.sin(ang) * 0.9,
            r: 8, owner: idx,
          });
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 10, text: '💉 안락사', life: 1500, maxLife: 1500, vy: -0.35, color: '#cc0000', fontSize: 13,
          });
        }
      }
    }

    // 인천맛집 이속 타이머
    if (f.def.id === 'hyekyung' && (f.incheonSpeedTimer || 0) > 0) {
      if (!f.isHyunLifted) f.incheonSpeedTimer -= dt;
      if (f.incheonSpeedTimer <= 0) {
        f.incheonSpeedTimer = 0;
        f.speedMult = (f.speedMult || 1) / 1.4;
      }
    }

    // 도경윤 건담 시스템
    if (f.def.id === 'dogyungyun' || f.gundamTransformed) {
      // 파츠 수집 + 근처에서 끌어당김
      if (!f.gundamTransformed && gameState.gundamParts) {
        (gameState.gundamParts).forEach((part, pi) => {
          if (part.collected) return;
          const pdx = f.x - part.x, pdy = f.y - part.y;
          const pdist = Math.hypot(pdx, pdy) || 1;
          // 근처(반경 100px)에서 도경윤 쪽으로 끌려감
          if (pdist < 100) {
            part.x += (pdx / pdist) * 2.5;
            part.y += (pdy / pdist) * 2.5;
          }
          if (pdist < f.r + part.r) {
            part.collected = true;
            f.gundamCollected = f.gundamCollected || [];
            f.gundamCollected.push(part.name);
            // 파츠 수집 시 HP 10 회복
            f.hp = Math.min(f.maxHp, f.hp + 10);
            spawnParticle(particles, part.x, part.y, '#4a90d9', 10);
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 10, text: part.name + ' 획득!',
              life: 1000, maxLife: 1000, vy: -0.4, color: '#4a90d9', fontSize: 12,
            });
            // 6개 다 모으면 변신
            if (f.gundamCollected.length >= 7 && !f.gundamTransformAnim) {
              // 변신 연출 시작: 경직+무적
              f.gundamTransformAnim = true;
              f.awakeningActive = true; // 무적
              f.vx = 0; f.vy = 0;
              // 수집한 파츠들을 공전 시작
              f.gundamOrbitParts = f.gundamCollected.map((name, oi) => ({
                name,
                angle: (oi / 7) * Math.PI * 2,
                orbitR: 80,
                speed: 0.03,
                absorbed: false,
              }));
              f.gundamOrbitTimer = 0;
              f.gundamOrbitAbsorbed = 0;
            }
          }
        });
      }

      // 검 휘두르기 쿨타임
      if (f.gundamTransformed) {
        if (!f.isHyunLifted) f.gundamSwordTimer = Math.max(0, (f.gundamSwordTimer || 0) - dt);
        if (f.gundamSwordAnim > 0) f.gundamSwordAnim -= dt;
        // 도약 처리
        if (f.gundamLeaping && f.gundamLeapTarget) {
          const tgt = f.gundamLeapTarget;
          const dx = tgt.x - f.x, dy = tgt.y - f.y;
          const dist = Math.hypot(dx, dy) || 1;
          f.gundamLeapTimer -= dt;
          // 빠르게 돌진
          f.vx = (dx/dist) * BASE_SPEED * 7;
          f.vy = (dy/dist) * BASE_SPEED * 7;
          // 목표 근처에 닿거나 타이머 끝나면 휘두르기
          if (dist < f.r * 6.0 + tgt.r || f.gundamLeapTimer <= 0) {
            f.gundamLeaping = false;
            f.gundamLeapTarget = null;
            // 도약 후 랜덤 방향으로 정상 이동 재개
            const leapRa = Math.random() * Math.PI * 2;
            f.vx = Math.cos(leapRa) * BASE_SPEED;
            f.vy = Math.sin(leapRa) * BASE_SPEED;
            f.knockback = false;
            // 휘두르기 실행
            const ang = Math.atan2(tgt.y - f.y, tgt.x - f.x);
            const swordRange = f.r * 6.0;
            // 범위 내 모든 살아있는 적에게 데미지
            enemies.filter(en => en.hp > 0 && Math.hypot(en.x - f.x, en.y - f.y) < swordRange + en.r + 40).forEach(en => {
              en.lastDmgFrom = idx;
              applyDmg(en, 20);
              en.bleedTimer = 2000;
              en.bleedDmgTimer = 0;
              const swordKnockAng = Math.atan2(en.y - f.y, en.x - f.x);
              en.vx = Math.cos(swordKnockAng) * BASE_SPEED * 7;
              en.vy = Math.sin(swordKnockAng) * BASE_SPEED * 7;
              en.knockback = true;
              spawnParticle(particles, en.x, en.y, '#cc0000', 8);
            });
            if (Math.hypot(tgt.x - f.x, tgt.y - f.y) < swordRange + tgt.r + 40) {
              gameState.shake = Math.max(gameState.shake || 0, 6);
              if (gameState.dmgTexts) gameState.dmgTexts.push({
                x: f.x, y: f.y - f.r - 10, text: '⚔️', life: 700, maxLife: 700, vy: -0.5, fontSize: 18, color: '#cc0000'
              });
            }
            f.gundamSwordAngle = ang;
            f.gundamSwordAnim = 350;
            f.gundamSwordTimer = f.def.skill.cooldown;
          }
        }

        if (f.gundamSwordTimer <= 0 && !f.gundamLeaping) {
          const aliveEn = enemies.filter(en => en.hp > 0);
          if (aliveEn.length > 0) {
            const tgt = aliveEn.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
            // 도약 시작
            f.gundamLeaping = true;
            f.gundamLeapTimer = 600; // 0.6초 안에 도달
            f.gundamLeapTarget = tgt;
            f.gundamSwordAngle = Math.atan2(tgt.y - f.y, tgt.x - f.x);
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 10, text: '↗', life: 400, maxLife: 400, vy: -0.5, fontSize: 20, color: '#cc3300'
            });
          }
        }
        // 스킬바 업데이트
        f.skillCooldown = f.gundamSwordTimer;
      }

      // 출혈 처리
    }

    // 수면 시스템 (모든 캐릭터 - 복제체, 진실의방 제외)
    if (f.def.id !== 'youngouk' && !f.isByungheonClone && !f.sehwanInRoom && f.hp > 0) {
      // 송영욱이 필드에 있는지 확인
      const youngoukPresent = fighters.some(ft => ft.def.id === 'youngouk' && ft.hp > 0);
      if (youngoukPresent) {
        // 수면 타이머 감소
        if (f.sleepTimer < 0) {
          // 깨어있음: 다음 수면 카운트다운
          f.sleepNextTimer = (f.sleepNextTimer || 0) - dt;
          if (f.sleepNextTimer <= 0) {
            // 수면 돌입
            f.sleepTimer = 999999; // 피해 받을 때까지
            f.sleepDamageBoosted = false;
            f.vx = 0; f.vy = 0;
            f.sleepNextTimer = 5000 + Math.random() * 10000; // 다음 수면은 5~15초 후
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 10, text: '💤 zZz', life: 1200, maxLife: 1200,
              vy: -0.3, color: '#9b70d0', fontSize: 14,
            });
          }
        } else {
          // 수면 중: 이동/스킬 정지 (피해 받아야만 깸)
          f.vx = 0; f.vy = 0;
          f.sleepTimer -= dt; // 타이머는 감소하지만 999999로 크게 설정되어 있어 자연 해제 안 됨
        }
      } else {
        // 송영욱 없으면 수면 없음
        if (f.sleepTimer >= 0) {
          f.sleepTimer = -1;
          f.sleepNextTimer = 5000 + Math.random() * 10000;
        }
      }
    }

    // 송영욱T 처리
    if (f.def.id === 'youngouk' && f.hp > 0) {
      // 잠든 캐릭터 찾기
      const sleeping = fighters.filter((ft, fi) => fi !== idx && (ft.sleepTimer || 0) >= 0 && ft.hp > 0 && !ft.isByungheonClone && !ft.sehwanInRoom);

      if (f.youngoukCharging && f.youngoukChargeTarget) {
        // 돌진 중 벽 파괴
        if (gameState.walls && gameState.walls.length > 0) {
          for (let wi = gameState.walls.length - 1; wi >= 0; wi--) {
            const wall = gameState.walls[wi];
            if (Math.hypot(f.x - wall.x, f.y - wall.y) < f.r + (wall.half || 20) + 10) {
              spawnParticle(particles, wall.x, wall.y, '#3a3a8c', 8);
              gameState.walls.splice(wi, 1);
            }
          }
        }
        // 돌진 중
        const tgt = f.youngoukChargeTarget;
        if (tgt.hp <= 0 || (tgt.sleepTimer || 0) < 0) {
          // 타겟 깨어남/사망 → 취소, 정상 이동
          f.youngoukCharging = false;
          f.youngoukChargeTarget = null;
          f.youngoukChargeTimer = 0;
          const ra = Math.random() * Math.PI * 2;
          f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
        } else {
          const dx = tgt.x - f.x, dy = tgt.y - f.y;
          const dist = Math.hypot(dx, dy) || 1;
          f.vx = (dx/dist) * BASE_SPEED * 6;
          f.vy = (dy/dist) * BASE_SPEED * 6;
          if (dist < f.r + tgt.r + 5) {
            tgt.lastDmgFrom = idx;
            tgt.sleepDamageBoosted = false;
            // 송영욱 돌진: 수면 중이면 무조건 데미지 (무적 임시 해제)
            const prevAwak = tgt.awakeningActive;
            tgt.awakeningActive = false;
            applyDmg(tgt, 10);
            tgt.awakeningActive = prevAwak;
            // 깨어남 처리
            tgt.sleepTimer = -1;
            tgt.sleepNextTimer = 5000 + Math.random() * 10000;
            const ta = Math.random() * Math.PI * 2;
            tgt.vx = Math.cos(ta) * BASE_SPEED; tgt.vy = Math.sin(ta) * BASE_SPEED;
            spawnParticle(particles, tgt.x, tgt.y, '#4a2080', 12);
            gameState.shake = Math.max(gameState.shake || 0, 6);
            f.youngoukCharging = false;
            f.youngoukChargeTarget = null;
            f.youngoukChargeTimer = 0;
            const ra = Math.random() * Math.PI * 2;
            f.vx = Math.cos(ra) * BASE_SPEED; f.vy = Math.sin(ra) * BASE_SPEED;
          }
        }
      } else if (sleeping.length > 0) {
        // 잠든 캐릭터 있음: 2초 대기 후 돌진
        f.youngoukChargeTimer = (f.youngoukChargeTimer || 0) + dt;
        if (f.youngoukChargeTimer >= 2000) {
          f.youngoukCharging = true;
          f.youngoukChargeTarget = sleeping[0];
          f.youngoukChargeTimer = 0;
          const targetName = sleeping[0].def.name;
          if (gameState.dmgTexts) {
            gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 28, text: targetName + '!!',
              life: 1000, maxLife: 1000, vy: -0.5, color: '#4a2080', fontSize: 20,
            });
            gameState.dmgTexts.push({
              x: f.x, y: f.y - f.r - 10, text: '돌진!',
              life: 700, maxLife: 700, vy: -0.3, color: '#cc0000', fontSize: 14,
            });
          }
        }
      } else {
        // 잠든 캐릭터 없음: 타이머 리셋, 자연스럽게 이동
        f.youngoukChargeTimer = 0;
      }
    }

    // 금일철P 처리
    if (f.def.id === 'geumilcheol' && f.hp > 0) {
      // 금일철 사망 감지 후 디버프 해제는 사망 판정 후 처리
    }
    if (f.def.id === 'geumilcheol' && f.hp <= 0 && !f._geumDeathProcessed) {
      f._geumDeathProcessed = true;
      // 경직 해제
      f.geumGoldTargets = [];
      // 모든 캐릭터 미다스 디버프 초기화
      fighters.forEach(ft => {
        if ((ft.geumDmgReduce || 0) > 0) {
          ft.geumDmgReduce = 0;
          spawnParticle(particles, ft.x, ft.y, '#c8a800', 8);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: ft.x, y: ft.y - ft.r - 10, text: '디버프 해제!',
            life: 1000, maxLife: 1000, vy: -0.4, color: '#c8a800', fontSize: 11,
          });
        }
      });
    }

    if (f.def.id === 'geumilcheol' && f.hp > 0) {
      // 금색 경직 타겟 처리
      f.geumGoldTargets = (f.geumGoldTargets || []).filter(gt => {
        if (!gt.ref || gt.ref.hp <= 0) return false;
        gt.timer -= dt;
        gt.ref.vx = 0; gt.ref.vy = 0; // 경직
        if (gt.timer <= 0) {
          // 경직 해제 + 18 데미지 + 영구 5% 데미지 감소
          gt.ref.lastDmgFrom = idx;
          applyDmg(gt.ref, 18);
          gt.ref.geumDmgReduce = (gt.ref.geumDmgReduce || 0) + 0.05;
          spawnParticle(particles, gt.ref.x, gt.ref.y, '#c8a800', 10);
          const ra = Math.random()*Math.PI*2;
          gt.ref.vx = Math.cos(ra)*BASE_SPEED*(gt.ref.speedMult||1);
          gt.ref.vy = Math.sin(ra)*BASE_SPEED*(gt.ref.speedMult||1);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: gt.ref.x, y: gt.ref.y - gt.ref.r - 10,
            text: '💛 -5%', life: 1000, maxLife: 1000, vy: -0.4, color: '#c8a800', fontSize: 12,
          });
          return false;
        }
        return true;
      });

      // 교장선생님의 말씀 쿨타임
      f.skillCooldown = Math.max(0, (f.skillCooldown || 30000) - dt);
      if (f.skillCooldown <= 0 && !f.geumSpeechActive && f.hp > 0) {
        f.skillCooldown = 30000;
        f.geumSpeechActive = true;
        f.geumSpeechTimer = 5000;
        f.geumSpeechDmgTimer = 0;
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 14,
          text: '📢 교장선생님의 말씀!', life: 2000, maxLife: 2000,
          vy: -0.3, color: '#c8a800', fontSize: 14,
        });
        spawnParticle(particles, f.x, f.y, '#c8a800', 16);
      }

      // 철갑탄 쿨타임
      if (!f.isHyunLifted) f.geumBulletCooldown = Math.max(0, (f.geumBulletCooldown || 10000) - dt);
      if (f.geumFireAnim > 0) f.geumFireAnim -= dt;
      if (f.geumBulletCooldown <= 0 && f.hp > 0) {
        f.geumBulletCooldown = 10000;
        // 가장 먼 적
        const farthestEn = enemies.filter(en => en.hp > 0).sort((a,b) =>
          Math.hypot(b.x-f.x,b.y-f.y) - Math.hypot(a.x-f.x,a.y-f.y)
        )[0];
        if (farthestEn) {
          const bAng = Math.atan2(farthestEn.y - f.y, farthestEn.x - f.x);
          f.geumFireAngle = bAng;
          f.geumFireAnim = 600; // 발사 모션
          if (!gameState.geumBullets) gameState.geumBullets = [];
          gameState.geumBullets.push({
            x: f.x, y: f.y,
            vx: Math.cos(bAng) * 5, vy: Math.sin(bAng) * 5,
            targetRef: farthestEn,
            owner: idx, r: 12, life: 4000,
          });
          spawnParticle(particles, f.x, f.y, '#c8a800', 14);
          gameState.shake = Math.max(gameState.shake||0, 5);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 12, text: '💥 철갑탄!',
            life: 900, maxLife: 900, vy: -0.4, color: '#888', fontSize: 14,
          });
        }
      }

      // 연설 처리
      if (f.geumSpeechActive) {
        f.vx = 0; f.vy = 0; // 금일철도 정지
        f.geumSpeechTimer -= dt;
        f.geumSpeechDmgTimer = Math.max(0, (f.geumSpeechDmgTimer||0) - dt);
        // 모든 적 경직
        enemies.forEach(en => {
          if (en.hp <= 0) return;
          en.vx = 0; en.vy = 0;
          // 0.2초마다 1 데미지
          if (f.geumSpeechDmgTimer <= 0) {
            en.lastDmgFrom = idx;
            applyDmg(en, 1);
          }
        });
        if (f.geumSpeechDmgTimer <= 0) f.geumSpeechDmgTimer = 200;
        if (f.geumSpeechTimer <= 0) {
          f.geumSpeechActive = false;
          // 금일철 이동 재개
          const geumRa = Math.random() * Math.PI * 2;
          f.vx = Math.cos(geumRa) * BASE_SPEED * (f.speedMult || 1);
          f.vy = Math.sin(geumRa) * BASE_SPEED * (f.speedMult || 1);
          // 연설 종료: 이동속도 5% 영구 감소
          enemies.forEach(en => {
            if (en.hp <= 0) return;
            en.speedMult = (en.speedMult || 1) * 0.95;
            en.geumSpeedReduce = (en.geumSpeedReduce || 0) + 1;
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: en.x, y: en.y - en.r - 10,
              text: '🐢 이속 -5%', life: 1200, maxLife: 1200, vy: -0.4, color: '#c8a800', fontSize: 11,
            });
            // 이동 재개
            const ra = Math.random()*Math.PI*2;
            en.vx = Math.cos(ra)*BASE_SPEED*(en.speedMult||1);
            en.vy = Math.sin(ra)*BASE_SPEED*(en.speedMult||1);
          });
        }
      }
    }

    // 한세환T 처리
    if (f.def.id === 'sehwan') {
      // 사망 시 갇힌 캐릭터 즉시 해방
      if (f.hp <= 0 && f.sehwanRoomActive) {
        f.sehwanRoomActive = false;
        gameState.sehwanRoom = false;
        f.sehwanInRoom = false;
        if (f.sehwanBoosted) {
          f.def = { ...f.def, touchDmg: f._sehwanBaseTouchDmg || 5 };
          f.speedMult = f._sehwanBaseSpeedMult || 1;
          f.sehwanBoosted = false;
        }
        if (f.sehwanRoomTarget) {
          const tgt = f.sehwanRoomTarget;
          tgt.sehwanInRoom = false;
          tgt.x = W * 0.3 + Math.random() * W * 0.4;
          tgt.y = H * 0.2 + Math.random() * H * 0.6;
          tgt.vx = (Math.random()-0.5) * BASE_SPEED * 6;
          tgt.vy = (Math.random()-0.5) * BASE_SPEED * 6;
          f.sehwanRoomTarget = null;
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: tgt.x, y: tgt.y - 30, text: '탈출!', life: 1000, maxLife: 1000,
            vy: -0.4, color: '#1a6b3a', fontSize: 14,
          });
        }
      }
      if (!f.isHyunLifted) f.sehwanSkillCooldown = Math.max(0, (f.sehwanSkillCooldown || 20000) - dt);

      // 손바닥 휘두르기 (3초마다, 항상 작동)
      if (!f.isHyunLifted) f.sehwanSlapTimer = Math.max(0, (f.sehwanSlapTimer || 3000) - dt);
      if (f.sehwanSlapAnim > 0) f.sehwanSlapAnim -= dt;
      if (f.sehwanSlapTimer <= 0 && f.hp > 0) {
        f.sehwanSlapTimer = 3000;
        const slapEnemies = enemies.filter(en => en.hp > 0 && !!en.sehwanInRoom === !!f.sehwanInRoom);
        if (slapEnemies.length > 0) {
          const tgt = slapEnemies.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
          const slapAng = Math.atan2(tgt.y - f.y, tgt.x - f.x);
          f.sehwanSlapAngle = slapAng;
          f.sehwanSlapAnim = 400;
          const slapRange = f.r * 5.5;
          slapEnemies.forEach(en => {
            if (Math.hypot(en.x - f.x, en.y - f.y) < slapRange + en.r) {
              en.lastDmgFrom = idx;
              applyDmg(en, 18);
              const knockAng = Math.atan2(en.y - f.y, en.x - f.x);
              en.vx = Math.cos(knockAng) * BASE_SPEED * 12;
              en.vy = Math.sin(knockAng) * BASE_SPEED * 12;
              en.knockback = true;
              spawnParticle(particles, en.x, en.y, '#1a6b3a', 10);
            }
          });
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 10, text: '손바닥!',
            life: 700, maxLife: 700, vy: -0.5, color: '#1a6b3a', fontSize: 14,
          });
        }
      }

      if (f.sehwanRoomActive) {
        // 한명이라도 죽으면 즉시 양쪽 복귀
        const anyDead = (f.hp <= 0) || (f.sehwanRoomTarget && f.sehwanRoomTarget.hp <= 0);
        if (anyDead) {
          f.sehwanRoomTimer = 0; // 즉시 만료
        }

        // 외부 경기장 체류 중
        f.sehwanRoomTimer -= dt;
        if (f.sehwanRoomTimer <= 0) {
          // 5초 후 복귀
          f.sehwanRoomActive = false;
          gameState.sehwanRoom = false;
          // 한세환 스텟 원래대로
          if (f.sehwanBoosted) {
            f.def = { ...f.def, touchDmg: f._sehwanBaseTouchDmg || 5 };
            f.speedMult = f._sehwanBaseSpeedMult || 1;
            f.sehwanBoosted = false;
          }
          // 메인 경기장 중앙으로 복귀
          f.x = W * 0.5; f.y = H * 0.4;
          f.sehwanInRoom = false;
          if (f.sehwanRoomTarget) f.sehwanRoomTarget.sehwanInRoom = false;
          const sehwanRa = Math.random() * Math.PI * 2;
          f.vx = Math.cos(sehwanRa) * BASE_SPEED;
          f.vy = Math.sin(sehwanRa) * BASE_SPEED;
          // 끌려간 캐릭터 날아가듯 복귀 + 10데미지
          if (f.sehwanRoomTarget && f.sehwanRoomTarget.hp > 0) {
            const tgt = f.sehwanRoomTarget;
            tgt.x = W * 0.3 + Math.random() * W * 0.4;
            tgt.y = H * 0.2 + Math.random() * H * 0.6;
            tgt.vx = (Math.random()-0.5) * BASE_SPEED * 8;
            tgt.vy = (Math.random()-0.5) * BASE_SPEED * 8;
            tgt.lastDmgFrom = idx;
            applyDmg(tgt, 10);
            // 타연 윙맨 상태 복원
            if (tgt.def.id === 'taeyeon' && tgt.awakened) {
              tgt.awakeningActive = true;
            }
            spawnParticle(particles, tgt.x, tgt.y, '#1a6b3a', 12);
          }
          f.sehwanRoomTarget = null;
          const ra = Math.random()*Math.PI*2;
          f.vx = Math.cos(ra)*BASE_SPEED; f.vy = Math.sin(ra)*BASE_SPEED;
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 10, text: '복귀!', life: 900, maxLife: 900,
            vy: -0.4, color: '#1a6b3a', fontSize: 13,
          });
        } else {
          // 외부 경기장 내 이동 제한
          // 진실의 방 내 이동 - 벽 튕김으로 처리됨
          // 주기적 충격파 (2초마다), 한세환 본인은 면역
          if (!f.isHyunLifted) f.sehwanShockTimer = Math.max(0, (f.sehwanShockTimer || 2000) - dt);

          if (f.sehwanShockTimer <= 0) {
            f.sehwanShockTimer = 2000;
            gameState.soundwaves.push({
              x: f.x, y: f.y, r: f.r,
              speed: 6, life: 600, dmg: 8,
              knockback: BASE_SPEED * 3,
              owner: idx, hit: new Set(),
              isSehwanShock: true,
            });
          }
        }
      } else if (f.sehwanSkillCooldown <= 0 && f.hp > 0) {
        // 진실의 방 발동: 딜량 가장 높은 캐릭터 선택
        f.sehwanSkillCooldown = f.def.skill.cooldown;
        const aliveReal = fighters.filter((ft, fi) => fi !== idx && ft.hp > 0 && !ft.isByungheonClone);
        if (aliveReal.length > 0 && gameState.dmgDealt) {
          const topDealer = aliveReal.reduce((best, ft) => {
            const fi = fighters.indexOf(ft);
            return (gameState.dmgDealt[fi]||0) > (gameState.dmgDealt[fighters.indexOf(best)]||0) ? ft : best;
          }, aliveReal[0]);
          // 외부 경기장으로 이동
          const ROOM_W = Math.round(W * 0.5), ROOM_H = Math.round(H * 0.5);
          const RW_val = ROOM_W, RH_val = ROOM_H;
          const ROY2 = Math.round((H - ROOM_H) / 2);
          const RW_inner = Math.round(W * 0.5), RH_inner = Math.round(H * 0.5);
          // 진실의 방: 메인과 완전 분리된 좌표계 (ROFF + 0~RW)
          const ROFF = 10000;
          f.x = ROFF + RW_inner * 0.65;
          f.y = RH_inner * 0.5;
          topDealer.x = ROFF + RW_inner * 0.3;
          topDealer.y = RH_inner * 0.5;
          f.sehwanInRoom = true;
          topDealer.sehwanInRoom = true;
          // 초기 속도
          const ra1 = Math.random()*Math.PI*2, ra2 = Math.random()*Math.PI*2;
          f.vx = Math.cos(ra1)*BASE_SPEED*(f.sehwanBoosted?2:1);
          f.vy = Math.sin(ra1)*BASE_SPEED*(f.sehwanBoosted?2:1);
          topDealer.vx = Math.cos(ra2)*BASE_SPEED;
          topDealer.vy = Math.sin(ra2)*BASE_SPEED;
          // 메인 경기장에서 숨기기 (맵 밖)
          f.sehwanRoomActive = true;
          f.sehwanRoomTimer = 5000;
          f.sehwanRoomTarget = topDealer;
          gameState.sehwanRoom = true;
          // 버프 적용
          if (!f.sehwanBoosted) {
            f._sehwanBaseTouchDmg = f.def.touchDmg;
            f._sehwanBaseSpeedMult = f.speedMult || 1;
            f.def = { ...f.def, touchDmg: f.def.touchDmg * 2 };
            f.speedMult = (f.speedMult || 1) * 2;
            f.sehwanBoosted = true;
          }
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 12, text: '진실의 방!', life: 1500, maxLife: 1500,
            vy: -0.4, color: '#1a6b3a', fontSize: 16,
          });
          spawnParticle(particles, f.x, f.y, '#1a6b3a', 16);
        }
      }
    }

    // 홍은주T 삼각비: HP 50% 이하 1회
    if (f.def.id === 'eunju' && !f.eunjuTriangleDone && f.hp <= f.maxHp * 0.5 && f.hp > 0) {
      f.eunjuTriangleDone = true;
      // 오른쪽 절반 잘라내기 → 경기장 삼각형화 (W를 절반으로)
      // 실제 구현: 경계 라인을 그리고, 그 너머 캐릭터들을 안쪽으로 당김
      gameState.eunjuTriangle = true;
      // 대각선 밖 캐릭터 안쪽으로 밀어냄
      fighters.forEach((ft, fi) => {
        if (ft.hp <= 0) return;
        if (ft.x / W + ft.y / H > 1.0) {
          ft.vx = -BASE_SPEED * 8;
          ft.vy = -BASE_SPEED * 4;
          for (let p = 0; p < 8; p++) spawnParticle(particles, ft.x, ft.y, '#d4186c', 6);
        }
      });
      gameState.shake = Math.max(gameState.shake||0, 16);
      if (gameState.dmgTexts) {
        gameState.dmgTexts.push({ x: W*0.4, y: H*0.5, text: '삼각비!', life: 2000, maxLife: 2000, vy: -0.4, color: '#d4186c', fontSize: 24 });
      }
    }

    // 홍은주T 삼각비: 대각선 경계 밖 캐릭터 밀어냄
    if (gameState.eunjuTriangle && f.hp > 0 && !f.sehwanInRoom) {
      // 대각선: x/W + y/H = 1, 이 선 오른쪽은 맵 밖
      if (f.x / W + f.y / H > 1.0) {
        // 대각선 안쪽으로 밀기
        const diagNx = H, diagNy = W; // 법선 방향
        const diagLen = Math.hypot(diagNx, diagNy);
        f.vx -= (diagNx/diagLen) * BASE_SPEED * 3;
        f.vy -= (diagNy/diagLen) * BASE_SPEED * 3;
        // 위치도 강제 조정
        const excess = (f.x/W + f.y/H - 1.0);
        f.x -= excess * W * 0.5;
        f.y -= excess * H * 0.5;
      }
    }

    // 홍은주T 경직 타겟 처리
    if (f.def.id === 'eunju') {
      f.eunjuCharmTargets = (f.eunjuCharmTargets || []).filter(ct => {
        if (!ct.ref || ct.ref.hp <= 0) return false;
        ct.timer -= dt;
        ct.ref.vx = 0; ct.ref.vy = 0; // 경직
        // 하트 파티클
        ct.heartTimer = (ct.heartTimer || 0) - dt;
        if (ct.heartTimer <= 0) {
          spawnParticle(particles, ct.ref.x + (Math.random()-0.5)*20, ct.ref.y - ct.ref.r - 10, '#ff6688', 5);
          ct.heartTimer = 300;
        }
        if (ct.timer <= 0) {
          // 3초 후 하트 터지며 15 데미지
          applyDmg(ct.ref, 15);
          spawnParticle(particles, ct.ref.x, ct.ref.y, '#ff6688', 16);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: ct.ref.x, y: ct.ref.y - ct.ref.r - 10, text: '💥', life: 700, maxLife: 700, vy: -0.5, fontSize: 18, color: '#ff6688'
          });
          // 이동 재개
          const ra = Math.random() * Math.PI * 2;
