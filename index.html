    ctx.globalAlpha = 1;
  });

  // 유채완 머리카락
  gameState.hairs.forEach(h => {
    ctx.save();
    // 머리카락 타원 모양
    ctx.fillStyle = '#5c2d0a';
    ctx.strokeStyle = '#8b4513';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(h.x, h.y, h.r * 0.5, h.r * 1.4, Math.PI * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 하이라이트
    ctx.fillStyle = 'rgba(200,150,80,0.4)';
    ctx.beginPath();
    ctx.ellipse(h.x - 1, h.y - 2, h.r * 0.2, h.r * 0.5, Math.PI * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 초록 머리카락 렌더
  (gameState.greenHairs || []).forEach(gh => {
    ctx.save();
    ctx.fillStyle = '#00bb44';
    ctx.strokeStyle = '#007722';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(gh.x, gh.y, gh.r * 0.5, gh.r * 1.4, -Math.PI * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // 하이라이트
    ctx.fillStyle = 'rgba(150,255,150,0.5)';
    ctx.beginPath();
    ctx.ellipse(gh.x - 1, gh.y - 2, gh.r * 0.2, gh.r * 0.5, -Math.PI * 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 천안문 박스 렌더
  fighters.forEach(f => {
    if (!f.tiananmenCaged || !f.tiananmenBox) return;
    const box = f.tiananmenBox;
    const bx = box.x - box.w/2, by = box.y - box.h/2;
    // 배경
    ctx.fillStyle = 'rgba(180,0,0,0.12)';
    ctx.fillRect(bx, by, box.w, box.h);
    // 테두리
    ctx.strokeStyle = '#8b0000';
    ctx.lineWidth = 3;
    ctx.setLineDash([]);
    ctx.strokeRect(bx, by, box.w, box.h);
    // "천안문" 텍스트
    ctx.fillStyle = '#8b0000';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('천안문', box.x, by + 12);
    ctx.textBaseline = 'alphabetic';
  });

  // 유채완 머리카락 장판
  (gameState.hairBlasts || []).forEach(blast => {
    const alpha = (blast.life / blast.maxLife) * 0.7;
    // 장판 원형
    const grad = ctx.createRadialGradient(blast.x, blast.y, 0, blast.x, blast.y, blast.r);
    grad.addColorStop(0, `rgba(180,80,0,${alpha})`);
    grad.addColorStop(0.6, `rgba(140,50,0,${alpha * 0.8})`);
    grad.addColorStop(1, `rgba(100,30,0,0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(blast.x, blast.y, blast.r, 0, Math.PI * 2);
    ctx.fill();
    // 테두리
    ctx.strokeStyle = `rgba(200,100,0,${alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(blast.x, blast.y, blast.r, 0, Math.PI * 2);
    ctx.stroke();
  });

  // 김태연 궤도 가사 글자
  fighters.forEach(f => {
    if (f.def.id !== 'taeyeon' || f.hp <= 0 || !f.lyricOrbit || f.lyricOrbit.length === 0) return;
    const n = f.lyricOrbit.length;
    f.lyricOrbit.forEach((orb, oi) => {
      // 균등 배치 각도
      const ang = orb.angle + oi * (Math.PI * 2 / n);
      const ox = f.x + Math.cos(ang) * f.r * 1.8;
      const oy = f.y + Math.sin(ang) * f.r * 1.8;
      ctx.save();
      ctx.font = 'bold 17px sans-serif';
      ctx.fillStyle = '#d0186e';
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText(orb.char, ox, oy);
      ctx.fillText(orb.char, ox, oy);
      ctx.restore();
    });
  });

  // Fighters
  fighters.forEach(f => {
    if (f.hp <= 0) return; // 사망 시 렌더 스킵
    if (f.sehwanInRoom) return; // 외부 경기장 캐릭터는 별도 렌더
    const def = f.def;

    // Lonely 병헌 오오라
    if (def.id === 'byungheon' && !f.isByungheonClone && f.lonelyAura) {
      const auraR = f.r * 10;
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 400);
      // 오오라 그라디언트
      const lg = ctx.createRadialGradient(f.x, f.y, f.r, f.x, f.y, auraR);
      lg.addColorStop(0, `rgba(123,63,160,${0.15 + 0.08 * pulse})`);
      lg.addColorStop(0.6, `rgba(123,63,160,${0.08 + 0.05 * pulse})`);
      lg.addColorStop(1, 'rgba(123,63,160,0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(f.x, f.y, auraR, 0, Math.PI*2); ctx.fill();
      // 오오라 링
      ctx.globalAlpha = 0.5 + 0.3 * pulse;
      ctx.strokeStyle = '#7b3fa0';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.arc(f.x, f.y, auraR, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
      // "lonely 병헌" 텍스트
      ctx.fillStyle = '#7b3fa0';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('lonely 병헌', f.x, f.y - f.r - 12);
      ctx.textBaseline = 'alphabetic';
    }

    // Aura (김태양)
    if (def.id === 'taeyoung' && f.skillActive) {
      const auraR = f.r * def.skill.auraRadiusMult;
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, auraR, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = def.color;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(f.x, f.y, auraR, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;
    }

    // 김태연 각성 날개 이펙트 파티클
    if (def.id === 'taeyeon' && f.awakened && f.wingParticles) {
      f.wingParticles.forEach(wp => {
        ctx.globalAlpha = (wp.life / wp.maxLife) * 0.85;
        ctx.fillStyle = wp.color;
        ctx.beginPath(); ctx.arc(wp.x, wp.y, wp.r, 0, Math.PI*2); ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // 김태연 각성 날개 (사실풍 하늘색 조류 날개)
    if (def.id === 'taeyeon' && f.awakened) {
      const prog = f.wingProgress || 1;
      const r = f.r;
      ctx.save();
      ctx.translate(f.x, f.y);

      function drawWing(side) {
        const s = side; // -1=left, 1=right
        ctx.save();
        ctx.scale(s, 1);

        // 날개 전체 클리핑용 외곽 (펼침 진행도 반영)
        ctx.save();
        ctx.beginPath();
        // 상단 날개 커버 (큰 1차 깃털 영역)
        const span = r * 2.8 * prog;
        const tipY = -r * 1.6 * prog;
        ctx.moveTo(r * 0.25, -r * 0.1);
        ctx.bezierCurveTo(
          r * 0.6,  -r * 0.9 * prog,
          span * 0.75, tipY * 0.6,
          span, tipY
        );
        // 날개 끝 곡선
        ctx.bezierCurveTo(
          span * 0.85, tipY + r * 0.5 * prog,
          span * 0.65, tipY + r * 0.9 * prog,
          span * 0.45, tipY + r * 1.1 * prog
        );
        // 하단 날개 (2차 깃털)
        ctx.bezierCurveTo(
          span * 0.3, tipY + r * 1.3 * prog,
          r * 0.9, r * 0.5 * prog,
          r * 0.25, r * 0.35
        );
        ctx.closePath();

        // 날개 베이스 그라디언트 (하늘색)
        const wg = ctx.createLinearGradient(r*0.25, -r*0.5, span, tipY);
        wg.addColorStop(0, 'rgba(178,230,255,0.95)');
        wg.addColorStop(0.4, 'rgba(100,190,240,0.9)');
        wg.addColorStop(0.75, 'rgba(60,160,220,0.85)');
        wg.addColorStop(1, 'rgba(30,120,200,0.7)');
        ctx.fillStyle = wg;
        ctx.fill();

        // 날개 윤곽선
        ctx.strokeStyle = 'rgba(20,100,180,0.6)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.restore();

        // 깃털 줄기선들 (1차 깃털 6개)
        ctx.strokeStyle = 'rgba(15,80,160,0.45)';
        ctx.lineWidth = 0.8;
        const featherCount = 6;
        for (let fi = 0; fi < featherCount; fi++) {
          const t = fi / (featherCount - 1);
          // 날개 상단 가장자리를 따라 깃털 뿌리 위치
          const rootX = r * 0.3 + (span * 0.85 - r * 0.3) * t * prog;
          const rootY = (-r * 0.5 + tipY * 0.8) * t * prog - r * 0.05;
          // 깃털 끝은 약간 아래쪽으로
          const endX = rootX * 0.88;
          const endY = rootY + r * 0.55 * prog;
          ctx.beginPath();
          ctx.moveTo(rootX, rootY);
          ctx.quadraticCurveTo(rootX * 0.9, rootY + r * 0.28 * prog, endX, endY);
          ctx.stroke();
        }

        // 2차 깃털 (하단 소형, 4개)
        ctx.strokeStyle = 'rgba(15,80,160,0.3)';
        ctx.lineWidth = 0.7;
        for (let fi = 0; fi < 4; fi++) {
          const t = fi / 3;
          const rootX = r * 0.28 + (span * 0.45 - r * 0.28) * t * prog;
          const rootY = (tipY + r * 1.1 * prog) * 0.5 + r * 0.1;
          const endX = rootX * 0.85;
          const endY = rootY + r * 0.35 * prog;
          ctx.beginPath();
          ctx.moveTo(rootX, rootY);
          ctx.quadraticCurveTo(rootX * 0.92, rootY + r * 0.18 * prog, endX, endY);
          ctx.stroke();
        }

        // 날개 하이라이트 (상단 밝은 부분)
        const hg = ctx.createLinearGradient(r*0.3, -r*0.3*prog, span*0.5, tipY*0.7);
        hg.addColorStop(0, 'rgba(255,255,255,0.35)');
        hg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.beginPath();
        ctx.moveTo(r * 0.3, -r * 0.05);
        ctx.bezierCurveTo(r * 0.55, -r * 0.7 * prog, span * 0.45, tipY * 0.55, span * 0.5, tipY * 0.6);
        ctx.bezierCurveTo(span * 0.35, tipY * 0.5, r * 0.45, -r * 0.3 * prog, r * 0.3, -r * 0.05);
        ctx.fillStyle = hg;
        ctx.fill();

        ctx.restore();
      }

      drawWing(-1); // 왼쪽
      drawWing(1);  // 오른쪽
      ctx.restore();
    }

    // 무적 중 반짝이는 링
    if (def.id === 'taeyeon' && f.awakeningActive) {
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() / 80);
      ctx.globalAlpha = 0.6 + 0.4 * pulse;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 5, 0, Math.PI*2); ctx.stroke();
      ctx.strokeStyle = '#d0186e';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 9, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 김혜경T 염탐 연출
    if (def.id === 'hyekyung' && f.hyekyungStaring) {
      // 거무잡잡 (어두운 오버레이)
      const stealthAlpha = Math.min(0.75, (f.hyekyungStareTimer || 0) / 3000 * 0.75);
      ctx.globalAlpha = stealthAlpha;
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 4, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // 큰 눈 두 개
      const eyeY = f.y - 4;
      const tgtGaze = f.hyekyungStareTarget;
      [f.x - 9, f.x + 9].forEach(ex => {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, eyeY, 7, 9, 0, 0, Math.PI*2); ctx.fill();
        // 동공: 응시 대상 방향
        let px = 0, py = 2;
        if (tgtGaze) {
          const pang = Math.atan2(tgtGaze.y - f.y, tgtGaze.x - f.x);
          px = Math.cos(pang) * 3; py = Math.sin(pang) * 3;
        }
        ctx.fillStyle = '#111';
        ctx.beginPath(); ctx.arc(ex + px, eyeY + py, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(ex + px + 1.5, eyeY + py - 1, 1.2, 0, Math.PI*2); ctx.fill();
      });
      // 응시 대상에게 점선 연결
      if (tgtGaze && tgtGaze.hp > 0) {
        ctx.strokeStyle = 'rgba(139,26,139,0.6)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4,4]);
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(tgtGaze.x, tgtGaze.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = 'bold 14px sans-serif';
        ctx.fillStyle = '#8b1a8b';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('👀', tgtGaze.x, tgtGaze.y - tgtGaze.r - 14);
      }
    }

    // 정준우 분노/노준우 렌더
    if ((def.id === 'junjoo' || f.nojunwoo) && f.hp > 0) {
      const rage = f.rage || 0;
      // 회피 깜빡임
      if (f.dodgeFlicker > 0) {
        if (Math.floor(f.dodgeFlicker / 80) % 2 === 0) ctx.globalAlpha = 0.2;
      }
      // 노준우 변신 연출: 빨간 플래시
      if (f.nojunwooAnim > 0) {
        const flashAlpha = (f.nojunwooAnim / 1500) * 0.6;
        ctx.globalAlpha = flashAlpha;
        ctx.fillStyle = '#cc3300';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2.5, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
      // 분노 오라 (60+ 이면 표시)
      if (rage >= 60) {
        const pulse = 0.4 + 0.3 * Math.sin(Date.now() / (f.nojunwoo ? 100 : 300));
        ctx.globalAlpha = pulse * (f.nojunwoo ? 0.7 : 0.4);
        ctx.fillStyle = '#cc3300';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 6 + (f.nojunwoo ? 4 : 0), 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // 한세환 손바닥 애니메이션 (메인 경기장)
    if (def.id === 'sehwan' && !f.sehwanInRoom && (f.sehwanSlapAnim||0) > 0) {
      const prog = f.sehwanSlapAnim / 400;
      const slapLen = f.r * 5.5;
      ctx.save();
      ctx.globalAlpha = prog * 0.85;
      ctx.strokeStyle = '#1a6b3a';
      ctx.lineWidth = 6 * prog;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(f.x, f.y, slapLen, f.sehwanSlapAngle - Math.PI*0.6*prog, f.sehwanSlapAngle + Math.PI*0.6*prog);
      ctx.stroke();
      ctx.font = `${Math.round(18*prog)}px sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🖐️', f.x + Math.cos(f.sehwanSlapAngle)*slapLen, f.y + Math.sin(f.sehwanSlapAngle)*slapLen);
      ctx.restore();
    }

    // 수면 이펙트
    if ((f.sleepTimer || 0) >= 0 && f.hp > 0) {
      // 어두운 오버레이
      ctx.globalAlpha = 0.35;
      ctx.fillStyle = '#9b70d0';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 3, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // Zzz 텍스트 (흔들리는 효과)
      const t = Date.now() / 300;
      ctx.font = 'bold 13px sans-serif';
      ctx.fillStyle = '#9b70d0';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('z', f.x + Math.sin(t)*3, f.y - f.r - 8);
      ctx.font = 'bold 11px sans-serif';
      ctx.fillText('Z', f.x + 6 + Math.sin(t+1)*3, f.y - f.r - 18);
      ctx.font = 'bold 9px sans-serif';
      ctx.fillText('Z', f.x + 11 + Math.sin(t+2)*3, f.y - f.r - 26);
      ctx.textBaseline = 'alphabetic';
    }

    // 서연후 광속질주 잔상
    if (def.id === 'yeonhoo' && f.rushTrail && f.rushTrail.length > 0) {
      f.rushTrail.forEach(t => {
        ctx.save();
        ctx.globalAlpha = t.alpha;
        ctx.fillStyle = '#ff3300';
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r * 0.8, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      });
    }

    // 서연후 아이템 오라
    if (def.id === 'yeonhoo' && f.yeonhooItem && f.yeonhooItemTimer > 0) {
      const itemColors = { '거대화': '#4488ff', '광속질주': '#ff3300', '자력': '#ffcc00', '소물약': '#ff88cc' };
      const ic = itemColors[f.yeonhooItem] || '#cc44aa';
      const pulse = 0.5 + 0.4 * Math.sin(Date.now() / 200);
      ctx.globalAlpha = pulse * 0.4;
      ctx.fillStyle = ic;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ic; ctx.lineWidth = 2.5;
      ctx.globalAlpha = 0.7 + 0.3 * pulse;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 5, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 금일철P 금색 경직 이펙트
    if (f.hp > 0) {
      const isGoldFrozen = gameState && gameState.fighters.some(gf =>
        gf.def.id === 'geumilcheol' && (gf.geumGoldTargets||[]).some(gt => gt.ref === f)
      );
      if (isGoldFrozen) {
        const pulse = 0.5 + 0.4 * Math.sin(Date.now() / 120);
        ctx.globalAlpha = 0.55 + 0.2 * pulse;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 4, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#c8a800'; ctx.lineWidth = 3;
        ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 8, 0, Math.PI*2); ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }

    // 교탁 렌더 (교장말씀 중)
    if (def.id === 'geumilcheol' && f.geumSpeechActive) {
      const podiumW = f.r * 2.6;
      const podiumH = f.r * 1.1;
      const podiumX = f.x - podiumW / 2;
      const podiumY = f.y + f.r * 0.6;
      ctx.save();
      // 교탁 본체
      ctx.fillStyle = '#8b5c2a';
      ctx.fillRect(podiumX, podiumY, podiumW, podiumH);
      // 교탁 상단면
      ctx.fillStyle = '#a8722a';
      ctx.fillRect(podiumX - 4, podiumY - 5, podiumW + 8, 8);
      // 마이크
      ctx.fillStyle = '#333';
      ctx.fillRect(f.x - 2, podiumY - 22, 4, 18);
      ctx.beginPath(); ctx.arc(f.x, podiumY - 23, 5, 0, Math.PI*2); ctx.fill();
      // 마이크 스탠드 받침
      ctx.fillStyle = '#555';
      ctx.fillRect(f.x - 8, podiumY - 6, 16, 3);
      ctx.restore();
    }

    // 연설 이펙트 (금일철)
    if (def.id === 'geumilcheol' && f.geumSpeechActive) {
      const t = Date.now() / 200;
      for (let ri = 0; ri < 3; ri++) {
        const rr = f.r + 12 + ri * 14;
        const a2 = 0.5 - ri * 0.15;
        ctx.globalAlpha = a2 * (0.6 + 0.4 * Math.sin(t + ri));
        ctx.strokeStyle = '#c8a800'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, rr, 0, Math.PI*2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('📢', f.x, f.y - f.r - 18);
    }

    // 예측 모드 후광 (선택한 캐릭터)
    if (window._predictMode && predictState.userPick) {
      const pickedDef = predictState.userPick === 'A' ? predictState.defA : predictState.defB;
      if (def.id === pickedDef.id) {
        const t = Date.now() / 400;
        const pulse = 0.55 + 0.35 * Math.sin(t);
        ctx.save();
        // 황금 후광 링
        const grad = ctx.createRadialGradient(f.x, f.y, f.r, f.x, f.y, f.r * 2.2);
        grad.addColorStop(0, `rgba(245,197,24,${pulse * 0.5})`);
        grad.addColorStop(0.6, `rgba(245,197,24,${pulse * 0.2})`);
        grad.addColorStop(1, 'rgba(245,197,24,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r * 2.2, 0, Math.PI * 2); ctx.fill();
        // 황금 외곽선
        ctx.strokeStyle = `rgba(245,197,24,${0.7 + 0.3 * Math.sin(t * 2)})`;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 5, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }

    // TIDAL WAVE 잔상 렌더
    if (def.id === 'giwon' && f.tidalTrail && f.tidalTrail.length > 0) {
      f.tidalTrail.forEach((t, ti) => {
        ctx.globalAlpha = t.alpha;
        // 화살표 모양으로 잔상
        const trailAng = Math.atan2(f.vy, f.vx) + Math.PI/2;
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(trailAng);
        const r = f.r * (0.9 - ti * 0.07);
        ctx.fillStyle = '#87ceeb';
        ctx.beginPath();
        ctx.moveTo(0, -r*1.4);
        ctx.lineTo(-r*0.75, r*0.1);
        ctx.lineTo(r*0.75, r*0.1);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-r*0.55, r*0.1);
        ctx.lineTo(-r*0.9, r*0.85);
        ctx.lineTo(-r*0.2, r*0.45);
        ctx.lineTo(r*0.2, r*0.45);
        ctx.lineTo(r*0.9, r*0.85);
        ctx.lineTo(r*0.55, r*0.1);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    // 더미 렌더 (타겟 모양)
    if (def.isDummy) {
      ctx.save();
      // 동심원
      const rings = ['#cc0000','#fff','#cc0000','#fff','#cc0000'];
      for (let ri = 0; ri < rings.length; ri++) {
        ctx.fillStyle = rings[ri];
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r * (1 - ri * 0.18), 0, Math.PI*2);
        ctx.fill();
      }
      // 테두리
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
      // 스킵 (일반 바디 안 그림)
      ctx.textBaseline = 'alphabetic';
      // 나머지 렌더 건너뜀 - continue 불가라 조건 처리
    } else {

    // 변신 중 숨기기
    if (def.id === 'giwon' && f.tidalTransforming) {
      // 깜빡이는 이펙트만
      if (Math.floor(Date.now() / 80) % 2 === 0) {
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#00aacc';
        ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    } else if (def.id === 'giwon' && f.tidalActive) {
      // 화살표(커서) 모양 — 이동 방향 기준
      const ang = Math.atan2(f.vy, f.vx) + Math.PI/2;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(ang);
      const r = f.r;
      // 그라디언트
      const tg = ctx.createLinearGradient(0, -r*1.4, 0, r*0.8);
      tg.addColorStop(0, '#e0e0e0');
      tg.addColorStop(1, '#888');
      ctx.fillStyle = tg;
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2.5;
      // 화살촉 (상단 삼각형)
      ctx.beginPath();
      ctx.moveTo(0, -r*1.4);
      ctx.lineTo(-r*0.75, r*0.1);
      ctx.lineTo(r*0.75, r*0.1);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // 꼬리 양갈래
      ctx.beginPath();
      ctx.moveTo(-r*0.55, r*0.1);
      ctx.lineTo(-r*0.9, r*0.85);
      ctx.lineTo(-r*0.2, r*0.45);
      ctx.lineTo(r*0.2, r*0.45);
      ctx.lineTo(r*0.9, r*0.85);
      ctx.lineTo(r*0.55, r*0.1);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else {

    // Body (일반)
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    // 중독 초록 오버레이
    if (f.poisonTimer > 0) {
      const pa = Math.min(0.45, f.poisonTimer / 1500 * 0.45);
      ctx.fillStyle = `rgba(100,200,0,${pa})`;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.stroke();

    // Name
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.lineWidth = 3;
    ctx.strokeText(def.name, f.x, f.y);
    ctx.fillText(def.name, f.x, f.y);
    ctx.textBaseline = 'alphabetic';
    } // end else (일반 바디)

    // 황승오T 골든 오버레이
    if (def.id === 'seungoh' && f.goldenActive) {
      const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 80);
      ctx.globalAlpha = pulse * 0.7;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 4, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
      // 황금 링
      ctx.strokeStyle = '#ffaa00';
      ctx.lineWidth = 3;
      ctx.globalAlpha = pulse;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 8, 0, Math.PI*2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // 캐릭터 머리 위 체력바
    {
      const bw = f.r * 2.4;
      const bx = f.x - bw / 2;
      const by = f.y - f.r - (def.id !== 'chaewan' && (f.hairCount||0) > 0 ? 24 : 10);
      const hpPct = Math.max(0, f.hp / f.maxHp);
      // 배경
      ctx.fillStyle = '#ddd';
      ctx.fillRect(bx, by, bw, 7);
      // 체력 색상: 높으면 초록, 중간 노랑, 낮으면 빨강
      const hpColor = hpPct > 0.6 ? def.color : hpPct > 0.3 ? '#e8900a' : '#cc2020';
      ctx.fillStyle = hpColor;
      ctx.fillRect(bx, by, bw * hpPct, 7);
      // 테두리
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, bw, 7);
      // HP 숫자
      ctx.fillStyle = '#333';
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(Math.ceil(f.hp) + '/' + f.maxHp, f.x, by);
      ctx.textBaseline = 'alphabetic';
    }

    } // end dummy else

    // 한수민 웃음 텍스트
    if (def.id === 'sumin' && f.laughText && f.laughText.timer > 0) {
      const alpha = Math.min(1, f.laughText.timer / 400);
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 16px sans-serif';
      ctx.fillStyle = '#ff6b00';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('하학!@', f.x, f.y - f.r - 18);
      ctx.globalAlpha = 1;
      ctx.textBaseline = 'alphabetic';
    }

    // TIDAL WAVE 텍스트 애니메이션
    if (def.id === 'giwon' && f.tidalTextAnim && f.tidalTextAnim.timer > 0) {
      const elapsed = 1200 - f.tidalTextAnim.timer;
      const alpha = Math.min(1, f.tidalTextAnim.timer / 300);
      // TIDAL: 왼쪽에서 날아옴
      const tidalX = f.x + Math.max(-120, -120 + elapsed * 0.35);
      const tidalY = f.y - f.r - 24;
      // WAVE: 오른쪽에서 날아옴
      const waveX = f.x + Math.min(120, 120 - elapsed * 0.35);
      const waveY = f.y - f.r - 10;
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 15px sans-serif';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 3;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#00aacc';
      ctx.strokeText('TIDAL', tidalX, tidalY);
      ctx.fillText('TIDAL', tidalX, tidalY);
      ctx.fillStyle = '#0077aa';
      ctx.strokeText('WAVE', waveX, waveY);
      ctx.fillText('WAVE', waveX, waveY);
      ctx.globalAlpha = 1;
      ctx.textBaseline = 'alphabetic';
    }

    // 천안문 발동 텍스트
    if (def.id === 'taeyeon' && f.tiananmenText && f.tiananmenText.timer > 0) {
      const alpha = Math.min(1, f.tiananmenText.timer / 600);
      ctx.globalAlpha = alpha;
      ctx.font = 'bold 9px sans-serif';
      ctx.fillStyle = '#8b0000';
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText('천한것아 너를 천안문에', f.x, f.y - f.r - 22);
      ctx.fillText('천한것아 너를 천안문에', f.x, f.y - f.r - 22);
      ctx.strokeText('넣어버리지~', f.x, f.y - f.r - 11);
      ctx.fillText('넣어버리지~', f.x, f.y - f.r - 11);
      ctx.globalAlpha = 1;
      ctx.textBaseline = 'alphabetic';
    }

    // 올라가! 상태 표시
    const isFrozenByHyun = fighters.some(ht =>
      ht.def.id === 'hyuncheol' && ht.hyunFrozenTargets &&
      ht.hyunFrozenTargets.some(e => e.fIdx === fighters.indexOf(f) && e.phase !== 'done')
    );
    if (isFrozenByHyun) {
      ctx.save();
      ctx.font = 'bold 14px sans-serif';
      ctx.fillStyle = '#2c5f2e';
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText('↑', f.x, f.y - f.r - 14);
      ctx.fillText('↑', f.x, f.y - f.r - 14);
      ctx.restore();
    }

    // 머리카락 게이지 (유채완 본인 제외, 1개 이상 주웠을 때)
    if (def.id !== 'chaewan' && (f.hairCount || 0) > 0) {
      const hc = Math.min(4, f.hairCount);
      const bw = f.r * 2.2;
      const bx = f.x - bw / 2;
      const by = f.y - f.r - 12;
      // 배경
      ctx.fillStyle = '#ddd';
      ctx.fillRect(bx, by, bw, 5);
      // 게이지 색상: 1=금, 2=주황, 3=빨강, 4=진빨강
      const colors = ['#c8a060','#e08030','#cc2020','#990000'];
      ctx.fillStyle = colors[hc - 1] || '#cc2020';
      const maxHair = f.isByungheonClone ? 2 : 4;
      ctx.fillRect(bx, by, bw * (hc / maxHair), 5);
      // 테두리
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 0.8;
      ctx.strokeRect(bx, by, bw, 5);
      // 숫자
      ctx.fillStyle = '#333';
      ctx.font = 'bold 8px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText(`💇 ${hc}/${f.isByungheonClone ? 2 : 4}`, f.x, by - 1);
      ctx.textBaseline = 'alphabetic';
    }
  });

  // 데미지 텍스트 렌더 (맨 위에 표시)
  if (gameState && gameState.dmgTexts) {
    gameState.dmgTexts.forEach(dt2 => {
      const alpha = dt2.life / dt2.maxLife;
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${dt2.fontSize || Math.round(13 + (1 - alpha) * 3)}px sans-serif`;
      ctx.fillStyle = dt2.color || '#cc0000';
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 2.5;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText(dt2.text, dt2.x, dt2.y);
      ctx.fillText(dt2.text, dt2.x, dt2.y);
    });
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }
  if (shake > 0) ctx.translate(-sx, -sy);

  // 홍은주T 삼각비 클리핑 해제 후 경계선
  if (_eunjuClip) {
    ctx.restore(); // 클리핑 해제
    ctx.save();
    ctx.strokeStyle = '#d4186c';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W, 0); ctx.lineTo(0, H);
    ctx.stroke();
    ctx.restore();
  }

  if (_camApplied) ctx.restore();
}

function buildBattleUI(fighters) {
  const pids = fighters.length >= 4 ? ['p1','p2','p3','p4'] : fighters.length === 3 ? ['p1','p2','p3'] : ['p1','p2'];
  pids.forEach((pid, idx) => {
    const f = fighters[idx];
    const el = document.getElementById('ui-' + pid);
    const pLabel = idx === 0 ? 'P1' : idx === 1 ? 'P2' : idx === 2 ? 'P3' : 'P4';
    let html = `<div class="fighter-label" style="color:${f.def.color}">${f.def.name} <span style="font-size:11px;color:#888">${pLabel}</span></div>`;

    const bar = (id, color, w='0%', mt='4px') =>
      `<div class="skill-bar-bg" style="margin-top:${mt}"><div class="skill-bar-fill" id="${id}-${pid}" style="width:${w};background:${color}"></div></div>`;
    const lbl = (id, color, text, mt='2px') =>
      `<div class="skill-label" id="${id}-${pid}" style="color:${color};margin-top:${mt}">${text}</div>`;

    const id = f.def.id;

    if (id === 'chaewan') {
      html += bar('sk', '#8b4513', '0%', '4px');
      html += lbl('sklbl', '#8b4513', '머리카락 수집: 0 / 10');
    } else if (id === 'hyekyung') {
      html += bar('hk1', '#e87020', '50%', '4px');
      html += lbl('hk1lbl', '#e87020', '인천맛집');
      html += bar('hk2', '#222', '0%', '4px');
      html += lbl('hk2lbl', '#222', '염탐 (20s)');
      html += bar('hk3', '#cc0000', '0%', '4px');
      html += lbl('hk3lbl', '#cc0000', '안락사 (60s)');
    } else if (id === 'geumilcheol') {
      html += bar('geum-sk', '#c8a800', '0%', '4px');
      html += lbl('geum-lbl', '#c8a800', '교장선생님의 말씀 (30s)');
      html += bar('geum-sk2', '#888', '0%', '4px');
      html += lbl('geum-lbl2', '#888', '철갑탄 (10s)');
    } else if (id === 'sehwan') {
      html += bar('sehwan-sk', '#1a6b3a', '0%', '4px');
      html += lbl('sehwan-lbl', '#1a6b3a', '진실의 방 (20s)');
    } else if (id === 'eunju') {
      html += bar('eunju-hp', '#d4186c', '100%', '4px');
      html += lbl('eunju-lbl', '#d4186c', '삼각비 — HP 50% 이하 발동');
      html += lbl('eunju-dmg', '#888', '접촉 데미지: 1');
    } else if (id === 'youngouk') {
      html += lbl('youngouk', '#9b70d0', '수면 유도 — 준비 중', '4px');
    } else if (id === 'seungoh') {
      html += lbl('goldenlbl', '#aaa', '골든 — 대기 중', '4px');
      html += bar('so1', '#1a3a8f', '50%', '4px');
      html += lbl('so1lbl', '#1a3a8f', '바이 두잉 썸띵~ (4s)');
      html += bar('so2', '#4a6abf', '0%', '4px');
      html += lbl('so2lbl', '#4a6abf', '병렬병렬 김병렬! (13s)');
      html += lbl('so3lbl', '#00aaff', '든든든 — 스킬1 2회 후 자동');
    } else if (id === 'seungbin') {
      html += bar('turret', '#1a7a1a', '100%', '6px');
      html += lbl('turretlbl', '#1a7a1a', '터렛 — 준비완료');
    } else if (id === 'giwon') {
      html += bar('tidal', '#00aacc', '0%', '6px');
      html += lbl('tidallbl', '#999', 'TIDAL WAVE — HP 50 미만 시 발동');
    } else if (id === 'hyuncheol') {
      html += bar('sk', f.def.skill.barColor, '50%', '4px');
      html += lbl('sklbl', '#888', `스킬: ${f.def.skill.label}`);
      html += bar('hyun2', '#8b4513', '0%', '4px');
      html += lbl('hyun2lbl', '#8b4513', '자 따라해보자 — HP 50 이하 시 발동');
    } else if (id === 'taeyeon') {
      html += bar('wing', '#87ceeb', '0%', '6px');
      html += lbl('winglbl', '#87ceeb', `윙맨 — 변신까지 ${f.maxHp - 50}`);
      html += bar('tian', '#8b0000', '0%', '4px');
      html += lbl('tianlbl', '#8b0000', '천안문 (20.0s)');
    } else if (id === 'taeyoung') {
      html += bar('sk', f.def.skill.barColor, '50%', '4px');
      html += lbl('sklbl', '#888', `스킬: ${f.def.skill.label}`);
      html += bar('sk2ty', '#c47a00', '50%', '6px');
      html += lbl('sk2tylbl', '#c47a00', '트름 — 준비 중');
    } else if (id === 'sumin') {
      html += bar('sk', f.def.skill.barColor, '50%', '4px');
      html += lbl('sklbl', '#888', `스킬: ${f.def.skill.label}`);
      html += bar('sk2', '#ff6b00', '0%', '6px');
      html += lbl('sk2lbl', '#ff6b00', '쳐웃기 — HP 50% 이하 + 근접 시 자동발동');
      html += bar('ng', '#cc0000', '0%', '4px');
      html += lbl('nglbl', '#999', '하핚!! — 쳐웃기 사용 후 활성화');
    } else {
      // 공통 스킬바
      html += bar('sk', f.def.skill.barColor, '50%', '4px');
      html += lbl('sklbl', '#888', `스킬: ${f.def.skill.label}`);
    }

    el.innerHTML = html;
  });
}

function updateBattleUI(fighters) {
  const pids = fighters.length >= 4 ? ['p1','p2','p3','p4'] : fighters.length === 3 ? ['p1','p2','p3'] : ['p1','p2'];
  pids.forEach((pid, idx) => {
    const f = fighters[idx];
    const hpEl = document.getElementById('hp-' + pid);
    const hpTxt = document.getElementById('hptxt-' + pid);
    const skEl = document.getElementById('sk-' + pid);
    const skLbl = document.getElementById('sklbl-' + pid);
    // hp바는 캔버스에서 직접 렌더
    if (skEl && f.def.id !== 'hyekyung') {
      if (f.def.id === 'chaewan') {
        // 머리카락 수집 게이지 (10개마다 초록 머리카락 생성)
        const total = gameState ? (gameState.totalHairCollected || 0) : 0;
        const progress = total % 10;
        skEl.style.width = (progress / 10 * 100) + '%';
        skEl.style.background = '#8b4513';
        if (skLbl) {
          skLbl.textContent = `머리카락 수집: ${progress} / 10`;
          skLbl.style.color = '#8b4513';
        }
      } else {
        const pct = (1 - f.skillCooldown / f.def.skill.cooldown) * 100;
        skEl.style.width = Math.min(100, pct) + '%';
        if (skLbl) {
          if (f.skillCooldown <= 0) {
            skLbl.textContent = `${f.def.skill.label} ✦ 준비완료`;
            skLbl.style.color = f.def.color;
          } else {
            skLbl.textContent = `${f.def.skill.label} (${(f.skillCooldown/1000).toFixed(1)}s)`;
            skLbl.style.color = '#999';
          }
        }
      }
    }
    // 쳐웃기 바 (한수민 전용)
    if (f.def.id === 'sumin') {
      const sk2El = document.getElementById('sk2-' + pid);
      const sk2Lbl = document.getElementById('sk2lbl-' + pid);
      if (sk2El && sk2Lbl) {
        if (f.skill2Used) {
          sk2El.style.width = '100%';
          sk2El.style.background = '#aaa';

          alive: f.hp > 0,
        })).sort((a, b) => b.dmg - a.dmg);
      dmgTable.innerHTML = '<div style="font-weight:800;font-size:12px;margin-bottom:5px;color:#333">📊 딜량</div>' +
        rows.map((r, rank) => {
          const bar = Math.round((r.dmg / (Math.max(...rows.map(x=>x.dmg)) || 1)) * 80);
          const op = r.alive ? 1 : 0.45;
          return '<div style="margin-bottom:4px;opacity:' + op + '">' +
            '<span style="color:' + r.color + ';font-weight:700">' + r.name + '</span>' +
            '<span style="float:right;font-weight:700;color:#333">' + r.dmg + '</span>' +
            '<div style="clear:both;background:#eee;border-radius:3px;height:4px;margin-top:2px">' +
            '<div style="background:' + r.color + ';width:' + bar + 'px;height:4px;border-radius:3px"></div>' +
            '</div></div>';
        }).join('');
    }
  }
}

// ─────────────────────────────────────────
// END
// ─────────────────────────────────────────
function stopGame() {
  if (gameLoop) { cancelAnimationFrame(gameLoop); gameLoop = null; }
  const predOverlay = document.getElementById('predict-overlay');
  if (predOverlay) predOverlay.style.display = 'none';
  gameState = null;
}

function endGame() {
  const winner = gameState.winner;
  const draw = gameState.draw;
  const wasPredict = !!window._predictMode;
  setTimeout(() => {
    if (wasPredict) {
      checkPredictResult();
      stopGame();
      return;
    }
    stopGame();
    if (draw) {
      document.getElementById('winnerName').textContent = '무승부';
      document.getElementById('resultText').textContent = '!!';
    } else {
      document.getElementById('winnerName').textContent = winner ? winner.def.name : '???';
      document.getElementById('resultText').textContent = '승리!';
    }
    showScreen('result');
  }, 500);
}
</script>
