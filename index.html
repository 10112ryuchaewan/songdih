          ct.ref.vx = Math.cos(ra) * BASE_SPEED * (ct.ref.speedMult || 1);
          ct.ref.vy = Math.sin(ra) * BASE_SPEED * (ct.ref.speedMult || 1);
          return false;
        }
        return true;
      });
    }

    // 건담경윤 변신 연출
    if (f.gundamTransformAnim && f.gundamOrbitParts && f.gundamOrbitParts.length > 0) {
      f.vx = 0; f.vy = 0;
      f.gundamOrbitTimer += dt;
      // 공전 속도 점점 증가
      const orbitSpeedMult = 1 + f.gundamOrbitTimer / 1000;
      // 파츠 공전 업데이트
      let allAbsorbed = true;
      f.gundamOrbitParts.forEach((op, oi) => {
        if (op.absorbed) return;
        allAbsorbed = false;
        op.speed = 0.03 * orbitSpeedMult;
        op.angle += op.speed * (dt / 16);
        op.orbitR = Math.max(10, 80 - f.gundamOrbitTimer * 0.025);
        // orbitR이 충분히 작아지면 흡수
        if (op.orbitR <= 15) {
          op.absorbed = true;
          f.gundamOrbitAbsorbed++;
          spawnParticle(particles, f.x, f.y, '#cc0000', 10);
          gameState.shake = Math.max(gameState.shake || 0, 4 + f.gundamOrbitAbsorbed);
        }
      });
      // 아직 안 흡수된 파츠 있으면 계속
      if (allAbsorbed && f.gundamOrbitAbsorbed >= 7) {
        // 모두 흡수 완료 → 변신 완료
        f.gundamTransformAnim = false;
        f.gundamOrbitParts = [];
        f.awakeningActive = false;
        f.gundamTransformed = true;
        f.def = { ...f.def, name: '건담경윤', color: '#cc0000',
          skill: { cooldown: 1000, label: '검 휘두르기', barColor: '#cc0000' } };
        f.maxHp += 100;
        f.hp = Math.min(f.maxHp, f.hp + 50);
        f.gundamSwordTimer = 0;
        f.speedMult = (f.speedMult || 1) * 1.5;
        // 충격파 발사
        for (let si = 0; si < 8; si++) {
          const sAng = (si / 8) * Math.PI * 2;
          gameState.soundwaves.push({
            x: f.x, y: f.y, r: f.r,
            speed: 9, life: 700, dmg: 15, knockback: BASE_SPEED * 5,
            owner: gameState.fighters.indexOf(f), hit: new Set(),
            isGundamShockwave: true,
          });
        }
        // 경기장 붉게 + 크게 흔들림
        f.gundamRedFlash = 1200;
        gameState.shake = Math.max(gameState.shake || 0, 20);
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 16, text: '건담경윤!!!',
          life: 2500, maxLife: 2500, vy: -0.4, color: '#cc0000', fontSize: 20,
        });
      }
    }
    // 붉은 화면 타이머 감소
    if ((f.gundamRedFlash || 0) > 0) f.gundamRedFlash -= dt;

    // 서연후 아이템 처리
    if (f.def.id === 'yeonhoo' && f.yeonhooItem && f.yeonhooItemTimer > 0) {
      // 광속질주: 이동속도만 5배 (방향 유지, 유도 없음)
      if (f.yeonhooItem === '광속질주') {
        f.awakeningActive = true; // 매 프레임 무적 강제 유지
        const curAng = Math.atan2(f.vy, f.vx);
        const RUSH_SPD = BASE_SPEED * 15;
        f.vx = Math.cos(curAng) * RUSH_SPD;
        f.vy = Math.sin(curAng) * RUSH_SPD;
        // 잔상 추가
        if (!f.rushTrail) f.rushTrail = [];
        f.rushTrail.unshift({x: f.x, y: f.y, alpha: 0.55, r: f.r});
        if (f.rushTrail.length > 12) f.rushTrail.pop();
      } else {
        // 아이템 끝나면 잔상 페이드아웃만 (즉시 지우지 않음)
      }
      // 잔상 알파 감소 (항상)
      if (f.rushTrail && f.rushTrail.length > 0) {
        f.rushTrail.forEach(t => { t.alpha -= 0.04; });
        f.rushTrail = f.rushTrail.filter(t => t.alpha > 0);
      }
      f.yeonhooItemTimer -= dt;
      // 자력: 주변 적 끌어당김
      if (f.yeonhooItem === '자력') {
        fighters.forEach((en, ei) => {
          if (ei === idx || en.hp <= 0) return;
          const dx = f.x - en.x, dy = f.y - en.y;
          const dist = Math.hypot(dx, dy) || 1;
          if (dist < 200 && dist > f.r + en.r) {
            // 강하게 직접 끌어당김 (속도 복귀 로직보다 강함)
            const pullAmt = Math.min(4, 200 / dist);
            en.x += (dx/dist) * pullAmt * (dt/16);
            en.y += (dy/dist) * pullAmt * (dt/16);
            en.vx = (dx/dist) * BASE_SPEED * 3;
            en.vy = (dy/dist) * BASE_SPEED * 3;
          }
        });
      }
      // 광속질주: 접촉 시 강한 밀치기 (충돌에서 처리)
      // 타이머 만료 시 원상복귀
      if (f.yeonhooItemTimer <= 0) {
        if (f.yeonhooItem === '거대화') {
          f.r = f.yeonhooBaseRadius;
          f.def = { ...f.def, touchDmg: f.yeonhooBaseTouchDmg };
        } else if (f.yeonhooItem === '광속질주') {
          f.speedMult = f.yeonhooBaseSpeedMult;
          f.awakeningActive = false;
        }
        f.yeonhooItem = null;
      }
    }

    // 출혈 처리 (모든 캐릭터)
    if ((f.bleedTimer || 0) > 0) {
      f.bleedTimer -= dt;
      f.bleedDmgTimer = Math.max(0, (f.bleedDmgTimer || 0) - dt);
      if (f.bleedDmgTimer <= 0) {
        applyDmg(f, 2);
        spawnParticle(particles, f.x, f.y, '#cc0000', 4);
        f.bleedDmgTimer = 400;
      }
    }

    // 황승오T 골든 상태 처리
    if (f.def.id === 'seungoh' && f.goldenActive) {
      f.goldenTimer -= dt;
      f.vx = 0; f.vy = 0; // 경직
      if (f.goldenTimer <= 0) {
        f.goldenActive = false;
        // 경직 해제 후 이동 재개
        const ra = Math.random() * Math.PI * 2;
        f.vx = Math.cos(ra) * BASE_SPEED;
        f.vy = Math.sin(ra) * BASE_SPEED;
      }
    }

    // 정승빈 터렛 쿨타임
    if (f.def.id === 'seungbin') {
      if (!f.isHyunLifted) f.turretCooldownTimer = Math.max(0, (f.turretCooldownTimer || 0) - dt);
    }

    // 이현철T 올라가! 처리
    if (f.def.id === 'hyuncheol' && f.hyunFrozenTargets && f.hyunFrozenTargets.length > 0) {
      f.hyunFrozenTargets = f.hyunFrozenTargets.filter(entry => {
        const target = fighters[entry.fIdx];
        if (!target || target.hp <= 0) return false;

        if (entry.phase === 'freeze') {
          // 3초 동안 고정
          target.vx = 0; target.vy = 0;
          // 위로 서서히 띄움
          const progress = 1 - entry.timer / f.def.skill3.freezeDuration;
          target.y = entry.origY - progress * 60;
          target.x = target.x; // 고정
          entry.timer -= dt;
          if (entry.timer <= 0) {
            entry.phase = 'fall';
            entry.fallTimer = f.def.skill3.fallDuration;
            entry.riseY = target.y; // 현재 위치에서 낙하 시작
          }
        } else if (entry.phase === 'fall') {
          // 빠르게 원래 위치로 추락
          const fallProg = 1 - entry.fallTimer / f.def.skill3.fallDuration;
          target.y = entry.riseY + (entry.origY - entry.riseY) * (fallProg * fallProg);
          target.vx = 0; target.vy = 0;
          entry.fallTimer -= dt;
          if (entry.fallTimer <= 0) {
            target.y = entry.origY;
            target.lastDmgFrom = idx;
            applyDmg(target, f.def.skill3.dmg);
            spawnParticle(particles, target.x, target.y, '#2c5f2e', 12);
            gameState.shake = Math.max(gameState.shake || 0, 10);
            // 속도 복구: 랜덤 방향으로 정상 이동 재개
            const recoverAng = Math.random() * Math.PI * 2;
            const recoverSpd = BASE_SPEED * (target.speedMult || 1);
            target.vx = Math.cos(recoverAng) * recoverSpd;
            target.vy = Math.sin(recoverAng) * recoverSpd;
            target.knockback = false;
            return false; // 처리 완료
          }
        }
        return true;
      });
    }

    // 이현철T 기지개 스킬 (스킬1)
    if (f.def.id === 'hyuncheol') {
      // 기지개 쿨타임 (따라해보자 중엔 멈춤)
      if (!f.hyunSkill1Paused) {
        f.skillCooldown = Math.max(0, f.skillCooldown - dt);
        if (f.skillCooldown <= 0) {
          // 회복
          f.hp = Math.min(f.maxHp, f.hp + f.def.skill.healAmt);
          f.skillCooldown = f.def.skill.cooldown;
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 6, text: '+' + f.def.skill.healAmt,
            life: 1200, maxLife: 1200, vy: -0.5, color: '#00bb44', fontSize: 13,
          });
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: f.x, y: f.y - f.r - 22, text: '살아나는 기지개~!',
            life: 1500, maxLife: 1500, vy: -0.35, color: '#2c5f2e', fontSize: 11,
          });
        }
      }

      // 자 따라해보자 트리거
      if (!f.hyunSkill2Triggered && f.hp <= f.def.skill2.triggerHp && f.hp > 0) {
        f.hyunSkill2Triggered = true;
        f.hyunSkill1Paused = true;
        // 제자리 정지 후 즉시 발사
        f.vx = 0; f.vy = 0;
        f.hyunTextQueue = f.def.skill2.text.split('');
        f.hyunTextTimer = 0;
      }

      // 글자 발사 (제자리에서)
      if (f.hyunTextQueue && f.hyunTextQueue.length > 0) {
        f.vx = 0; f.vy = 0; // 발사 중 정지
        f.hyunTextTimer -= dt;
        if (f.hyunTextTimer <= 0) {
          const ch = f.hyunTextQueue.shift();
          const aliveEn = fighters.filter((_,i) => i !== idx && fighters[i].hp > 0);
          if (aliveEn.length > 0 && ch.trim() !== '') {
            const tgt = aliveEn.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
            const ang = Math.atan2(tgt.y - f.y, tgt.x - f.x);
            const spd = f.def.skill2.charSpeed;
            const spread = (Math.random() - 0.5) * 0.25;
            gameState.saywords.push({
              x: f.x + Math.cos(ang) * f.r * 0.8,
              y: f.y + Math.sin(ang) * f.r * 0.8,
              vx: Math.cos(ang + spread) * spd,
              vy: Math.sin(ang + spread) * spd,
              owner: idx, r: 10,
              dmg: f.def.skill2.charDmg,
              label: ch,
              fontSize: 39,
              isBro: false, isNG: false,
              isHyun: true,
            });
            spawnParticle(gameState.particles,
              f.x + Math.cos(ang)*f.r, f.y + Math.sin(ang)*f.r,
              '#ff9900', 4);
          }
          f.hyunTextTimer = 30;
        }
      } else if (f.hyunTextQueue && f.hyunTextQueue.length === 0) {
        // 모든 글자 발사 완료 → 1초 후 복귀
        if (f.hyunFreezeTimer === 0) f.hyunFreezeTimer = 1000;
        f.hyunFreezeTimer -= dt;
        f.vx = 0; f.vy = 0;
        if (f.hyunFreezeTimer <= 0) {
          f.hyunTextQueue = null;
          f.hyunFreezeTimer = 0;
          f.hyunSkill1Paused = false;
          // 정상 이동 재개
          const ang = Math.random() * Math.PI * 2;
          f.vx = Math.cos(ang) * BASE_SPEED;
          f.vy = Math.sin(ang) * BASE_SPEED;
        }
      }

      // 구석/발사 중엔 이동 고정
      if (f.hyunCornerMoving || (f.hyunTextQueue !== null)) {
        if (!f.hyunCornerMoving) { f.vx = 0; f.vy = 0; }
      }
    }

    // 류병헌 lonely 패시브
    if (f.def.id === 'byungheon' && !f.isByungheonClone && f.hp > 0) {
      // 분열체가 하나라도 살아있으면 lonely 아님
      const hasClone = gameState.fighters.some(cf => cf.isByungheonClone && cf.cloneParent === f && cf.hp > 0);
      f.lonelyAura = !hasClone;

      if (f.lonelyAura) {
        const auraR = f.r * 10;
        f.lonelyAuraDmgTimer = Math.max(0, (f.lonelyAuraDmgTimer || 0) - dt);
        if (f.lonelyAuraDmgTimer <= 0) {
          enemies.forEach(en => {
            if (en.hp <= 0) return;
            if (Math.hypot(en.x - f.x, en.y - f.y) < auraR + en.r) {
              en.lastDmgFrom = idx;
              applyDmg(en, 0.2);
            }
          });
          f.lonelyAuraDmgTimer = 100; // 0.1초마다
        }
      }
    }

    // 유채완 머리카락 드롭 쿨타임
    if (f.def.id === 'chaewan') {
      if (!f.isHyunLifted) f.hairDropTimer = Math.max(0, (f.hairDropTimer || 0) - dt);
      // 2초마다 자동으로 머리카락 1개 드롭
      if (!f.isHyunLifted) f.hairAutoTimer = (f.hairAutoTimer !== undefined ? f.hairAutoTimer : 2000) - dt;
      if (f.hairAutoTimer <= 0) {
        f.hairAutoTimer = 2000;
        gameState.hairs.push({
          x: f.x + (Math.random() - 0.5) * f.r,
          y: f.y + (Math.random() - 0.5) * f.r,
          ownerId: idx,
          r: 6,
        });
      }
    }
    // 정영훈 농구공 벽 충돌 데미지
    if (f.bounceDmgActive) {
      const onWall = f.x - f.r <= 1 || f.x + f.r >= W-1 || f.y - f.r <= 1 || f.y + f.r >= H-1;
      if (onWall && !f.bounceDmgHit) {
        f.bounceDmgHit = true;
        f.bounceDmgActive = false;
        applyDmg(f, 12);
        spawnParticle(gameState.particles, f.x, f.y, '#d45c00', 12);
        gameState.shake = Math.max(gameState.shake || 0, 10);
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 8, text: '쾅!', life: 700, maxLife: 700, vy: -0.5, color: '#d45c00', fontSize: 15
        });
      }
      if (Math.hypot(f.vx, f.vy) < BASE_SPEED * 0.5) f.bounceDmgActive = false;
    }

    // 책상 위로! 벽 충돌 데미지
    if (f.deskWallDmgActive) {
      const onWall = f.x - f.r <= 0 || f.x + f.r >= W || f.y - f.r <= 0 || f.y + f.r >= H;
      if (onWall && !f.deskWallHit) {
        applyDmg(f, 20);
        f.deskWallHit = true;
        f.deskWallDmgActive = false;
        spawnParticle(gameState.particles, f.x, f.y, '#8b4513', 12);
        gameState.shake = Math.max(gameState.shake || 0, 12);
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 8,
          text: '쾅!', life: 800, maxLife: 800, vy: -0.5,
          color: '#8b4513', fontSize: 16,
        });
      }
      // 속도가 거의 0이 되면 해제
      if (Math.hypot(f.vx, f.vy) < BASE_SPEED * 0.5) f.deskWallDmgActive = false;
    }

    // 머리카락 면역 타이머
    if (f.hairImmuneTimer > 0) f.hairImmuneTimer -= dt;

    // Skill cooldown & activation (이현철T, 분열체, 황승오T, 더미는 자체 처리)
    // 홍은주T 경직 중인 캐릭터인지 확인
    const isEunjuCharmed = gameState && gameState.fighters.some(ft =>
      ft.def.id === 'eunju' && ft.eunjuCharmTargets && ft.eunjuCharmTargets.some(ct => ct.ref === f)
    );
    if (f.def.id !== 'hyuncheol' && !f.isByungheonClone && f.def.id !== 'seungoh' && f.def.id !== 'hyekyung' && f.def.id !== 'sehwan' && f.def.id !== 'geumilcheol' && !f.def.isDummy && !(f.sleepTimer >= 0) && !isEunjuCharmed && !(f.sehwanInRoom && f.def.id !== 'sehwan') && !f.isHyunLifted) {
      f.skillCooldown = Math.max(0, f.skillCooldown - dt);
      if (f.skillCooldown <= 0) {
        activateSkill(f, idx, enemy);
        f.skillCooldown = f.def.skill.cooldown;
        // 류병헌 본체 스킬 시 분열체도 동시에 스킬 사용
        if (f.def.id === 'byungheon') {
          gameState.fighters.forEach((cf, ci) => {
            if (!cf.isByungheonClone || cf.cloneParent !== f || cf.hp <= 0) return;
            activateSkill(cf, ci, enemy);
            cf.skillCooldown = cf.def.skill.cooldown;
          });
        }
      }
    }
    // 스킬2 쿨타임 (김태양 트름)
    if (f.def.id === 'taeyoung' && f.def.skill2) {
      if (!f.isHyunLifted) f.skill2Cooldown = Math.max(0, (f.skill2Cooldown || 0) - dt);
      if (f.skill2Cooldown <= 0) {
        // 트름: 현재 위치에 가스 생성
        gameState.gases.push({
          x: f.x, y: f.y,
          r: f.r * 3,
          life: f.def.skill2.gasDuration,
          maxLife: f.def.skill2.gasDuration,
          ownerId: idx,
          hitCooldown: 0,
        });
        spawnParticle(gameState.particles, f.x, f.y, '#7abf00', 10);
        f.skill2Cooldown = f.def.skill2.cooldown;
      }
    }
    // 중독 처리
    if (f.poisonTimer > 0) {
      f.poisonTimer -= dt;
      if (!f.isHyunLifted) f.poisonDmgTimer = Math.max(0, (f.poisonDmgTimer || 0) - dt);
      if (f.poisonDmgTimer <= 0) {
        // 독 딜러 추적 생략 (가스 ownerId)
        applyDmg(f, 2);
        spawnParticle(gameState.particles, f.x, f.y, '#7abf00', 3);
        f.poisonDmgTimer = 1000;
      }
    }

    // Aura tick (김태양)
    if (f.def.id === 'taeyoung' && f.skillActive) {
      f.auraTimer = Math.max(0, f.auraTimer - dt);
      if (f.auraTimer <= 0) f.skillActive = false;
      if (!f.isHyunLifted) f.auraDmgTimer = Math.max(0, f.auraDmgTimer - dt);
      if (f.auraDmgTimer <= 0) {
        const auraR = f.r * f.def.skill.auraRadiusMult;
        // 범위 내 캐릭터 수 계산
        const inAura = enemies.filter(en => en.hp > 0 && Math.hypot(en.x - f.x, en.y - f.y) < auraR + en.r);
        const bonusDmg = inAura.length * 0.5;
        inAura.forEach(en => {
          en.lastDmgFrom = idx;
          applyDmg(en, f.def.skill.auraDmg + bonusDmg);
          spawnParticle(particles, en.x, en.y, f.def.color, 3);
        });
        f.auraDmgTimer = f.def.skill.auraDmgInterval;
      }
    }

    // Giwon wall collision
    walls.forEach(wall => {
      const isOwner = f.def.id === 'giwon' && wall.ownerId === idx;

      // Body collision with wall box (push out)
      if (wallBodyHit(f, wall)) {
        const half = wall.half;
        const dx = f.x - wall.x, dy = f.y - wall.y;
        // Find smallest overlap axis
        const overlapX = half + f.r - Math.abs(dx);
        const overlapY = half + f.r - Math.abs(dy);
        if (overlapX < overlapY) {
          f.x += (dx > 0 ? overlapX : -overlapX);
          f.vx *= -1;
        } else {
          f.y += (dy > 0 ? overlapY : -overlapY);
          f.vy *= -1;
        }
      }

      // Spike collision (enemy only)
      if (!isOwner) {
        const spikeIdx = wallSpikeHit(f, wall);
        if (spikeIdx >= 0 && (wall.spikeCooldowns[spikeIdx] || 0) <= 0) {
          const now = Date.now();
          const baseDmg = wall.wall ? wall.wall.spikeD : 10.7;
          const dmg = (now - f.lastSpikeHitTime < 300) ? baseDmg * 0.5 : baseDmg;
          f.lastSpikeHitTime = now;
          applyDmg(f, dmg);
          // Big knockback: 가시 반대 방향 + 45도 회전으로 재접촉 방지
          // spikeIdx: 0=top,1=right,2=bottom,3=left → 반대 방향 각도
          const baseAngles = [Math.PI/2, Math.PI, -Math.PI/2, 0]; // 각 가시 반대
          const baseAngle = baseAngles[spikeIdx];
          // 45도(π/4) 편향 — 벽 중심에서 fighter 위치로 결정
          const bias = (f.x > wall.x || (f.x === wall.x && f.y < wall.y)) ? Math.PI/4 : -Math.PI/4;
          const knockAngle = baseAngle + bias;
          const knock = BASE_SPEED * 5.0;
          f.vx = Math.cos(knockAngle) * knock;
          f.vy = Math.sin(knockAngle) * knock;
          f.knockback = true;
          wall.spikeCooldowns[spikeIdx] = 600; // 0.6s cooldown per spike
          spawnParticle(particles, f.x, f.y, '#3a3a8c', 8);
        }
      }
    });
  });

    // Spike cooldowns countdown
  walls.forEach(wall => {
    for (let d = 0; d < 4; d++) {
      if (wall.spikeCooldowns[d] > 0) wall.spikeCooldowns[d] -= dt;
    }
  });


  // Gear update
  const { gears } = gameState;
  gears.forEach(gear => {
    gear.rotation += 0.02;
    gear.dmgTimer = Math.max(0, gear.dmgTimer - dt);

    fighters.forEach((f, idx) => {
      if (f.def.id === 'giwon' && gear.ownerId === idx) return; // 주인 면역
      const dist = Math.hypot(f.x - gear.x, f.y - gear.y);
      if (f.hp <= 0) { f.inGear = false; return; }
      if (dist < gear.r + f.r) {
        f.inGear = true;
        // 도트 데미지 0.1초당 0.8
        if (gear.dmgTimer <= 0) {
          applyDmg(f, 0.8);
          gear.dmgTimer = 100;
        }
      } else {
        f.inGear = false;
      }
    });
  });

  // 기어 속도 감속은 통합 속도 복귀 로직에서 처리됨

  // Fighter-fighter collision (모든 쌍)
  for (let a = 0; a < fighters.length; a++) {
    for (let b = a + 1; b < fighters.length; b++) {
      const fa = fighters[a], fb = fighters[b];
      const dist = Math.hypot(fb.x - fa.x, fb.y - fa.y);
      if (dist < fa.r + fb.r) {
        const angle = Math.atan2(fb.y - fa.y, fb.x - fa.x);
        const spdA = Math.hypot(fa.vx, fa.vy);
        const spdB = Math.hypot(fb.vx, fb.vy);
        fa.vx = -Math.cos(angle) * spdA; fa.vy = -Math.sin(angle) * spdA;
        fb.vx =  Math.cos(angle) * spdB; fb.vy =  Math.sin(angle) * spdB;
        const overlap = (fa.r + fb.r - dist) / 2;
        fa.x -= Math.cos(angle) * overlap; fa.y -= Math.sin(angle) * overlap;
        fb.x += Math.cos(angle) * overlap; fb.y += Math.sin(angle) * overlap;
        const now = Date.now();
        // 분열체 ↔ 본체 간 데미지 없음
        // 류병헌 계열끼리 데미지 없음 (루트 본체 기준)
        function byungheonRoot(fighter) {
          let cur = fighter;
          while (cur.isByungheonClone && cur.cloneParent) cur = cur.cloneParent;
          return cur.def.id === 'byungheon' ? cur : null;
        }
        const rootA = byungheonRoot(fa), rootB = byungheonRoot(fb);
        const isFriendly = rootA && rootB && rootA === rootB;
        if (!isFriendly && now - fa.lastTouchTime > 500) {
          [{ attacker: fa, target: fb }, { attacker: fb, target: fa }].forEach(({ attacker, target }) => {
            if (attacker.def.id === 'taeyeon' && attacker.tiananmenReady && !target.tiananmenCaged) {
              attacker.tiananmenReady = false;
              attacker.tiananmenCooldown = 20000;
              // 발동 텍스트
              attacker.tiananmenText = { timer: 2200 };
              // 박스 생성 (상대를 가두고 강하게 밀어냄)
              const bw = target.r * 3.5, bh = target.r * 3.5;
              const pushAngle = Math.atan2(target.y - attacker.y, target.x - attacker.x);
              const pushSpd = BASE_SPEED * 18;
              target.tiananmenCaged = true;
              target.tiananmenCageTimer = 3000;
              target.tiananmenBox = {
                x: target.x, y: target.y,
                w: bw, h: bh,
                vx: Math.cos(pushAngle) * pushSpd,
                vy: Math.sin(pushAngle) * pushSpd,
                bounces: 0,
              };
              spawnParticle(particles, target.x, target.y, '#8b0000', 15);
            }
          });
          // 금일철P 근접 경직
          [[fa, a, fb, b], [fb, b, fa, a]].forEach(([att, ai, tgt, ti]) => {
            if (att.def.id !== 'geumilcheol') return;
            if ((att.geumGoldTargets||[]).some(gt => gt.ref === tgt)) return; // 이미 경직 중
            att.geumGoldTargets = att.geumGoldTargets || [];
            att.geumGoldTargets.push({ ref: tgt, timer: 2000 });
            tgt.vx = 0; tgt.vy = 0;
            spawnParticle(particles, tgt.x, tgt.y, '#c8a800', 10);
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: tgt.x, y: tgt.y - tgt.r - 10, text: 'midas touch', life: 800, maxLife: 800,
              vy: -0.4, color: '#c8a800', fontSize: 13,
            });
          });

          // 서연후 자력/광속질주 처리 (선언 먼저)
          const faYeonhooMagnet = fa.def.id === 'yeonhoo' && fa.yeonhooItem === '자력';
          const fbYeonhooMagnet = fb.def.id === 'yeonhoo' && fb.yeonhooItem === '자력';

          // 서연후 광속질주 강한 밀치기
          [[fa, fb], [fb, fa]].forEach(([att, tgt]) => {
            if (att.def.id !== 'yeonhoo' || att.yeonhooItem !== '광속질주') return;
            const kang = Math.atan2(tgt.y - att.y, tgt.x - att.x);
            tgt.vx = Math.cos(kang) * BASE_SPEED * 10;
            tgt.vy = Math.sin(kang) * BASE_SPEED * 10;
            tgt.knockback = true;
          });

          // TIDAL WAVE 공격력/방어 보정
          const dmgAtoB = (fa.def.id === 'giwon' && fa.tidalActive ? 10 : fa.def.touchDmg) * (fa.hairAtkReduce || 1.0);
          const dmgBtoA = (fb.def.id === 'giwon' && fb.tidalActive ? 10 : fb.def.touchDmg) * (fb.hairAtkReduce || 1.0);
          // 자력 중 접촉 피해 면역
          const applyAtoB = !fbYeonhooMagnet;
          const applyBtoA = !faYeonhooMagnet;
          fb.lastDmgFrom = gameState.fighters.indexOf(fa.isByungheonClone && fa.cloneParent ? fa.cloneParent : fa);
          // 홍은주T 피보나치: 접촉 공격 성공 시 증가
          [[fa, fb], [fb, fa]].forEach(([att, tgt]) => {
            if (att.def.id !== 'eunju') return;
            if (tgt.hp <= 0) return;
            const next = att.eunjuFibA + att.eunjuFibB;
            att.eunjuFibA = att.eunjuFibB;
            att.eunjuFibB = next;
            att.def = { ...att.def, touchDmg: att.eunjuFibB };
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: att.x, y: att.y - att.r - 10, text: 'DMG: ' + att.eunjuFibB,
              life: 600, maxLife: 600, vy: -0.3, color: '#d4186c', fontSize: 11,
            });
          });
          if (applyAtoB) applyDmg(fb, dmgAtoB, fa);
          fa.lastDmgFrom = gameState.fighters.indexOf(fb.isByungheonClone && fb.cloneParent ? fb.cloneParent : fb);
          if (applyBtoA) applyDmg(fa, dmgBtoA, fb);

          // 노준우 접촉 시 크게 밀쳐냄
          [[fa, a, fb, b], [fb, b, fa, a]].forEach(([att, ai, tgt, ti]) => {
            if (!att.nojunwoo) return;
            const kang = Math.atan2(tgt.y - att.y, tgt.x - att.x);
            tgt.vx = Math.cos(kang) * BASE_SPEED * 8;
            tgt.vy = Math.sin(kang) * BASE_SPEED * 8;
            tgt.knockback = true;
          });

          // 정영훈 농구공 튕기기 (아래로 날림)
          [[fa, a, fb, b], [fb, b, fa, a]].forEach(([att, ai, tgt, ti]) => {
            if (att.def.id !== 'younghoon') return;
            if (!att.bounceHitMap) att.bounceHitMap = {};
            if (att.bounceHitMap[ti]) return;
            att.bounceHitMap[ti] = true;
            tgt.vx = (Math.random() - 0.5) * BASE_SPEED * 3;
            tgt.vy = BASE_SPEED * 9;
            tgt.knockback = true;
            tgt.bounceDmgActive = true;
            tgt.bounceDmgHit = false;
            spawnParticle(particles, tgt.x, tgt.y, '#d45c00', 8);
            if (gameState.dmgTexts) gameState.dmgTexts.push({
              x: att.x, y: att.y - att.r - 10,
              text: '↓↓', life: 600, maxLife: 600, vy: -0.3, color: '#d45c00', fontSize: 20,
            });
          });

          // 송영욱 vs 복제체 접촉 데미지
          [[fa, fb], [fb, fa]].forEach(([att, tgt]) => {
            if (att.def.id !== 'youngouk') return;
            if (!tgt.isByungheonClone) return;
            tgt.lastDmgFrom = gameState.fighters.indexOf(att);
            applyDmg(tgt, 10);
            spawnParticle(particles, tgt.x, tgt.y, att.def.color, 6);
          });

          // 이현철T 접촉 시: 올라가! + 넉백
          function triggerOllaga(attacker, aIdx, target, tIdx) {
            // 이미 처리 중인 타겟이면 스킵
            if (attacker.hyunFrozenTargets.find(e => e.fIdx === tIdx)) return;
            if (!attacker.hyunHitCount) attacker.hyunHitCount = {};
            attacker.hyunHitCount[tIdx] = (attacker.hyunHitCount[tIdx] || 0) + 1;
            const hitCount = attacker.hyunHitCount[tIdx];
            const isDesk = hitCount % 3 === 0; // 3번째마다 책상 위로!

            if (isDesk) {
              // 책상 위로! — 북쪽으로 강하게 밀치기
              target.vx = 0;
              target.vy = -BASE_SPEED * 12; // 북쪽으로 강하게
              target.knockback = true;
              target.deskWallDmgActive = true;  // 벽 충돌 시 20데미지
              target.deskWallHit = false;
              if (gameState.dmgTexts) {
                gameState.dmgTexts.push({
                  x: attacker.x, y: attacker.y - attacker.r - 8,
                  text: '책상 위로 올라가!', life: 1500, maxLife: 1500, vy: -0.45,
                  color: '#8b4513', fontSize: 13,
                });
                gameState.dmgTexts.push({
                  x: target.x, y: target.y - target.r - 8,
                  text: '📚 올라가!!', life: 1200, maxLife: 1200, vy: -0.5,
                  color: '#8b4513', fontSize: 13,
                });
              }
            } else {
              // 일반 올라가!
              attacker.hyunFrozenTargets.push({
                fIdx: tIdx,
                timer: attacker.def.skill3.freezeDuration,
                phase: 'freeze',
                origY: target.y,
                fallTimer: 0,
              });
              if (gameState.dmgTexts) {
                gameState.dmgTexts.push({
                  x: attacker.x, y: attacker.y - attacker.r - 8,
                  text: '올라가!', life: 1200, maxLife: 1200, vy: -0.5,
                  color: '#2c5f2e', fontSize: 15,
                });
                gameState.dmgTexts.push({
                  x: target.x, y: target.y - target.r - 8,
                  text: '↑ 올라가! ↑', life: 1000, maxLife: 1000, vy: -0.45,
                  color: '#cc0000', fontSize: 12,
                });
              }
            }
          }
          if (fa.def.id === 'hyuncheol') {
            triggerOllaga(fa, a, fb, b);
            const kang = Math.atan2(fb.y - fa.y, fb.x - fa.x);
            fb.vx = Math.cos(kang) * BASE_SPEED * 6;
            fb.vy = Math.sin(kang) * BASE_SPEED * 6;
            fb.knockback = true;
          }
          if (fb.def.id === 'hyuncheol') {
            triggerOllaga(fb, b, fa, a);
            const kang = Math.atan2(fa.y - fb.y, fa.x - fb.x);
            fa.vx = Math.cos(kang) * BASE_SPEED * 6;
            fa.vy = Math.sin(kang) * BASE_SPEED * 6;
            fa.knockback = true;
          }
          // TIDAL WAVE 넉백
          if (fa.def.id === 'giwon' && fa.tidalActive) {
            const kang = Math.atan2(fb.y - fa.y, fb.x - fa.x);
            fb.vx = Math.cos(kang) * BASE_SPEED * 7;
            fb.vy = Math.sin(kang) * BASE_SPEED * 7;
            fb.knockback = true;
          }
          if (fb.def.id === 'giwon' && fb.tidalActive) {
            const kang = Math.atan2(fa.y - fb.y, fa.x - fb.x);
            fa.vx = Math.cos(kang) * BASE_SPEED * 7;
            fa.vy = Math.sin(kang) * BASE_SPEED * 7;
            fa.knockback = true;
          }
          spawnParticle(particles, (fa.x+fb.x)/2, (fa.y+fb.y)/2, '#555', 5);
          // 정승빈 접촉 시 터렛 설치
          [fa, fb].forEach(f => {
            if (f.def.id !== 'seungbin') return;
            if ((f.turretCooldownTimer || 0) > 0) return;
            gameState.turrets.push({
              x: f.x, y: f.y,
              ownerId: gameState.fighters.indexOf(f),
              fireTimer: 2000,
              r: 16,
            });
            f.turretCooldownTimer = f.def.turretCooldown;
            spawnParticle(particles, f.x, f.y, '#1a7a1a', 8);
          });
          // 정영훈 bounceHitMap 리셋 (새 접촉마다)
          if (fa.def.id === 'younghoon') fa.bounceHitMap = {};
          if (fb.def.id === 'younghoon') fb.bounceHitMap = {};
          fa.lastTouchTime = fb.lastTouchTime = now;
        } // end !isFriendly
      }
    }
  }
  // Notes (김태연 음표 — 벽 닿으면 소멸)
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];

    // 윙맨 상태면 음표에 약한 유도 적용
    const owner = fighters[n.owner];
    if (owner && owner.awakened) {
      // 가장 가까운 살아있는 적 찾기
      const targets = fighters.filter((f, fi) => fi !== n.owner && f.hp > 0);
      if (targets.length > 0) {
        const tgt = targets.reduce((a, b) => Math.hypot(a.x-n.x,a.y-n.y) < Math.hypot(b.x-n.x,b.y-n.y) ? a : b);
        const dx = tgt.x - n.x, dy = tgt.y - n.y;
        const dist = Math.hypot(dx, dy) || 1;
        const homeStr = 0.06; // 유도 강도 (약하게)
        n.vx += (dx / dist) * homeStr;
        n.vy += (dy / dist) * homeStr;
        // 속도 클램프 (너무 빨라지지 않게)
        const spd = Math.hypot(n.vx, n.vy);
        const maxSpd = 14;
        if (spd > maxSpd) { n.vx = n.vx / spd * maxSpd; n.vy = n.vy / spd * maxSpd; }
      }
    }

    n.x += n.vx * timeScale; n.y += n.vy * timeScale;
    if (n.x < 0 || n.x > W || n.y < 0 || n.y > H) { notes.splice(i, 1); continue; }
    // 히트 체크 (김태연 가사는 관통, 터렛은 소멸)
    let turretHit = false;
    fighters.forEach((ef, eidx) => {
      if (eidx === n.owner) return;
      if (n.isTurretBullet && turretHit) return;
      // 같은 경기장 캐릭터끼리만 충돌
      const noteOwner = n.owner !== undefined ? fighters[n.owner] : null;
      if (!!ef.sehwanInRoom) return; // 진실의 방 안은 notes 피격 없음
      if (noteOwner && noteOwner.sehwanInRoom) return; // 방 안 캐릭터가 쏜 탄막
      if (Math.hypot(ef.x - n.x, ef.y - n.y) < ef.r + n.r) {
        if (ef.hp <= 0) return;
        // 0.2초 쿨타임으로 같은 적에 중복 히트 방지
        if (!n.hitCooldowns) n.hitCooldowns = {};
        if ((n.hitCooldowns[eidx] || 0) > 0) return;
        ef.lastDmgFrom = n.owner;
        const noteDmg = n.isTurretBullet ? n.dmg : (n.owner !== undefined && gameState.fighters[n.owner] && gameState.fighters[n.owner].noteCount > 7 ? 7 * 0.8 : 7);
        applyDmg(ef, noteDmg);
        spawnParticle(particles, n.x, n.y, fighters[n.owner] ? fighters[n.owner].def.color : '#d0186e', 5);
        if (n.isTurretBullet) turretHit = true;
        else n.hitCooldowns[eidx] = 200; // 0.2초 쿨
      }
    });
    if (turretHit) { notes.splice(i, 1); continue; }
    // 히트 쿨다운 감소
    if (n.hitCooldowns) {
      Object.keys(n.hitCooldowns).forEach(k => { n.hitCooldowns[k] -= dt; });
    }
  }

  // 한수민 sayQueue 처리
  fighters.forEach((f, idx) => {
    if (f.def.id !== 'sumin' || !f.sayQueue || f.sayQueue.length === 0) return;
    const aliveEn3b = fighters.filter((_,i)=>i!==idx&&fighters[i].hp>0);
    if (aliveEn3b.length===0) { f.sayQueue=[]; return; }
    const enemy = aliveEn3b.reduce((a,b)=>Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
    for (let qi = f.sayQueue.length - 1; qi >= 0; qi--) {
      f.sayQueue[qi].delay -= dt;
      if (f.sayQueue[qi].delay <= 0) {
        const item = f.sayQueue[qi];
        f.sayQueue.splice(qi, 1);
        const angle = Math.atan2(enemy.y - f.y, enemy.x - f.x);
        const WORDS = {
          say:     { speed: 5.5,  r: 12,   dmg: 1,  fontSize: 14 },
          wallahi: { speed: 4.2,  r: 15.6, dmg: 2,  fontSize: 12 },
          bro:     { speed: 11.0, r: 18,   dmg: 6,  fontSize: 16 },
        };
        const w = WORDS[item.word] || WORDS.say;
        gameState.saywords.push({
          x: f.x, y: f.y,
          vx: Math.cos(angle) * w.speed,
          vy: Math.sin(angle) * w.speed,
          owner: idx,
          r: w.r,
          dmg: w.dmg,
          label: item.word,
          fontSize: w.fontSize,
          isBro: item.word === 'bro',
        });
      }
    }
  });

  // bro 복귀 타이머
  fighters.forEach(f => {
    if (!f.broReturnTimer) return;
    f.broReturnTimer -= dt;
    if (f.broReturnTimer <= 0) {
      f.broReturnTimer = 0;
      if (f.broReturnVx !== undefined) {
        f.vx = f.broReturnVx;
        f.vy = f.broReturnVy;
        f.knockback = false;
        delete f.broReturnVx;
        delete f.broReturnVy;
      }
    }
  });

  // Say/Wallahi 투사체 (벽에 튕기고 적에게만 닿으면 소멸)
  const { saywords, soundwaves } = gameState;
  for (let i = saywords.length - 1; i >= 0; i--) {
    const s = saywords[i];
    s.x += s.vx * timeScale; s.y += s.vy * timeScale;
    // NG는 벽에 닿으면 사라짐, 나머지는 튕김
    const hitWall = s.x - s.r < 0 || s.x + s.r > W || s.y - s.r < 0 || s.y + s.r > H;
    if (hitWall && s.isHyun) {
      if (gameState) gameState.shake = Math.max(gameState.shake || 0, 3);
      saywords.splice(i, 1); continue;
    }
    if (hitWall && s.isNG) { saywords.splice(i, 1); continue; }
    if (s.x - s.r < 0) { s.x = s.r; s.vx = Math.abs(s.vx); }
    if (s.x + s.r > W) { s.x = W - s.r; s.vx = -Math.abs(s.vx); }
    if (s.y - s.r < 0) { s.y = s.r; s.vy = Math.abs(s.vy); }
    if (s.y + s.r > H) { s.y = H - s.r; s.vy = -Math.abs(s.vy); }
    // 모든 적에게 히트 체크
    let sayHit = false;
    fighters.forEach((ef, eidx) => {
      if (eidx === s.owner || sayHit) return;
      if (Math.hypot(ef.x - s.x, ef.y - s.y) < ef.r + s.r) {
        ef.lastDmgFrom = s.owner;
        applyDmg(ef, s.dmg);
        spawnParticle(particles, s.x, s.y, '#2e8b3a', 6);
        // bro: bro가 날아온 방향으로 후퇴 후 원래 방향 복귀
        if (s.isBro) {
          const curSpd = Math.hypot(ef.vx, ef.vy) || 1;
          ef.broReturnVx = ef.vx / curSpd * BASE_SPEED * (ef.speedMult || 1);
          ef.broReturnVy = ef.vy / curSpd * BASE_SPEED * (ef.speedMult || 1);
          ef.broReturnTimer = 300;
          const broSpd = Math.hypot(s.vx, s.vy) || 1;
          ef.vx = (s.vx / broSpd) * BASE_SPEED * 3.5;
          ef.vy = (s.vy / broSpd) * BASE_SPEED * 3.5;
          ef.knockback = true;
        }
        sayHit = true;
      }
    });
    if (sayHit) { saywords.splice(i, 1); continue; }
  }

  // 음파 (쳐웃기) 업데이트
  for (let i = soundwaves.length - 1; i >= 0; i--) {
    const sw = soundwaves[i];
    sw.r += sw.speed * dt / 16;
    sw.life -= dt;
    if (sw.life <= 0) { soundwaves.splice(i, 1); continue; }
    // 음파가 상대에 닿으면 데미지+넉백 (한 번만)
    fighters.forEach((f, idx) => {
      if (idx === sw.owner) return;
      if (sw.hit.has(idx)) return;
      // isSehwanShock: 한세환 면역, 진실의 방 안 캐릭터만 피격
      if (sw.isSehwanShock && f.def.id === 'sehwan') return;
      if (sw.isSehwanShock && !f.sehwanInRoom) return;
      if (f.hp <= 0) return;
      const dist = Math.hypot(f.x - sw.x, f.y - sw.y);
      if (dist < sw.r + f.r && dist > sw.r - 10) {
        f.lastDmgFrom = sw.owner >= 0 ? sw.owner : -1;
        applyDmg(f, sw.dmg);
        // 넉백
        const dx = f.x - sw.x, dy = f.y - sw.y;
        const len = Math.hypot(dx, dy) || 1;
        f.vx = (dx / len) * sw.knockback;
        f.vy = (dy / len) * sw.knockback;
        f.knockback = true;
        f.wallDmgTimer = sw.wallDmgTimer; // 0.3초 벽 데미지
        f.wallDmgHits = 0; // 카운터 리셋
        sw.hit.add(idx);
      }
    });
  }

  // wallDmgTimer 감소 및 벽 충돌 시 추가 데미지
  fighters.forEach((f, idx) => {
    if (f.hp <= 0) return;
    if (f.wallDmgTimer > 0) {
      f.wallDmgTimer -= dt;
      const onWall = f.x - f.r <= 0 || f.x + f.r >= W || f.y - f.r <= 0 || f.y + f.r >= H;
      if (onWall && !f.wasOnWall) {
        // 빠른 속도로 벽에 닿으면 흔들림
        const wallSpd = Math.hypot(f.vx, f.vy);
        if (wallSpd > BASE_SPEED * 2.5 && gameState) gameState.shake = Math.max(gameState.shake || 0, Math.min(14, wallSpd * 0.8));
      }
      if (onWall && !f.wasOnWall && (f.wallDmgHits || 0) < 3) {
        applyDmg(f, 1);
        f.wallDmgHits = (f.wallDmgHits || 0) + 1;
        spawnParticle(particles, f.x, f.y, '#ff6b00', 8);
        if (f.wallDmgHits >= 3) f.wallDmgTimer = 0;
      }
      f.wasOnWall = onWall;
    }
  });

  // 한수민 쳐웃기 자동 발동 체크
  fighters.forEach((f, idx) => {
    if (f.def.id !== 'sumin') return;
    if (f.skill2Used) return;
    if (f.hp > f.maxHp * 0.5) return;
    const aliveEn2 = fighters.filter((_, i) => i !== idx && fighters[i].hp > 0);
    if (aliveEn2.length === 0) return;
    const nearEn = aliveEn2.reduce((a,b) => Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
    const dist2 = Math.hypot(nearEn.x - f.x, nearEn.y - f.y);
    if (dist2 < (f.def.skill2 ? f.def.skill2.triggerRange : 90)) {
      // 발동!
      f.skill2Used = true;
      f.ngActive = true;
      f.ngFireTimer = 0;
      f.laughText = { timer: 1200 }; // 텍스트 표시 시간
      const sk2 = f.def.skill2;
      const waveCount = 5;
      for (let w = 0; w < waveCount; w++) {
        soundwaves.push({
          x: f.x, y: f.y,
          r: f.r,
          speed: (sk2 ? sk2.waveSpeed : 7) + w * 1.2,
          life: 800,
          dmg: sk2 ? sk2.waveDmg : 4,
          knockback: BASE_SPEED * 6,
          wallDmgTimer: 300,
          owner: idx,
          hit: new Set(),
        });
      }
      spawnParticle(particles, f.x, f.y, '#ff6b00', 20);
    }
  });

  // laughText 타이머
  fighters.forEach(f => {
    if (f.laughText) f.laughText.timer -= dt;
  });

  // NG 스킬: 쳐웃기 후 활성화, 근접 시 0.3초마다 발사
  fighters.forEach((f, idx) => {
    if (f.def.id !== 'sumin' || !f.ngActive) return;
    if ((f.sleepTimer || 0) >= 0) return; // 수면 중 발사 금지
    if (f.hp <= 0) return; // 사망 시 NG 발사 안 함
    if (!f.isHyunLifted) f.ngFireTimer = Math.max(0, f.ngFireTimer - dt);
    const aliveEnemies = fighters.filter((_, i) => i !== idx && fighters[i].hp > 0);
    if (aliveEnemies.length === 0) return;
    const ngEnemy = aliveEnemies.reduce((a,b) => Math.hypot(a.x-f.x,a.y-f.y)<Math.hypot(b.x-f.x,b.y-f.y)?a:b);
    const dist = Math.hypot(ngEnemy.x - f.x, ngEnemy.y - f.y);
    const triggerRange = 140;
    if (dist < triggerRange && f.ngFireTimer <= 0) {
      const speed = 7.5;
      const angle = Math.atan2(ngEnemy.y - f.y, ngEnemy.x - f.x);
      gameState.saywords.push({
        x: f.x, y: f.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        owner: idx,
        r: 11,
        dmg: 1,
        label: '하핚!!',
        fontSize: 13,
        isBro: false,
        isNG: true,
      });
      f.ngFireTimer = 100; // 0.1초마다
    }
  });

  // 정영훈 물자국 블랙홀 효과
  if (!gameState.mopWaterIn) gameState.mopWaterIn = {};
  (gameState.mopWaters || []).forEach((mop, mi) => {
    fighters.forEach((ft, fi) => {
      if (ft.hp <= 0) return;
      if (ft.def.id === 'younghoon') return; // 정영훈 면역
      if (ft.sehwanInRoom) return; // 진실의 방 캐릭터 면역
      const dx = mop.x - ft.x, dy = mop.y - ft.y;
      const dist = Math.hypot(dx, dy) || 1;
      const inside = dist < mop.r + ft.r;
      // 진입 키: 캐릭터 인덱스 + 물자국 인덱스
      const key = fi * 1000 + mi;
      if (!gameState.mopWaterIn) gameState.mopWaterIn = {};
      if (inside) {
        if (!gameState.mopWaterIn[key]) {
          // 최초 입장: 물 튀김 3데미지
          gameState.mopWaterIn[key] = true;
          ft.lastDmgFrom = mop.ownerId;
          applyDmg(ft, 3);
          spawnParticle(particles, ft.x, ft.y, '#4a90d9', 8);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: ft.x, y: ft.y - ft.r - 8, text: '💧', life: 700, maxLife: 700, vy: -0.4, fontSize: 14, color: '#4a90d9'
          });
        }
        // 끌어들임: 힘 줄임 (0.5 → 0.18)
        const pullStr = BASE_SPEED * 0.03;
        ft.vx += (dx / dist) * pullStr;
        ft.vy += (dy / dist) * pullStr;
      } else {
        gameState.mopWaterIn[key] = false;
      }
    });
  });

  // 정승빈 터렛 처리
  const { turrets, sunflowers } = gameState;
  for (let ti = turrets.length - 1; ti >= 0; ti--) {
    const turret = turrets[ti];
    turret.fireTimer -= dt;
    if (turret.fireTimer <= 0) {
      turret.fireTimer = 2000; // 2초 공속
      // 가장 가까운 살아있는 적에게 발사
      const owner = fighters[turret.ownerId];
      const enemies = fighters.filter((f, fi) => {
        if (f.hp <= 0) return false;
        if (fi === turret.ownerId) return false;
        if (owner && f.def.id === 'seungbin') return false; // 같은 편 터렛엔 안 쏨
        return true;
      });
      if (enemies.length > 0) {
        const tgt = enemies.reduce((a,b) => Math.hypot(a.x-turret.x,a.y-turret.y)<Math.hypot(b.x-turret.x,b.y-turret.y)?a:b);
        const ang = Math.atan2(tgt.y - turret.y, tgt.x - turret.x);
        const spd = 8.4;
        gameState.notes.push({
          x: turret.x, y: turret.y,
          vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd,
          owner: turret.ownerId, r: 7,
          isTurretBullet: true,
          dmg: 7,
        });
      }
    }
  }

  // 정승빈 해바라기 처리 (유도 탄 발사)
  if (!gameState.healBullets) gameState.healBullets = [];
  for (let si = sunflowers.length - 1; si >= 0; si--) {
    const sf = sunflowers[si];
    if (!sf.isHyunLifted) sf.healTimer -= dt;
    sf.rot = (sf.rot || 0) + 0.01;
    if (sf.healTimer <= 0) {
      sf.healTimer = sf.def.skill.healInterval;
      const owner = fighters[sf.ownerId];
      if (owner && owner.hp > 0) {
        // 정승빈 방향으로 유도 탄 발사
        const ang = Math.atan2(owner.y - sf.y, owner.x - sf.x);
        gameState.healBullets.push({
          x: sf.x, y: sf.y,
          vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4,
          targetRef: owner,
          healAmt: 3, r: 10,
        });
        spawnParticle(particles, sf.x, sf.y, '#f5c518', 6);
      }
    }
  }

  // 해바라기 유도 탄 처리
  for (let hi = (gameState.healBullets||[]).length - 1; hi >= 0; hi--) {
    const hb = gameState.healBullets[hi];
    // 유도: 정승빈 방향으로 조향
    const target = hb.targetRef;
    if (!target || target.hp <= 0) { gameState.healBullets.splice(hi, 1); continue; }
    const hdx = target.x - hb.x, hdy = target.y - hb.y;
    const hdist = Math.hypot(hdx, hdy) || 1;
    hb.vx += (hdx/hdist) * (hb.isCloneHeal ? 0.8 : 0.5); // 클론 탄막은 유도 강화
    hb.vy += (hdy/hdist) * (hb.isCloneHeal ? 0.8 : 0.5);
    const hspd = Math.hypot(hb.vx, hb.vy);
    if (hspd > (hb.isCloneHeal ? 8 : 6)) { hb.vx = hb.vx/hspd*(hb.isCloneHeal?8:6); hb.vy = hb.vy/hspd*(hb.isCloneHeal?8:6); }
    hb.x += hb.vx * timeScale; hb.y += hb.vy * timeScale;
    // 맵 밖
    if (hb.x < 0 || hb.x > W || hb.y < 0 || hb.y > H) { gameState.healBullets.splice(hi, 1); continue; }
    // 클론 탄막: 류병헌(본체)만 획득 가능
    if (hb.isCloneHeal) {
      if (!target.sehwanInRoom && Math.hypot(target.x - hb.x, target.y - hb.y) < target.r + hb.r) {
        target.hp = Math.min(target.maxHp, target.hp + hb.healAmt);
        spawnParticle(particles, hb.x, hb.y, '#1a7a1a', 6);
        if (gameState.dmgTexts) gameState.dmgTexts.push({
          x: target.x, y: target.y - target.r - 6,
          text: '+' + hb.healAmt, life: 800, maxLife: 800, vy: -0.4,
          color: '#1a7a1a', fontSize: 12,
        });
        gameState.healBullets.splice(hi, 1);
      }
      continue;
    }
    // 정승빈에게 닿으면 회복
    if (!target.sehwanInRoom && Math.hypot(target.x - hb.x, target.y - hb.y) < target.r + hb.r) {
      target.hp = Math.min(target.maxHp, target.hp + hb.healAmt);
      spawnParticle(particles, hb.x, hb.y, '#f5c518', 6);
      if (gameState.dmgTexts) gameState.dmgTexts.push({
        x: target.x, y: target.y - target.r - 6,
        text: '+' + hb.healAmt, life: 800, maxLife: 800, vy: -0.4,
        color: '#f5c518', fontSize: 12,
      });
      gameState.healBullets.splice(hi, 1);
    }
  }

  // 김혜경T 주사기 처리
  for (let si = (gameState.syringes||[]).length - 1; si >= 0; si--) {
    const syr = gameState.syringes[si];
    syr.x += syr.vx * timeScale; syr.y += syr.vy * timeScale;
    // 벽에 닿으면 소멸
    if (syr.x < 0 || syr.x > W || syr.y < 0 || syr.y > H) {
      gameState.syringes.splice(si, 1); continue;
    }
    // 캐릭터에 닿으면 즉사
    let hit = false;
    fighters.forEach((ft, fi) => {
      if (hit || fi === syr.owner || ft.hp <= 0 || ft.sehwanInRoom) return;
      if (Math.hypot(ft.x - syr.x, ft.y - syr.y) < ft.r + syr.r) {
        ft.lastDmgFrom = syr.owner;
        applyDmg(ft, ft.hp * 100); // 즉사
        spawnParticle(particles, syr.x, syr.y, '#cc0000', 12);
        gameState.syringes.splice(si, 1);
        hit = true;
      }
    });
  }

  // 금일철P 철갑탄 처리
  if (!gameState.geumBullets) gameState.geumBullets = [];
  for (let bi = gameState.geumBullets.length - 1; bi >= 0; bi--) {
    const gb = gameState.geumBullets[bi];
    gb.life -= dt;
    // 유도: 타겟 방향으로 조향
    const tgt = gb.targetRef;
    if (tgt && tgt.hp > 0) {
      const hdx = tgt.x - gb.x, hdy = tgt.y - gb.y;
      const hdist = Math.hypot(hdx, hdy) || 1;
      gb.vx += (hdx/hdist) * 0.7;
      gb.vy += (hdy/hdist) * 0.7;
      const spd = Math.hypot(gb.vx, gb.vy);
      if (spd > 10) { gb.vx = gb.vx/spd*10; gb.vy = gb.vy/spd*10; }
    }
    gb.x += gb.vx * timeScale; gb.y += gb.vy * timeScale;
    // 맵 밖 또는 수명 종료
    if (gb.life <= 0 || gb.x < -50 || gb.x > W+50 || gb.y < -50 || gb.y > H+50) {
      gameState.geumBullets.splice(bi, 1); continue;
    }
    // 적중 판정
    let hit = false;
    fighters.forEach(ft => {
      if (ft.hp <= 0 || ft === fighters[gb.owner]) return;
      if (Math.hypot(ft.x - gb.x, ft.y - gb.y) < ft.r + gb.r) {
        hit = true;
      }
    });
    if (hit) {
      const BLAST_R = 80;
      // 즉시 20데미지 (범위 내)
      fighters.forEach(ft => {
        if (ft.hp <= 0 || ft === fighters[gb.owner]) return;
        if (Math.hypot(ft.x - gb.x, ft.y - gb.y) < BLAST_R + ft.r) {
          ft.lastDmgFrom = gb.owner;
          applyDmg(ft, 20);
        }
      });
      // 불장판 생성 (2초, 0.1초당 0.1dmg)
      if (!gameState.geumFireZones) gameState.geumFireZones = [];
      gameState.geumFireZones.push({
        x: gb.x, y: gb.y, r: BLAST_R,
        life: 2000, maxLife: 2000,
        dmgTimer: 0, owner: gb.owner,
      });
      // 폭발 파티클
      for (let p = 0; p < 20; p++) spawnParticle(particles, gb.x, gb.y, p%3===0?'#ff4400':p%3===1?'#ff8800':'#c8a800', 8);
      gameState.shake = Math.max(gameState.shake||0, 12);
      gameState.geumBullets.splice(bi, 1);
    }
  }

  // 금일철P 불장판 처리
  if (!gameState.geumFireZones) gameState.geumFireZones = [];
  for (let fi2 = gameState.geumFireZones.length - 1; fi2 >= 0; fi2--) {
    const fz = gameState.geumFireZones[fi2];
    fz.life -= dt;
    fz.dmgTimer = Math.max(0, (fz.dmgTimer||0) - dt);
    if (fz.dmgTimer <= 0) {
      fz.dmgTimer = 100; // 0.1초
      fighters.forEach(ft => {
        if (ft.hp <= 0 || ft === fighters[fz.owner]) return;
        if (Math.hypot(ft.x - fz.x, ft.y - fz.y) < fz.r + ft.r) {
          ft.lastDmgFrom = fz.owner;
          applyDmg(ft, 0.1);
        }
      });
    }
    if (fz.life <= 0) gameState.geumFireZones.splice(fi2, 1);
  }

  // 황승오T 폭발물 처리
  const { bombs } = gameState;
  for (let bi = bombs.length - 1; bi >= 0; bi--) {
    const bomb = bombs[bi];
    if (bomb.slowTimer > 0) {
      bomb.slowTimer -= dt;
      bomb.x += bomb.vx * timeScale;
      bomb.y += bomb.vy * timeScale;
      bomb.vx *= 0.92; bomb.vy *= 0.92;
      // 벽 튕김
      if (bomb.x - bomb.r < 0) { bomb.x = bomb.r; bomb.vx = Math.abs(bomb.vx); }
      if (bomb.x + bomb.r > W) { bomb.x = W - bomb.r; bomb.vx = -Math.abs(bomb.vx); }
      if (bomb.y - bomb.r < 0) { bomb.y = bomb.r; bomb.vy = Math.abs(bomb.vy); }
      if (bomb.y + bomb.r > H) { bomb.y = H - bomb.r; bomb.vy = -Math.abs(bomb.vy); }
      if (bomb.slowTimer <= 0) { bomb.vx = 0; bomb.vy = 0; bomb.armed = true; }
    }
    // 잔류 시간 감소 + 자동 폭발
    bomb.lifeTimer = (bomb.lifeTimer || 5200) - dt;
    if (bomb.lifeTimer <= 0) {
      // 자동 폭발 (범위 내 모든 캐릭터)
      fighters.forEach(ft => {
        if (ft.hp <= 0 || ft.def.id === 'seungoh') return;
        if (Math.hypot(ft.x - bomb.x, ft.y - bomb.y) < ft.r + bomb.r + 40) {
          ft.lastDmgFrom = bomb.ownerId;
          applyDmg(ft, 12);
        }
      });
      spawnParticle(particles, bomb.x, bomb.y, '#00aaff', 20);
      gameState.shake = Math.max(gameState.shake || 0, 8);
      bombs.splice(bi, 1);
      continue;
    }
    // 접촉 시 폭발
    let exploded = false;
    fighters.forEach((ft, fi) => {
      if (exploded) return;
      if (ft.hp <= 0) return;
      if (ft.def.id === 'seungoh') return; // 황승오 본인은 폭탄 면역
      if (Math.hypot(ft.x - bomb.x, ft.y - bomb.y) < ft.r + bomb.r) {
        ft.lastDmgFrom = bomb.ownerId;
        applyDmg(ft, 12);
        spawnParticle(particles, bomb.x, bomb.y, '#00aaff', 16);
        gameState.shake = Math.max(gameState.shake || 0, 8);
        bombs.splice(bi, 1);
        exploded = true;
      }
    });
  }

  // 가스 업데이트 (김태양 트름)
  const { gases } = gameState;
  for (let i = gases.length - 1; i >= 0; i--) {
    const g = gases[i];
    g.life -= dt;
    if (g.life <= 0) { gases.splice(i, 1); continue; }
    g.hitCooldown = Math.max(0, g.hitCooldown - dt);
    fighters.forEach((f, fidx) => {
      if (fidx === g.ownerId) return; // 김태양 본인 면역
      if (f.hp <= 0) return;
      const dist = Math.hypot(f.x - g.x, f.y - g.y);
      if (dist < g.r + f.r && g.hitCooldown <= 0) {
        f.poisonTimer = 3000;
        f.poisonDmgTimer = 0;
        g.hitCooldown = 500; // 0.5초마다 재적용
        spawnParticle(gameState.particles, f.x, f.y, '#7abf00', 4);
      }
    });
  }

  // 유채완 머리카락 처리
  const { hairs } = gameState;
  fighters.forEach((enemy, eidx) => {
    if (enemy.hp <= 0) return;
    // 적 캐릭터 머리카락 접촉 (유채완 본인 제외)
    for (let i = hairs.length - 1; i >= 0; i--) {
      const h = hairs[i];
      if (h.ownerId === eidx) continue; // 본인 드롭한 머리카락은 본인에게 안 적용
      const dist = Math.hypot(enemy.x - h.x, enemy.y - h.y);
      if (dist < enemy.r + h.r && !(enemy.hairImmuneTimer > 0)) {
        enemy.hairCount = (enemy.hairCount || 0) + 1;
        gameState.totalHairCollected = (gameState.totalHairCollected || 0) + 1;
        hairs.splice(i, 1);
        // 10개마다 초록 머리카락 생성 (유채완 반대 방향)
        if (gameState.totalHairCollected % 10 === 0) {
          // 유채완 찾기
          const chaewan = gameState.fighters.find(ft => ft.def.id === 'chaewan' && ft.hp > 0);
          if (chaewan) {
            // enemy(머리카락 주운 캐릭터) 반대 방향 = 유채완 → enemy 방향의 반대
            const dx = chaewan.x - enemy.x, dy = chaewan.y - enemy.y;
            const len = Math.hypot(dx, dy) || 1;
            // 유채완에서 반대 방향으로 배치
            const dist2 = chaewan.r * 3;
            gameState.greenHairs.push({
              x: chaewan.x - (dx / len) * dist2,
              y: chaewan.y - (dy / len) * dist2,
              r: 8,
            });
          }
        }
        // 4개 모으면 장판 생성
        const explodeAt = enemy.isByungheonClone ? 2 : 4;
        if (enemy.hairCount >= explodeAt) {
          gameState.hairBlasts = gameState.hairBlasts || [];
          gameState.hairBlasts.push({
            x: enemy.x, y: enemy.y,
            r: 60,
            life: 500,
            maxLife: 500,
            hit: new Set(), // 이미 맞은 캐릭터
          });
          enemy.hairCount = 0;
          enemy.hairImmuneTimer = 1000;
        }
      }
    }
  });

  // 머리카락 단계 효과 적용
  fighters.forEach((f, idx) => {
    if (f.hp <= 0) return;
    const stage = Math.min(4, f.hairCount || 0);
    // 2단계: 슬로우 (speedMult 반영은 통합 복귀에서)
    f.hairSlow = stage >= 2 ? 0.75 : 1.0;       // 속도 배율
    f.hairAtkReduce = stage >= 3 ? 0.7 : 1.0;   // 공격력 배율
    // (폭발은 머리카락 줍는 순간 장판으로 처리)
  });

  // 유채완 머리카락 장판 (hairBlasts)
  gameState.hairBlasts = gameState.hairBlasts || [];
  for (let i = gameState.hairBlasts.length - 1; i >= 0; i--) {
    const blast = gameState.hairBlasts[i];
    blast.life -= dt;
    if (blast.life <= 0) { gameState.hairBlasts.splice(i, 1); continue; }
    // 장판 위 캐릭터에게 데미지 (한 번만)
    fighters.forEach((target, tidx) => {
      if (target.hp <= 0) return;
      if (blast.hit.has(tidx)) return;
      const d = Math.hypot(target.x - blast.x, target.y - blast.y);
      if (d < blast.r + target.r) {
        applyDmg(target, 25);
        blast.hit.add(tidx);
        spawnParticle(particles, target.x, target.y, '#8b4513', 10);
      }
    });
  }

  // 초록 머리카락 (유채완 회복)
  const greenHairs = gameState.greenHairs || [];
  for (let i = greenHairs.length - 1; i >= 0; i--) {
    const gh = greenHairs[i];
    // 유채완만 먹을 수 있음
    fighters.forEach(ft => {
      if (ft.def.id !== 'chaewan' || ft.hp <= 0) return;
      if (Math.hypot(ft.x - gh.x, ft.y - gh.y) < ft.r + gh.r) {
        ft.hp = Math.min(ft.maxHp, ft.hp + 10);
        spawnParticle(particles, gh.x, gh.y, '#00bb44', 8);
        greenHairs.splice(i, 1);
      }
    });
  }

  // Wing particles (김태연)
  fighters.forEach(f => {
    if (!f.wingParticles) return;
    for (let i = f.wingParticles.length - 1; i >= 0; i--) {
      const wp = f.wingParticles[i];
      wp.life -= dt; wp.x += wp.vx; wp.y += wp.vy; wp.vy -= 0.03;
      if (wp.life <= 0) f.wingParticles.splice(i, 1);
    }
  });

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * timeScale; p.y += p.vy * timeScale;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // 데미지 텍스트 업데이트
  if (gameState.dmgTexts) {
    for (let i = gameState.dmgTexts.length - 1; i >= 0; i--) {
      const dt2 = gameState.dmgTexts[i];
      dt2.life -= dt;
      dt2.y += dt2.vy;
      if (dt2.life <= 0) gameState.dmgTexts.splice(i, 1);
    }
  }

  // 경기장 흔들림 감소
  if (gameState.shake > 0) gameState.shake *= 0.82;
  if (gameState.shake < 0.3) gameState.shake = 0;

  // 분열체 사망 시 즉시 fighters 배열에서 제거
  for (let ci = gameState.fighters.length - 1; ci >= 0; ci--) {
    const cf = gameState.fighters[ci];
    // 본체(비분열체)가 죽으면 그 직속 분열체만 hp 0 (손자는 재귀적으로 다음 프레임에 처리)
    if (cf.isByungheonClone && cf.cloneParent && !cf.cloneParent.isByungheonClone && cf.cloneParent.hp <= 0 && cf.hp > 0) {
      cf.hp = 0;
    }
    // hp 0인 분열체 즉시 배열에서 제거
    if (cf.isByungheonClone && cf.hp <= 0) {
      const px = (cf.x > -1000 && cf.x < W+1000) ? cf.x : 100;
      const py = (cf.y > -1000 && cf.y < H+1000) ? cf.y : 100;
      spawnParticle(particles, px, py, cf.def.color, 6);

      // 본체에게 초록 회복탄 발사 (무조건)
      const parent = cf.cloneParent;
      if (parent && parent.hp > 0) {
        if (!gameState.healBullets) gameState.healBullets = [];
        const ang = Math.atan2(parent.y - py, parent.x - px);
        gameState.healBullets.push({
          x: px, y: py,
          vx: Math.cos(ang) * 5, vy: Math.sin(ang) * 5,
          targetRef: parent,
          healAmt: 2, r: 9,
          isCloneHeal: true,
        });
      }

      gameState.fighters.splice(ci, 1);
      if (gameState.dmgDealt) gameState.dmgDealt.splice(ci, 1);
    }
  }

  fighters.forEach((f, idx) => {
    if (f.hp <= 0 && !f._deathCleanup) {
      f._deathCleanup = true;
      // 정승빈 사망: 터렛 + 해바라기 제거
      if (f.def.id === 'seungbin') {
        gameState.turrets = gameState.turrets.filter(t => t.ownerId !== idx);
        gameState.sunflowers = gameState.sunflowers.filter(s => s.ownerId !== idx);
        spawnParticle(gameState.particles, f.x, f.y, '#1a7a1a', 12);
      }
      // 유채완 사망: 머리카락 전부 제거
      if (f.def.id === 'chaewan') {
        gameState.hairs = gameState.hairs.filter(h => h.ownerId !== idx);
        gameState.greenHairs = gameState.greenHairs.filter(h => h.ownerId !== idx);
        spawnParticle(gameState.particles, f.x, f.y, '#8b4513', 12);
      }
    }
  });

  // 사망 판정
  fighters.forEach(f => {
    // 3인 모드에서 죽은 캐릭터를 맵 밖으로 이동 (sehwanInRoom 캐릭터 제외)
    if (f.hp <= 0 && fighters.length >= 3 && !f.deadMoved && !f.sehwanInRoom) {
      f.x = -9999; f.y = -9999;
      f.vx = 0; f.vy = 0;
      f.deadMoved = true;
    }
  });
  const alive = fighters.filter(f => f.hp > 0);
  // 비분열체 생존자 (sehwanInRoom 포함 - 어디 있든 hp로만 판단)
  const aliveReal = alive.filter(f => !f.isByungheonClone);
  const totalReal = fighters.filter(f => !f.isByungheonClone);

  // 류병헌 계열만 남은 경우: 본체 승리
  let byungheonOnlyLeft = false;
  if (aliveReal.length === 1 && aliveReal[0].def.id === 'byungheon' && !aliveReal[0].isByungheonClone) {
    byungheonOnlyLeft = true;
  }

  // 2인: 비분열체 1명 이하면 종료 / 3인: 비분열체 1명 이하면 종료
  const shouldEnd = byungheonOnlyLeft ||
    (aliveReal.length === 0) ||
    (aliveReal.length <= 1 && totalReal.length >= 2 && totalReal.some(f=>f.hp<=0));

  if (shouldEnd) {
    gameState.over = true;
    if (aliveReal.length === 0) {
      gameState.winner = null;
      gameState.draw = true;
    } else {
      gameState.winner = aliveReal[0];
      gameState.draw = false;
    }
  }

  updateBattleUI(fighters);
}

function applyDmg(f, dmg, attacker) {
  if (f.awakeningActive) return; // 무적 중
  if (f.tidalTransforming) return; // TIDAL WAVE 변신 중 무적
  if (f.goldenActive) return; // 골든 상태 무적
  // 류병헌 계열 간 데미지 완전 차단 (루트 본체 기준)
  if (attacker) {
    function byungheonRoot(fighter) {
      let cur = fighter;
      while (cur.isByungheonClone && cur.cloneParent) cur = cur.cloneParent;
      return cur.def.id === 'byungheon' ? cur : null;
    }
    const rootF = byungheonRoot(f);
    const rootA = byungheonRoot(attacker);
    if (rootF && rootA && rootF === rootA) return;
  }
  if (f.def && f.def.id === 'giwon' && f.tidalActive) dmg *= 0.7; // TIDAL WAVE 모든 피해 50% 감소
  // 전체 데미지 보정 없음
  // 각성 후 받는 데미지 20% 증가
  if (f.def.id === 'taeyeon' && f.awakened) dmg *= 1.2;
  // 홍은주T 첫경험 패시브: 해당 캐릭터가 처음 홍은주에게 데미지 입힐 때
  if (f.def && f.def.id === 'eunju' && dmg > 0) {
    const atkIdx = f.lastDmgFrom;
    if (atkIdx !== undefined && gameState) {
      const atk = gameState.fighters[atkIdx];
      if (atk && atk.def && !f.eunjuFirstHit.has(atk.def.id)) {
        f.eunjuFirstHit.add(atk.def.id);
        // 경직 추가
        f.eunjuCharmTargets = f.eunjuCharmTargets || [];
        // 이미 경직 중이면 패스
        if (!f.eunjuCharmTargets.some(ct => ct.ref === atk) && !atk.sehwanInRoom) {
          f.eunjuCharmTargets.push({ ref: atk, timer: 3000, heartTimer: 0 });
          spawnParticle(gameState.particles, atk.x, atk.y, '#ff6688', 12);
          if (gameState.dmgTexts) gameState.dmgTexts.push({
            x: atk.x, y: atk.y - atk.r - 10, text: '첫경험 💕', life: 1200, maxLife: 1200,
            vy: -0.4, color: '#ff6688', fontSize: 13,
          });
        }
      }
    }
  }

  // 수면 중 피해 3배 (1회) - hp 감소 전에 처리
  if ((f.sleepTimer || 0) >= 0 && !f.sleepDamageBoosted) {
    f.sleepDamageBoosted = true;
    dmg *= 3;
    if (gameState && gameState.dmgTexts) gameState.dmgTexts.push({
      x: f.x + 10, y: f.y - f.r - 10, text: '수면공격! ×3', life: 900, maxLife: 900,
      vy: -0.5, color: '#9b70d0', fontSize: 12,
    });
  }

  // 미다스터치 데미지 감소: 공격자(lastDmgFrom)의 geumDmgReduce 적용
  if (gameState && f.lastDmgFrom !== undefined && f.lastDmgFrom >= 0) {
    const attacker4 = gameState.fighters[f.lastDmgFrom];
    if (attacker4 && (attacker4.geumDmgReduce || 0) > 0) {
      dmg = dmg * Math.max(0, 1 - attacker4.geumDmgReduce);
    }
  }

  const prevHp = f.hp;
  f.hp = Math.max(0, f.hp - dmg);
  const actualDmg = prevHp - f.hp;
  // 딜량 집계: 누가 데미지를 입었는지 기록 (피해량 총합)
  if (actualDmg > 0 && gameState && gameState.dmgDealt) {
    let dealerIdx = (f.lastDmgFrom !== undefined) ? f.lastDmgFrom : -1;
    // 분열체가 넣은 딜은 본체 인덱스로 귀속
    if (dealerIdx >= 0) {
      const dealer = gameState.fighters[dealerIdx];
      if (dealer && dealer.isByungheonClone && dealer.cloneParent) {
        const parentIdx = gameState.fighters.indexOf(dealer.cloneParent);
        if (parentIdx >= 0) dealerIdx = parentIdx;
      }
    }
    if (dealerIdx >= 0 && dealerIdx < gameState.dmgDealt.length) {
      gameState.dmgDealt[dealerIdx] += actualDmg;
    }
  }
  if (actualDmg > 0 && gameState && gameState.dmgTexts) {
    gameState.dmgTexts.push({
      x: f.x + (Math.random() - 0.5) * 16,
      y: f.y - f.r - 4,
      text: '-' + Math.round(actualDmg * 10) / 10,
      life: 900,
      maxLife: 900,
      vy: -0.6,
    });
  }
  // 유채완 머리카락 드롭 (데미지 받을 때마다, 1초 쿨타임)
  if (f.def.id === 'chaewan' && dmg > 0 && f.hp > 0) {
    if ((f.hairDropTimer || 0) <= 0) {
      const allDirs = [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}];
      // 4방향 중 랜덤 1개 선택
      const dirs = [allDirs[Math.floor(Math.random()*4)]];
      dirs.forEach(d => {
        gameState.hairs.push({
          x: f.x + d.dx * f.r * 1.5,
          y: f.y + d.dy * f.r * 1.5,
          ownerId: gameState.fighters.indexOf(f),
          r: 6,
        });
      });
      f.hairDropTimer = 1000;
    }
  }

  // 김태연 각성 트리거: hp가 처음으로 50 이하로 떨어질 때
  // 정준우 분노 게이지
  if (f.def.id === 'junjoo' && actualDmg > 0) {
    // 노준우 20% 회피
    if (f.nojunwoo && Math.random() < 0.20) {
      f.hp = Math.min(f.maxHp, f.hp + actualDmg); // 피해 복구 (회피)
      f.dodgeFlicker = 600;
      if (gameState && gameState.dmgTexts) gameState.dmgTexts.push({
        x: f.x, y: f.y - f.r - 10, text: '굳이?', life: 900, maxLife: 900,
        vy: -0.5, color: '#cc3300', fontSize: 15,
      });
    } else {
      // 분노 게이지 충전
      f.rage = Math.min(100, (f.rage || 0) + 5);
      if (f.rage >= 100 && !f.nojunwoo) {
        // 노준우 변신!
        f.nojunwoo = true;
        f.ragePhase = 2;
        f.def = { ...f.def, name: '노준우', color: '#cc3300', touchDmg: 15 };
        // hp회복 없음
        f.nojunwooAnim = 1500;
        f.speedMult = (f.speedMult || 1) * 1.3;
        if (gameState && gameState.dmgTexts) gameState.dmgTexts.push({
          x: f.x, y: f.y - f.r - 14, text: '노준우!!!', life: 2000, maxLife: 2000,
          vy: -0.4, color: '#cc3300', fontSize: 18,
        });
      } else if (f.rage >= 60 && f.ragePhase < 1) {
        f.ragePhase = 1;
        f.def = { ...f.def, touchDmg: 5 };
      }
    }
  }

  // 피해 받으면 수면 해제
  if ((f.sleepTimer || 0) >= 0) {
    f.sleepTimer = -1;
    f.sleepNextTimer = 5000 + Math.random() * 10000; // 5~15초
    // 이동 재개
    const sleepRa = Math.random() * Math.PI * 2;
    f.vx = Math.cos(sleepRa) * BASE_SPEED * (f.speedMult || 1);
    f.vy = Math.sin(sleepRa) * BASE_SPEED * (f.speedMult || 1);
  }

  // 금일철P 아우라: 선생 진영은 30% 감소
  if (gameState) {
    const geumF = gameState.fighters.find(ft => ft.def.id === 'geumilcheol' && ft.hp > 0);
    if (geumF && f === geumF) {
      // 공격자가 선생 진영(TEACHER) 또는 한세환이면 30% 감소
      const atkIdx2 = f.lastDmgFrom;
      if (atkIdx2 !== undefined && atkIdx2 >= 0) {
        const atk2 = gameState.fighters[atkIdx2];
        if (atk2 && (atk2.def.group === 'TEACHER' || atk2.def.id === 'sehwan')) {
          dmg *= 0.7;
        }
      }
    }
  }

  // 건담경윤 흡혈: 피해의 20% 흡수
  if (actualDmg > 0) {
    const dealerIdx3 = f.lastDmgFrom;
    if (dealerIdx3 !== undefined && dealerIdx3 >= 0 && gameState) {
      const dealer3 = gameState.fighters[dealerIdx3];
      if (dealer3 && dealer3.gundamTransformed && dealer3.hp > 0) {
        dealer3.hp = Math.min(dealer3.maxHp, dealer3.hp + actualDmg * 0.2);
      }
    }
  }

  // 노준우 흡혈: 공격자가 노준우면 피해의 10% 흡수
  if (actualDmg > 0) {
    // lastDmgFrom으로 공격자 확인
    const dealerIdx2 = f.lastDmgFrom;
    if (dealerIdx2 !== undefined && dealerIdx2 >= 0 && gameState) {
      const dealer2 = gameState.fighters[dealerIdx2];
      if (dealer2 && dealer2.nojunwoo && dealer2.hp > 0) {
        dealer2.hp = Math.min(dealer2.maxHp, dealer2.hp + actualDmg * 0.1);
      }
    }
  }

  // 황승오T 골든 패시브: 15 이상 데미지 1회 한정 발동
  if (f.def.id === 'seungoh' && !f.goldenTriggered && actualDmg >= 15 * 0.8) {
    // dmg *= 0.8 적용됐으므로 실제 15 이상이면 actualDmg >= 12
    f.goldenTriggered = true;
    f.goldenActive = true;
    f.goldenTimer = 2000;
    // 받은 피해 복구
    f.hp = Math.min(f.maxHp, f.hp + actualDmg);
    f.vx = 0; f.vy = 0;
    if (gameState && gameState.dmgTexts) {
      gameState.dmgTexts.push({
        x: f.x, y: f.y - f.r - 12, text: 'GOLDEN!', life: 1800, maxLife: 1800,
        vy: -0.4, color: '#ffd700', fontSize: 16,
      });
    }
  }

  if (f.def.id === 'taeyeon' && !f.awakened && f.hp <= 50 && prevHp > 50) {
    f.awakened = true;
    f.awakeningActive = true;
    f.awakeningTimer = 1000; // 1초 무적
    f.wingProgress = 0;
    f.wingParticles = [];
    // 멈춤
    f.vx = 0; f.vy = 0;
  }
}

function spawnParticle(particles, x, y, color, count = 6) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = Math.random() * 1.8 + 0.4;
    particles.push({ x, y, vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd, life: 350, maxLife: 350, color, r: Math.random()*2.5+1 });
  }
}

function renderRoom() {
  const roomCanvas = document.getElementById('roomCanvas');
  if (!roomCanvas || !gameState) return;
  const hasSehwan = gameState.fighters.some(ft => ft.def.id === 'sehwan');
  if (!hasSehwan) return;
  const rctx = roomCanvas.getContext('2d');
  const RW = roomCanvas.width, RH = roomCanvas.height;

  // 배경
  rctx.clearRect(0, 0, RW, RH);
  rctx.fillStyle = gameState.sehwanRoom ? '#edfff4' : '#f8f8f8';
  rctx.fillRect(0, 0, RW, RH);

  // 테두리 캔버스에 직접 그리기
  const active = gameState.sehwanRoom;
  rctx.strokeStyle = active ? '#1a6b3a' : '#bbb';
  rctx.lineWidth = active ? 4 : 2;
  rctx.strokeRect(2, 2, RW-4, RH-4);

  // 제목
  rctx.fillStyle = active ? '#1a6b3a' : '#aaa';
  rctx.font = 'bold 13px sans-serif';
  rctx.textAlign = 'center';
  rctx.textBaseline = 'top';
  rctx.fillText('진실의 방', RW/2, 8);

  // 타이머
  if (active) {
    const sf = gameState.fighters.find(ft => ft.def.id === 'sehwan');
    if (sf) {
      rctx.fillStyle = '#1a6b3a';
      rctx.font = 'bold 20px sans-serif';
      rctx.textBaseline = 'bottom';
      rctx.fillText(Math.ceil((sf.sehwanRoomTimer||0)/1000) + 's', RW/2, RH-8);
    }
  }

  // 캐릭터 렌더
  gameState.fighters.forEach(f => {
    if (!f.sehwanInRoom || f.hp <= 0) return;
    const rx = f.x - 10000;
    const ry = f.y;
    rctx.save();
    // 캐릭터 원
    rctx.fillStyle = f.def.color;
    rctx.beginPath(); rctx.arc(rx, ry, f.r, 0, Math.PI*2); rctx.fill();
    // 이름
    rctx.fillStyle = '#fff';
    rctx.font = 'bold 11px sans-serif';
    rctx.textAlign = 'center'; rctx.textBaseline = 'middle';
    rctx.strokeStyle = 'rgba(0,0,0,0.7)'; rctx.lineWidth = 3;
    rctx.strokeText(f.def.name, rx, ry);
    rctx.fillText(f.def.name, rx, ry);
    // HP 바
    const bw = f.r * 2.4, bx = rx - bw/2, by = ry - f.r - 12;
    rctx.fillStyle = '#ddd'; rctx.fillRect(bx, by, bw, 6);
    const hpPct = Math.max(0, f.hp / f.maxHp);
    rctx.fillStyle = hpPct > 0.5 ? f.def.color : hpPct > 0.25 ? '#e8900a' : '#cc2020';
    rctx.fillRect(bx, by, bw * hpPct, 6);
    rctx.strokeStyle = 'rgba(0,0,0,0.2)'; rctx.lineWidth = 0.8;
    rctx.strokeRect(bx, by, bw, 6);
    // HP 수치
    rctx.fillStyle = '#333'; rctx.font = 'bold 9px sans-serif';
    rctx.textBaseline = 'bottom';
    rctx.fillText(Math.ceil(f.hp) + '/' + f.maxHp, rx, by);
    rctx.restore();
  });

  // 데미지 텍스트 (sehwanInRoom 캐릭터 좌표 기준)
  if (gameState.dmgTexts) {
    gameState.dmgTexts.forEach(dt2 => {
      // x가 10000 이상이면 진실의 방 텍스트
      if (dt2.x < 9000) return;
      const rx = dt2.x - 10000;
      const ry = dt2.y;
      const alpha = dt2.life / dt2.maxLife;
      rctx.save();
      rctx.globalAlpha = alpha;
      rctx.font = `bold ${dt2.fontSize || 13}px sans-serif`;
      rctx.fillStyle = dt2.color || '#cc0000';
      rctx.strokeStyle = 'rgba(255,255,255,0.8)';
      rctx.lineWidth = 2.5;
      rctx.textAlign = 'center';
      rctx.textBaseline = 'middle';
      rctx.strokeText(dt2.text, rx, ry);
      rctx.fillText(dt2.text, rx, ry);
      rctx.restore();
    });
  }

  // 손바닥 휘두르기 애니메이션 (진실의 방)
  gameState.fighters.forEach(f => {
    if (f.def.id !== 'sehwan' || !f.sehwanInRoom || (f.sehwanSlapAnim||0) <= 0) return; // room 전용
    const rx = f.x - 10000, ry = f.y;
    const prog = f.sehwanSlapAnim / 400;
    const slapLen = f.r * 5.5;
    rctx.save();
    rctx.globalAlpha = prog * 0.85;
    // 호 그리기
    rctx.strokeStyle = '#1a6b3a';
    rctx.lineWidth = 6 * prog;
    rctx.lineCap = 'round';
    const startAng = f.sehwanSlapAngle - Math.PI * 0.6 * prog;
    const endAng = f.sehwanSlapAngle + Math.PI * 0.6 * prog;
    rctx.beginPath();
    rctx.arc(rx, ry, slapLen, startAng, endAng);
    rctx.stroke();
    // 손 아이콘
    rctx.font = `${Math.round(18 * prog)}px sans-serif`;
    rctx.textAlign = 'center';
    rctx.textBaseline = 'middle';
    rctx.fillText('🖐️', rx + Math.cos(f.sehwanSlapAngle) * slapLen, ry + Math.sin(f.sehwanSlapAngle) * slapLen);
    rctx.restore();
  });

  // 충격파 렌더 (진실의 방 전용)
  if (gameState.soundwaves) {
    gameState.soundwaves.forEach(sw => {
      if (!sw.isSehwanShock) return;
      const rx = sw.x - 10000;
      const ry = sw.y;
      rctx.save();
      rctx.globalAlpha = (sw.life / 600) * 0.75;
      rctx.strokeStyle = '#1a6b3a';
      rctx.lineWidth = 3.5;
      rctx.beginPath();
      rctx.arc(rx, ry, sw.r, 0, Math.PI*2);
      rctx.stroke();
      rctx.restore();
    });
  }
}

function render(ctx) {
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  // 카메라 고정 모드
  let _camApplied = false;
  if (cameraTarget >= 0 && gameState) {
    const realFighters = gameState.fighters.filter(f => !f.isByungheonClone);
    const tf = realFighters[cameraTarget];
    if (tf && tf.hp > 0 && tf.x > -1000) {
      const cx = tf.x, cy = tf.y;
      ctx.save();
      ctx.translate(W/2 - cx * cameraZoom, H/2 - cy * cameraZoom);
      ctx.scale(cameraZoom, cameraZoom);
      _camApplied = true;
    }
  }

  // 경기장 흔들림
  const shake = gameState ? (gameState.shake || 0) : 0;
  const sx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  const sy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
  if (shake > 0) ctx.translate(sx, sy);
  // 메인 경기장 (translate 없음)
  const hasSehwan = gameState && gameState.fighters && gameState.fighters.some(ft => ft.def.id === 'sehwan');
  const mainOX = 0;

  // 홍은주T 삼각비: 삼각형 클리핑
  const _eunjuClip = !!(gameState && gameState.eunjuTriangle);
  if (_eunjuClip) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.clip();
  }

  ctx.fillStyle = '#fff';
  ctx.fillRect(-10, -10, W + 20, H + 20);



  const { fighters, notes, particles, walls } = gameState;

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife * 0.8;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 김혜경 주사기 렌더
  (gameState.syringes || []).forEach(syr => {
    ctx.save();
    ctx.translate(syr.x, syr.y);
    ctx.rotate(syr.angle + Math.PI/2);
    // 주사기 몸통
    ctx.fillStyle = '#ddd';
    ctx.strokeStyle = '#999';
    ctx.lineWidth = 1;
    ctx.fillRect(-4, -14, 8, 20);

  // 검 휘두르기 애니메이션

  // 금일철P 불장판 렌더

  // 정승빈 해바라기 렌더
  (gameState.sunflowers || []).forEach(sf => {

  // 가스 (김태양 트름)
  gameState.gases.forEach(g => {

  });

  // Gears (김기원 톱니바퀴)
  gameState.gears.forEach(gear => {
    ctx.save();
    ctx.translate(gear.x, gear.y);
    ctx.rotate(gear.rotation);

    const teeth = gear.teethCount;
    const innerR = gear.r * 0.72;
    const outerR = gear.r;
    const toothW = Math.PI / teeth * 0.55; // 치폭(라디안)

    // 톱니바퀴 몸통 그라디언트
    const gg = ctx.createRadialGradient(0, 0, innerR * 0.3, 0, 0, outerR);

    for (let i = 0; i < teeth; i++) {

      const a1 = baseAngle;
      const a2 = baseAngle + toothW;
      const a3 = baseAngle + Math.PI / teeth;
      ctx.lineTo(Math.cos(a0) * innerR, Math.sin(a0) * innerR);
      ctx.lineTo(Math.cos(a0) * outerR, Math.sin(a0) * outerR);
      ctx.lineTo(Math.cos(a2) * outerR, Math.sin(a2) * outerR);
      ctx.lineTo(Math.cos(a2) * innerR, Math.sin(a2) * innerR);
      ctx.lineTo(Math.cos(a3) * innerR, Math.sin(a3) * innerR);

    ctx.fillStyle = gg;

    ctx.strokeStyle = '#555';

      const tx = wall.x + SPIKE_DX[d] * (h + sk);
      const ty = wall.y + SPIKE_DY[d] * (h + sk);

      // Spike gradient matching wall
      let sgrad;
      if (d === 0) { // top: tip top, base bottom
        sgrad = ctx.createLinearGradient(tx, ty, bx, by);
        sgrad.addColorStop(0, '#111111');
        sgrad.addColorStop(1, '#1a1a6e');
      } else if (d === 2) { // bottom: base top, tip bottom

        sgrad.addColorStop(0, '#111111');
        sgrad.addColorStop(1, '#1a1a6e');
      } else {
        // left/right: blend vertically through wall center
        sgrad = ctx.createLinearGradient(wall.x, wall.y - h, wall.x, wall.y + h);
        sgrad.addColorStop(0, '#111111');
        sgrad.addColorStop(1, '#1a1a6e');
      }

      // Draw spike as triangle
      const perp = d % 2 === 0 ? 5 : 5; // half-width of spike base
      let p1x, p1y, p2x, p2y;
      if (d % 2 === 0) { // top/bottom: perpendicular is horizontal
        p1x = bx - perp; p1y = by;
        p2x = bx + perp; p2y = by;
      } else { // left/right: perpendicular is vertical
        p1x = bx; p1y = by - perp;
        p2x = bx; p2y = by + perp;
      }

      ctx.fillStyle = sgrad;
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(p1x, p1y);

      ctx.closePath();
      ctx.fill();

  // 음파 / 폭발 링
  gameState.soundwaves.forEach(sw => {

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = sw.isGundamShockwave ? '#cc0000' : sw.isHairExplosion ? '#8b4513' : '#ff6b00';
